<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Traspaso Paid Media · Wasabi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --g:#004612; --g2:#0A5A22; --lime:#92C100; --cream:#F7F5EE; --ink:#10201A; --muted:#5C665D;
  --line:#E1E4DA; --white:#fff; --orange:#FE7A02; --olive:#82690A; --lav:#C8BFFA; --violet:#703873;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:150px}
body{margin:0;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--cream);color:var(--ink);line-height:1.6;font-size:15px}
a{color:var(--g2)}
/* ---------- Top bar ---------- */
.top{position:sticky;top:0;z-index:50;background:var(--g);color:#fff}
.top-in{max-width:1280px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.logo{display:flex;align-items:baseline;gap:10px;text-decoration:none}
.logo b{font-size:1.25rem;font-weight:800;letter-spacing:.14em;color:var(--lime)}
.logo span{font-size:.78rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#cfe3c6}
.search{margin-left:auto;position:relative;width:min(380px,100%)}
.search input{width:100%;padding:10px 14px 10px 38px;border-radius:999px;border:1.5px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;font:inherit;font-size:.9rem;outline:none}
.search input::placeholder{color:#b9d3ae}
.search input:focus{border-color:var(--lime);background:rgba(255,255,255,.14)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.8}
.results{position:absolute;right:0;top:calc(100% + 8px);width:min(520px,92vw);max-height:60vh;overflow:auto;background:#fff;color:var(--ink);border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.3);display:none;border-top:4px solid var(--lime)}
.results.on{display:block}
.res{display:block;padding:11px 16px;border-bottom:1px solid var(--line);cursor:pointer;text-decoration:none;color:inherit}
.res:hover{background:var(--cream)}
.res small{display:block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--g2)}
.res span{font-size:.85rem;color:var(--muted)}
.res mark{background:#e6f3b5;padding:0 2px;border-radius:3px}
.nores{padding:16px;color:var(--muted);font-size:.9rem}
.tabs{background:var(--g2)}
.tabs-in{max-width:1280px;margin:0 auto;padding:0 24px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin}
.tab{appearance:none;border:0;background:transparent;color:#d8e8d0;font:inherit;font-weight:600;font-size:.9rem;padding:12px 18px;cursor:pointer;white-space:nowrap;border-bottom:4px solid transparent}
.tab:hover{color:#fff}
.tab.on{color:var(--lime);border-bottom-color:var(--lime)}
/* ---------- Layout ---------- */
.wrap{max-width:1280px;margin:0 auto;padding:28px 24px 60px}
.panel{display:none}
.panel.on{display:block}
.hero{background:var(--g);color:#fff;border-radius:16px;padding:34px 38px;margin-bottom:26px;border-bottom:6px solid var(--lime)}
.hero .eyebrow{font-size:.74rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--lime)}
.hero h1{margin:6px 0 8px;font-size:2.1rem;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.hero p{margin:0;color:#d4e6cc;max-width:820px}
.hero .meta{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}
.chip{display:inline-block;font-size:.78rem;font-weight:700;padding:5px 12px;border-radius:999px;background:var(--lime);color:var(--g)}
.chip.o{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.35)}
.grid{display:grid;grid-template-columns:230px 1fr;gap:34px;align-items:start}
.index{position:sticky;top:130px;font-size:.88rem}
.index h4{margin:0 0 10px;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.index a{display:block;padding:7px 12px;border-left:3px solid var(--line);color:var(--muted);text-decoration:none;font-weight:500}
.index a:hover{color:var(--g);border-left-color:var(--lime)}
.index a.on{color:var(--g);font-weight:700;border-left-color:var(--g);background:#fff}
.content section{background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px 32px;margin-bottom:22px}
.content h2{margin:0 0 16px;font-size:1.35rem;font-weight:800;letter-spacing:-.01em;color:var(--g);display:flex;align-items:center;gap:12px}
.content h2 .n{display:inline-grid;place-items:center;min-width:34px;height:34px;border-radius:9px;background:var(--g);color:var(--lime);font-size:.9rem}
.content h3{margin:22px 0 8px;font-size:1rem;font-weight:700;color:var(--g)}
.content p{margin:0 0 12px}
.content ul,.content ol{margin:0 0 14px;padding-left:22px}
.content li{margin-bottom:6px}
/* ---------- Components ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:6px 0 16px}
.card{border:1px solid var(--line);border-top:4px solid var(--lime);border-radius:12px;padding:16px 18px;background:var(--cream)}
.card b{display:block;color:var(--g);margin-bottom:4px}
.card p{margin:0;font-size:.9rem;color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:4px 0 18px}
.kpi{background:var(--g);color:#fff;border-radius:12px;padding:16px 18px}
.kpi .v{font-size:1.7rem;font-weight:800;color:var(--lime);line-height:1.1}
.kpi .l{font-size:.8rem;font-weight:600;margin-top:4px}
.kpi .s{font-size:.74rem;color:#b9d3ae;margin-top:2px}
.tw{overflow-x:auto;margin:6px 0 16px;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.9rem;background:#fff}
th{background:var(--g);color:#fff;font-weight:700;padding:11px 14px;text-align:center;font-size:.82rem;letter-spacing:.02em}
td{padding:10px 14px;border-top:1px solid var(--line);text-align:center;vertical-align:middle}
th:first-child,td:first-child{text-align:left}
table.left td,table.left th{text-align:left}
tr:nth-child(even) td{background:#fafaf6}
tr.total td{background:#eef6d4;font-weight:800;color:var(--g)}
.note{font-size:.82rem;color:var(--muted);margin:-6px 0 14px}
.call{border-radius:12px;padding:14px 18px;margin:12px 0 16px;border-left:6px solid var(--lime);background:#f1f7dc}
.call b.t{display:block;font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px;color:var(--g)}
.call.warn{border-left-color:var(--orange);background:#fff1e2}
.call.warn b.t{color:#b25100}
.call.info{border-left-color:var(--violet);background:#f0ecfd}
.call.info b.t{color:var(--violet)}
.call p:last-child{margin-bottom:0}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.tag.alta{background:#ffe3c7;color:#a24800}
.tag.media{background:#f1e8b8;color:#6b5606}
.tag.admin{background:#e5e0fc;color:#4f2a52}
.tag.ok{background:#dff0b0;color:var(--g)}
.tag.pend{background:#ffe3c7;color:#a24800}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.lk{display:block;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:13px 16px;background:var(--cream);transition:.15s}
.lk:hover{border-color:var(--g);background:#fff;transform:translateY(-1px)}
.lk b{display:flex;justify-content:space-between;gap:8px;color:var(--g);font-size:.93rem}
.lk b i{font-style:normal;color:var(--lime);background:var(--g);border-radius:6px;padding:0 7px;font-size:.8rem}
.lk span{display:block;font-size:.83rem;color:var(--muted);margin-top:2px}
.lk em{display:block;font-size:.72rem;color:#8a948b;font-style:normal;margin-top:4px}
.steps{counter-reset:s;list-style:none;padding:0!important}
.steps li{counter-increment:s;position:relative;padding:10px 14px 10px 54px;background:var(--cream);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
.steps li::before{content:counter(s);position:absolute;left:14px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;background:var(--g);color:var(--lime);display:grid;place-items:center;font-weight:800;font-size:.85rem}
.foot{text-align:center;color:var(--muted);font-size:.8rem;padding:10px 0 0}
.flash{animation:fl 1.8s ease}
@keyframes fl{0%,40%{box-shadow:0 0 0 4px var(--lime)}100%{box-shadow:0 0 0 0 transparent}}
.tag.hist{background:#e5e0fc;color:#4f2a52}
td ul,td ol{margin:0;padding-left:18px;text-align:left}
.call ul,.call ol{margin:6px 0 0}
.call p{margin:0 0 8px}
.content h3:first-child{margin-top:0}
.content a{overflow-wrap:anywhere}
.links{margin-bottom:16px}
.lk b i{align-self:flex-start;flex:none}
@media(max-width:900px){
  .grid{grid-template-columns:1fr;gap:16px}
  .index{position:static;display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
  .index h4{display:none}
  .index a{border-left:0;border-bottom:3px solid var(--line);white-space:nowrap;padding:6px 10px}
  .index a.on{border-bottom-color:var(--g)}
  .hero{padding:24px 22px}.hero h1{font-size:1.6rem}
  .content section{padding:20px 18px}
  .search{margin-left:auto;width:auto;flex:1}
  .top-in{padding:10px 16px;gap:10px;flex-wrap:nowrap}
  .logo span{display:none}
  html{scroll-padding-top:110px}
  .tabs-in{padding:0 8px}
}
@media print{
  .top,.index,.search{display:none!important}
  body{background:#fff}
  .panel{display:none!important}.panel.on{display:block!important}
  .grid{display:block}
  .content section{break-inside:avoid;border:1px solid #ccc}
  .hero{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .kpi,th,.tag,.call,tr.total td{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <a class="logo" href="#inicio"><b>WASABI</b><span>Paid Media · Traspaso de cuentas</span></a>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="q" type="search" placeholder="Buscar en todas las marcas (ej: presupuesto, WhatsApp, Looker)" autocomplete="off">
      <div id="results" class="results"></div>
    </div>
  </div>
  <nav class="tabs"><div class="tabs-in" id="tabs"></div></nav>
</header>

<main class="wrap" id="app"></main>

<script>
/* =====================================================================
   DATOS · Para agregar una marca: copiar un objeto de BRANDS y completar.
   Tipos de bloque: p, ul, steps, cards, kpis, table, callout, links
   ===================================================================== */

const T = {
  alta:'<span class="tag alta">Alta</span>',
  media:'<span class="tag media">Media</span>',
  admin:'<span class="tag admin">Administrativa</span>'

const HOME = {
  title:'Traspaso de cuentas Paid Media',
  lead:'Base de conocimiento para continuidad operativa. Pensada para que cualquier integrante del equipo Paid pueda tomar una cuenta sin depender de quien la llevaba.',

    '<b>Confirmar destinos y recepción real</b> de las campañas de Mensajes a WhatsApp y de los eventos de medición (GTM, Pixel, Schedule), sobre todo después de duplicar campañas o anuncios.',
    '<b>Identificar las fuentes de verdad del reporte</b> de la marca: qué sale de la plataforma, qué de Looker, qué de planillas del cliente. No sumar alcances de plataformas distintas como si fueran personas únicas.',
    '<b>Revisar cuentas y migraciones en curso.</b> Hay marcas con cuenta Meta nueva (Aleph) creada y migración de pauta todavía sin confirmar: validar permisos, activos, dataset, facturación y primer gasto antes de operar.',
    '<b>No dar por confirmado el responsable Paid de cada marca.</b> En la mayoría de las cuentas la asignación dentro del equipo (Flor, Pimi, Mono u otra persona) figura pendiente: comunicarla y actualizar contactos y accesos.',
    '<b>Leer los pendientes y hitos</b> de la sección de continuidad de cada marca.'
  ]
};

const BRANDS = [
{
  id:'foquier', name:'Foquier', asof:'22 de octubre de 2026',
  tagline:'Base de conocimiento y continuidad operativa',
  chips:['Meta Ads','Último cierre acreditado: septiembre 2026'],
  alert:'Último cierre acreditado: septiembre 2026. Octubre requiere planilla vigente.',
  home:{canales:'Meta Ads', inversion:'USD 2.436,37 ejecutados en septiembre (octubre sin verificar)', pendiente:'Presupuesto y configuración de octubre sin documentar; responsable de cuenta no confirmado.'},
  sections:[
  {id:'resumen',title:'Resumen y objetivos',blocks:[
    {t:'p',h:'La gestión de Foquier se realiza en <b>Meta Ads</b> y combina construcción de marca, comunidad, tráfico y generación de consultas comerciales. El principal criterio de éxito no es el volumen de mensajes por sí solo: interesa <b>la calidad del contacto y su avance a visita</b>.'},
    {t:'cards',items:[

      {b:'AVIT / Avenida Italia',p:'Proyecto en Av. Italia y Francisco Simón. Campaña de <b>Tráfico al brochure</b> como paso de consideración, no equivalente a una visita presencial.'}
    ]}
  ]},
  {id:'objetivos',title:'Objetivos y KPIs por frente',blocks:[
    {t:'table',head:['Frente','Campaña','Qué se mide'],rows:[
      ['Foquier marca','Alcance','Cobertura, frecuencia, CPM'],
      ['Foquier marca','Tráfico al perfil','Clics y seguidores'],
      ['AVIT','Tráfico al brochure','Visitas al brochure, CTR, CPC'],
      ['CN1722','Mensajes a WhatsApp','Mensajes, costo, proporción de contactos buenos y visitas concretadas']
    ]}
  ]},
  {id:'inversion',title:'Estructura económica',blocks:[
    {t:'table',head:['Meta Ads · septiembre 2026','Inversión real (USD)'],rows:[

      {total:true,cells:['Total ejecutado','2.436,37']}

  {id:'evolucion',title:'Evolución de decisiones',blocks:[

      ['Junio 2026','Se eliminó la campaña de Leads. Continúan Alcance, Tráfico y Mensajes.'],
      ['Julio 2026','Contenido de financiación («Cocina»/cuotas) elevó el volumen de mensajes, pero atrajo perfiles comerciales menos adecuados.'],

    {t:'table',head:['Mes','Clasificados','Buenos','Regulares','Malos','Visitas'],rows:[

  {id:'flujo',title:'Flujo de WhatsApp y seguimiento comercial',blocks:[

  ]},
  {id:'reporting',title:'Reporting mensual y puntos sensibles',blocks:[
    {t:'p',h:'El reporte de Meta agrupa <b>Alcance, Tráfico al perfil, Tráfico AVIT y Mensajes CN1722</b>. Debe cruzarse con la <b>planilla de contactos</b> para entender la calidad y con la evolución orgánica del perfil.'},

  {id:'accesos',title:'Accesos y recursos',blocks:[
    {t:'links',items:[
      {n:'Meta Ads Foquier',u:'https://adsmanager.facebook.com/adsmanager/manage/campaigns?act=1455984604874699&business_id=741152185920682&global_scope_id=741152185920682',d:'Campañas de Meta Ads'},

   "id": "la-cuenta-en-un-minuto",
   "title": "La cuenta en un minuto",
   "blocks": [
    {
     "t": "raw",
     "h": "<div class=\"tw\"><table class=\"left\"><thead><tr><th>Dimensión<\/th><th>Situación a conocer<\/th><\/tr><\/thead><tbody><tr><td>Marca y local<\/td><td>Artesia café, Rostand 1555, Carrasco (Montevideo). café colombiano tostado en origen, gastronomia y espacio cultural.<\/td><\/tr><tr><td>Alcance efectivo de la pauta<\/td><td>Entre junio y septiembre la inversión Paid se concentró en Cafetería. En octubre se trabajó una propuesta de Moda SS27 bajo «Cocoon» que no fue aprobada por el naming. Nueva salida prevista; «Saint-Tropez» es nombre probable, no definitivo. PDM de Moda aún por validar.<\/td><\/tr><tr><td>Canales<\/td><td>Meta Ads: Alcance, Mensajes y tráfico a Meitre; TikTok: Alcance; Google Ads: Search General y Brand desde agosto. PMax es antecedente.<\/td><\/tr><tr><td>Problema de performance<\/td><td>Las reservas y los mensajes no justificaban por si solos la inversión de performance. Se analizaron nuevos destinos, atribución y posibles reasignaciones a branding / influencers.<\/td><\/tr><tr><td>Estado de medición<\/td><td>Google Ads midio reservas de Meitre y acciones locales; en septiembre se cambio el destino web. Meta Pixel y evento nativo Schedule fueron probados a fines de septiembre; campaña Ventas no consta implementada.<\/td><\/tr><tr><td>Advertencia operacional<\/td><td>Revisar PDM, cronograma, destinos, segmentación, medios de pago y scope Cafetería vs Moda ANTES de cada activación.<\/td><\/tr><\/tbody><\/table><\/div>"
    }
   ]
  },
  {
   "id": "contexto-de-marca-servicios-y-limites-de",
   "title": "Contexto de marca, servicios y límites del scope",
   "blocks": [
    {
     "t": "raw",
     "h": "<p>Artesia integra cafetería, arte, objetos, moda y propuestas culturales en un espacio de Carrasco. El universo de marca no debe confundirse con lo que abarca la compra de medios. Entre mayo y septiembre, el trabajo pago se focalizo en <strong>Artesia café<\/strong>: visitas al local, café de especialidad, productos de la carta y reservas. La tienda, piezas de arte y artesanias funcionaban como contexto del espacio, no como objetivos comerciales propios de Paid.<\/p><p>En octubre se propuso Moda SS27 con el nombre de trabajo <strong>Cocoon<\/strong>. El cliente no lo aprobó. La campaña se prevé próximamente con otro nombre, probablemente «Saint-Tropez» (sin confirmar). PDM, objetivos y medición deben validarse por separado de Cafetería.<\/p><ul><li>Identidad de café: café de Colombia tostado en origen, preparaciones y delicatessen de autor; el espacio cultural es un diferencial para la elección del lugar.<\/li><li>Comunicación en Paid: breve, directa, cercana y cuidada. Dar contexto concreto sobre producto y local; evitar una prosa excesivamente poetica y la dependencia de descuentos.<\/li><li>Origen de marca: manual de contenidos, manual de estrategia y plan de medios. No trasladar automaticamente ideas editoriales de Artesia Experience a anuncios de café.<\/li><\/ul>"
    }
   ]
  },

   "blocks": [
    {
     "t": "raw",
     "h": "<div class=\"tw\"><table class=\"left\"><thead><tr><th>Momento<\/th><th>Cambio / hecho<\/th><th>Estado<\/th><\/tr><\/thead><tbody><tr><td>Mayo 2026<\/td><td>PDM inicial de USD 3.320 con Meta Alcance, Mensajes, PMax y TikTok. Se trabajo la vinculación de activos Meta y la propiedad del portfolio.<\/td><td>Plan original; propiedad Meta a verificar<\/td><\/tr><tr><td>20-23 jun 2026<\/td><td>Primeras activaciones de Meta; interrupciones por rechazos de tarjeta. Inicio de pauta con menor cantidad de días efectivos.<\/td><td>Ejecutado; antecedente de pagos<\/td><\/tr><tr><td>Julio 2026<\/td><td>Meta Mensajes escala; TikTok completa su primer mes. PMax deriva clics a Meitre pero produce una sola reserva.<\/td><td>Resultados cerrados<\/td><\/tr><tr><td>Agosto 2026<\/td><td>Se abandona PMax como eje y se ponen en funcionamiento Search General y Brand. Se vincula el perfil de ubicación de Artesia para Maps. Se ajustan edades de Meta Mensajes.<\/td><td>Implementado, según reporte<\/td><\/tr><tr><td>Mitad sept 2026<\/td><td>Por bajo rendimiento, se activa Tráfico a Meitre desde Meta y se reduce el peso de Mensajes. En Google Search se sustituye destino Meitre por la web de Artesia.<\/td><td>Implementado, según cierre septiembre<\/td><\/tr><tr><td>28-29 sept 2026<\/td><td>Pruebas de GTM / Meitre y Pixel Meta. Se registra un Schedule nativo recibido para una reserva de prueba.<\/td><td>Prueba documentada; verificar vigencia<\/td><\/tr><tr><td>Octubre 2026<\/td><td>Se estudiaron dos escenarios de inversión para Moda SS27 bajo el nombre de trabajo Cocoon. El cliente no aprobó ese nombre; a 28/10 se prevé una salida con nueva denominación, probablemente «Saint-Tropez». En paralelo se propuso revisar performance vs. branding/influencers.<\/td><td>Cocoon no aprobado; «Saint-Tropez» tentativo; nueva campaña y PDM sin confirmación<\/td><\/tr><\/tbody><\/table><\/div>"
    }
   ]
  },

    {
     "t": "raw",
     "h": "<h3>Plan original de mayo<\/h3><div class=\"tw\"><table class=\"\"><thead><tr><th>Canal / objetivo<\/th><th>Presupuesto mensual inicial<\/th><\/tr><\/thead><tbody><tr><td>Meta Alcance<\/td><td>USD 800<\/td><\/tr><tr><td>Meta Mensajes<\/td><td>USD 1.000<\/td><\/tr><tr><td>Google Ads PMax<\/td><td>USD 800<\/td><\/tr><tr><td>TikTok Alcance<\/td><td>USD 720<\/td><\/tr><tr class=\"total\"><td>Total<\/td><td><strong>USD 3.320<\/strong><\/td><\/tr><\/tbody><\/table><\/div><p>Estos son los montos del documento de planificación de mayo. <strong>No utilizar esta distribución como si fuera la vigente en septiembre u octubre.<\/strong> En agosto y septiembre cambiaron tanto los objetivos como la distribución.<\/p><h3>Base de redistribución utilizada en octubre para café<\/h3><div class=\"tw\"><table class=\"\"><thead><tr><th>Plataforma<\/th><th>campaña<\/th><th>USD base<\/th><\/tr><\/thead><tbody><tr><td>Meta<\/td><td>Alcance Always On<\/td><td>500<\/td><\/tr><tr><td>Meta<\/td><td>Alcance promocionado<\/td><td>300<\/td><\/tr><tr><td>Meta<\/td><td>Mensajes<\/td><td>600<\/td><\/tr><tr><td>Meta<\/td><td>Tráfico a Meitre<\/td><td>400<\/td><\/tr><tr><td>TikTok<\/td><td>Alcance<\/td><td>720<\/td><\/tr><tr><td>Google<\/td><td>Search General<\/td><td>700<\/td><\/tr><tr><td>Google<\/td><td>Search Brand<\/td><td>100<\/td><\/tr><tr class=\"total\"><td><strong>Total<\/strong><\/td><td><strong>Base café<\/strong><\/td><td><strong>3.320<\/strong><\/td><\/tr><\/tbody><\/table><\/div><div class=\"call\"><b class=\"t\">Control mensual obligatorio<\/b><p>La base de octubre se utilizó para SIMULAR una redistribución entre Cafetería y Moda SS27. La campaña propuesta como Cocoon NO fue aprobada por el nombre; la posible denominación «Saint-Tropez» y el nuevo lanzamiento requieren confirmación. Hasta disponer de PDM y creatividades aprobados, mantener el control de la pauta vigente de Cafetería. Contrastar siempre Plan de Medios, Planilla de Activaciones y plataformas; no copiar presupuestos ni trasladar saldos por inercia.<\/p><\/div><h3>Secuencia al iniciar un mes nuevo<\/h3><ol class=\"steps\"><li>Antes de modificar Cafetería, confirmar si Moda SS27 ya tiene nombre definitivo, campaña y presupuesto aprobados, fecha de salida y destino de anuncios. «Saint-Tropez» todavía es tentativo.<\/li><li>Revisar presupuesto total y por plataforma; calcular cualquier reasignación de modo que la suma cierre y no se produzca doble pauta.<\/li><li>Comparar cronograma y Planilla de Activaciones contra las campañas y anuncios efectivamente activos en cada administrador.<\/li><li>Confirmar URLs de destino, edades, ubicación y período de circulacion antes de duplicar campañas.<\/li><li>Registrar toda modificación importante en bitacora / Mainsheet, con fecha, objetivo y si fue ejecutada o solo propuesta.<\/li><\/ol>"
    }
   ]
  },
  {
   "id": "google-ads-decisiones-motivos-y-consecue",
   "title": "Google Ads: decisiones, motivos y consecuencias",
   "blocks": [
    {
     "t": "raw",
     "h": "<h3>Cronología de Google Ads<\/h3><div class=\"tw\"><table class=\"left\"><thead><tr><th>Fase<\/th><th>configuración / resultado<\/th><th>Aprendizaje<\/th><\/tr><\/thead><tbody><tr><td>Julio: PMax a Meitre<\/td><td>USD 219,07; 3.506 clics; 1 reserva. Pensada para visibilidad local y Maps, pero la entrega estuvo dominada por otros inventarios.<\/td><td>CPC barato no equivale a reservas: problema de calidad/intención del tráfico.<\/td><\/tr><tr><td>Agosto: transición a Search<\/td><td>USD 586,24; 5 reservas totales: PMax 2 / Search General 2 / Search Brand 1. Search hizo 3 reservas con USD 256,94 entre ambas campañas.<\/td><td>Search ofrece primera señal más favorable. PMax se pausa como eje; no afirmar que fue eliminada de la cuenta.<\/td><\/tr><tr><td>Agosto: ubicación Google Business Profile<\/td><td>Vinculación de Artesia en Rostand 1555 y acciones locales. 1.424 clics de información, 203 indicaciones y 36 llamadas.<\/td><td>Acciones de interés local, pero no equivalen a reservas concretadas.<\/td><\/tr><tr><td>Septiembre: Search completo<\/td><td>USD 511,25; 4.070 clics y 3 reservas. Brand 2 reservas / USD 33,06; General 1 / USD 478,19.<\/td><td>Bajo volumen de conversiones pese al flujo de visitas.<\/td><\/tr><tr><td>Mitad septiembre: URL web<\/td><td>Se cambia el destino de Search desde Meitre hacia la página institucional de Artesia. El cierre septiembre mezcla actividad antes/después del cambio.<\/td><td>La web aporta más contexto sobre la propuesta; no atribuir reservas o acciones de forma causal sin segmentar las fechas.<\/td><\/tr><\/tbody><\/table><\/div><h3>Search, terminos y lectura local<\/h3><p>En septiembre, <strong>Search General<\/strong> concentro la mayor parte del tráfico: \"café\" aporto 2.312 clics; \"brunch\" 647; \"cafetería\" 339; \"patisserie\" 152. <strong>Search Brand<\/strong> fue más acotada en clics pero explico dos de las tres reservas atribuidas del mes. Este comportamiento favorece mantener separadas las lecturas de intención generica y marca.<\/p><p>Las interacciones locales crecieron en septiembre: <strong>3.222<\/strong> clics en información del local, <strong>495<\/strong> en \"Como llegar\" y <strong>73<\/strong> en llamadas. Corresponden a comportamientos de interés, pero no se deben sumar a las reservas como si fueran conversiones de la misma naturaleza.<\/p><p><strong>Rechazos bancarios:<\/strong> la entrega se interrumpio en junio/julio y durante parte de agosto. El gasto real por debajo de los USD 800 previstos de Google no se puede leer exclusivamente como decisión de eficiencia; hubo condicionamientos de pago y reestructuración.<\/p><div class=\"call\"><b class=\"t\">Regla de reporte Google<\/b><p>Siempre especificar destino utilizado, fecha del cambio, diferencia entre reservas y acciones locales y si las conversiones pertenecen al período pre o post cambio. No comparar Search vs PMax sin aclarar el distinto inventario y tiempo de actividad.<\/p><\/div>"
    }
   ]
  },
  {
   "id": "meta-ads-volumen-calidad-y-cambio-de-obj",
   "title": "Meta Ads: volumen, calidad y cambio de objetivo",
   "blocks": [
    {
     "t": "raw",
     "h": "<div class=\"tw\"><table class=\"\"><thead><tr><th>período<\/th><th>Meta: mensajes<\/th><th>Costo / msg<\/th><th>Meta alcance<\/th><th>Frec. KPI<\/th><th>inversión total<\/th><\/tr><\/thead><tbody><tr><td>Junio*<\/td><td>7<\/td><td>USD 21,14<\/td><td>488.506<\/td><td>2,61<\/td><td>USD 715,52<\/td><\/tr><tr><td>Julio<\/td><td>75<\/td><td>USD 9,33<\/td><td>505.689<\/td><td>4,34<\/td><td>USD 1.783,28<\/td><\/tr><tr><td>Agosto<\/td><td>84<\/td><td>USD 11,90<\/td><td>558.576<\/td><td>4,63<\/td><td>USD 1.799,74<\/td><\/tr><tr><td>Septiembre<\/td><td>46<\/td><td>USD 13,02<\/td><td>261.714 / 350.060**<\/td><td>7,31<\/td><td>USD 1.766,22<\/td><\/tr><\/tbody><\/table><\/div><p>* Junio tuvo activación parcial y pagos rechazados. ** El One Page de septiembre muestra 261.714 de alcance; la página detallada Meta muestra 350.060. Ademas, la tabla consolidada Meta registra frecuencia 6,45 frente a 7,31 del KPI. Verificar filtros y alcance de cada visual en Looker antes de unificar estas cifras.<\/p><h3>Cambios ejecutados y su lectura<\/h3><ul><li>Julio: 75 mensajes, salto frente a junio con casi un mes completo, pero el mix todavia incluia Interacción con peso importante.<\/li><li>Agosto: Mensajes aprox. USD 1.000, Alcance aprox. USD 700 e Interacción aprox. USD 100 en la ejecución. A pedido del cliente, se modificaron rangos etarios de Mensajes; las consultas se concentraban en mujeres y edades altas (65+).<\/li><li>Septiembre: audiencia de Alcance más acotada para reforzar frecuencia. Por bajo rendimiento de Mensajes se agrega tráfico a Meitre; gasto Meta por campaña: Mensajes USD 598,96, tráfico USD 398, Alcance USD 500, Alcance promocionado USD 269,26.<\/li><li>La campaña tráfico a Meitre registro <strong>4.575 visitas<\/strong> en su primer tramo. No interpretarlas como reservas completadas.<\/li><\/ul><h3>Creatividades que aportaron resultados<\/h3><p>En agosto, <strong>Croissant<\/strong> genero 23 mensajes; <strong>Recorrido General<\/strong> 20 y tuvo un costo por mensaje más eficiente entre los destacados; <strong>café Precios<\/strong> 17. En septiembre, <strong>Macaron<\/strong> lidero conversaciones (23 mensajes) y <strong>Recorrido General<\/strong> mantuvo un costo bajo con volumen menor. La conclusión operativa es priorizar producto concreto más contexto del espacio, no mensajes genericamente aspiracionales.<\/p><p><strong>Seguimiento comercial:<\/strong> existe una planilla separada de mensajes / anuncios. El reporte de Meta mide conversaciones iniciadas, no necesariamente clientes calificados, mesas reservadas ni visitas confirmadas. Para evaluar performance real, solicitar lectura comercial o clasificacion de conversaciones antes de escalar el objetivo.<\/p>"
    }
   ]
  },
  {
   "id": "tiktok-ads-canal-de-branding",
   "title": "TikTok Ads: canal de branding",
   "blocks": [
    {
     "t": "raw",
     "h": "<div class=\"tw\"><table class=\"\"><thead><tr><th>Mes<\/th><th>Alcance<\/th><th>Frecuencia<\/th><th>inversión USD<\/th><th>Lectura<\/th><\/tr><\/thead><tbody><tr><td>Julio<\/td><td>458.924<\/td><td>6,64<\/td><td>719,86<\/td><td>Primer mes completo; cumple cobertura y frecuencia.<\/td><\/tr><tr><td>Agosto<\/td><td>446.630<\/td><td>6,47<\/td><td>719,62<\/td><td>Estable; principal respuesta 25-34 años.<\/td><\/tr><tr><td>Septiembre<\/td><td>454.271<\/td><td>6,07<\/td><td>719,71<\/td><td>Cumple referencia de 330.000 y 6 impactos.<\/td><\/tr><\/tbody><\/table><\/div><p>La función de TikTok fue <strong>ampliar reconocimiento<\/strong>, no captacion directa de reservas. Los contenidos destacados mostraron café, gastronomia, recorridos y escenas de consumo (\"POV\", \"Recorrido General\", \"Planos Fijos\", \"Stopmotion café\", \"Comida y Bebida\", \"Pantalla Dividida\"). No cambiar su evaluación a CPA por reservas sin un proceso de atribución implementado.<\/p>"
    }
   ]
  },
  {
   "id": "medicion-meitre-google-ads-gtm-y-meta-pi",
   "title": "Medición: Meitre, Google Ads, GTM y Meta Pixel",
   "blocks": [
    {
     "t": "raw",
     "h": "<h3>Recorrido de una reserva<\/h3><p>En la configuración historica, Meitre utiliza una confirmación identificable por la ruta <strong>booking-final<\/strong>. En Google Ads se habia trabajado con GTM para disparar <strong>Reserva Meitre | Artesia<\/strong> al alcanzar esa confirmación. En septiembre, Google Search redirige parte de la actividad a la web, por lo que el flujo de entrada y la lectura de conversiones requieren revisión al asumir la cuenta.<\/p><h3>Pixel y evento Schedule (registro de pruebas 28-29/09)<\/h3><div class=\"tw\"><table class=\"\"><thead><tr><th>Activo / pasó<\/th><th>Registro del historial<\/th><th>Situación<\/th><\/tr><\/thead><tbody><tr><td>Contenedor GTM<\/td><td>GTM-MW9KZC22, usado en el dominio de reservas Meitre.<\/td><td>Identificado<\/td><\/tr><tr><td>Pixel Meta<\/td><td>ID 1623276219158195; registro del 29/09 indica etiqueta base GTM publicada en All Pages.<\/td><td>Publicado y probado según historial; reconfirmar<\/td><\/tr><tr><td>Evento nativo<\/td><td>Meitre disparo Schedule; una reserva de prueba genero un evento \"Programar\" procesado.<\/td><td>Prueba positiva; reconfirmar<\/td><\/tr><tr><td>Etiqueta manual Schedule<\/td><td>Se descarto instalar una segunda etiqueta manual para no duplicar el evento nativo.<\/td><td>No duplicar<\/td><\/tr><tr><td>campaña Meta Ventas<\/td><td>Se propuso crear una campaña nueva optimizada a Schedule, sin convertir automaticamente tráfico a Meitre.<\/td><td>Propuesta; NO consta activación<\/td><\/tr><tr><td>Conversiones y CRM<\/td><td>No hay evidencia de validación de calidad comercial ni reservas efectivas atribuibles por fuente para todo el período.<\/td><td>No asumir atribución completa<\/td><\/tr><\/tbody><\/table><\/div><div class=\"call\"><b class=\"t\">Al tomar la cuenta<\/b><p>Verificar en GTM versión publicada y en Meta Events Manager que el pixel correcto este activo y Schedule se registre una sola vez por reserva. Solo después evaluar una campaña de Ventas: requiere suficiente volumen de eventos, destinatario y aprobación de presupuesto.<\/p><\/div>"
    }
   ]
  },
  {
   "id": "performance-problema-real-y-alternativas",
   "title": "Performance: problema real y alternativas propuestas",
   "blocks": [
    {
     "t": "raw",
     "h": "<p>Entre junio y septiembre, la comunicación alcanzo audiencias amplias y la pauta de branding logro buenos resultados. En cambio, los indicadores de conversión directa siguieron siendo modestos para la inversión: Mensajes pasó de 84 a 46 entre agosto y septiembre; Google Ads registro 5 y luego 3 reservas. La respuesta no se resuelve atribuyendo todo el problema a un solo formato o a una sola URL.<\/p><div class=\"tw\"><table class=\"left\"><thead><tr><th>Hipotesis / decisión<\/th><th>Evidencia<\/th><th>Estado<\/th><\/tr><\/thead><tbody><tr><td>Redistribuir Mensajes hacia tráfico Meitre<\/td><td>Se realizó en septiembre y genero 4.575 visitas.<\/td><td>Ejecutado; impacto en reservas no demostrado<\/td><\/tr><tr><td>Cambiar URL Google Search de Meitre a web<\/td><td>Se aplico a mitad de septiembre. Aumentaron acciones locales.<\/td><td>Ejecutado; evaluar período poscambio<\/td><\/tr><tr><td>Reducir performance y reforzar branding<\/td><td>Propuesta en comentario general de septiembre tras varios meses con bajo resultado.<\/td><td>Propuesta estrategica; sin aprobación documentada<\/td><\/tr><tr><td>Usar influencers afines a marca<\/td><td>Alternativa discutida como posible destino de parte de presupuesto de pauta.<\/td><td>Idea a evaluar; no afirmar compra ni ejecución<\/td><\/tr><tr><td>campaña Meta Ventas optimizada a Schedule<\/td><td>Propuesta técnica posterior a prueba de pixel; requiere volumen de conversión.<\/td><td>No implementación confirmada<\/td><\/tr><\/tbody><\/table><\/div>"
    }
   ]
  },
  {
   "id": "moda-ss27-cocoon-no-aprobado-y-nuevo-nam",
   "title": "Moda SS27: Cocoon no aprobado y nuevo naming en definición",
   "blocks": [
    {
     "t": "raw",
     "h": "<div class=\"call\"><b class=\"t\">Estado al 28/10/2026<\/b><p>NO APROBADA bajo «Cocoon». La campaña de Moda sigue prevista para salir próximamente, con posible nombre «Saint-Tropez», pero la denominación definitiva, el nuevo PDM y la fecha de activación aún deben validarse. No lanzar ni informar resultados como si ya estuviera activa.<\/p><\/div><p>Antecedente creativo: <strong>COCOON - Born to Become<\/strong> fue el concepto de trabajo original y así aparece en la presentación SS27. El nombre Cocoon no gustó y no debe utilizarse como identidad aprobada ni como nombre de una campaña activa. «Saint-Tropez» es, al 28/10/2026, la alternativa más probable, todavía no definitiva. Al confirmar el naming hay que revisar piezas, copies, URLs y materiales antes de activar. El discurso creativo trabajado incluía anudado, entrelazado y tejido; no atribuir procesos técnicos de seda no documentados.<\/p><p>El 14 de octubre se trabajaron dos posibles PDM, redistribuyendo los mismos USD 3.320 que hasta entonces correspondían a Cafetería. Ambos corresponden a la fase de propuesta Cocoon no aprobada; sirven como antecedentes para una nueva planificación, pero no deben reutilizarse automáticamente como presupuestos aprobados para «Saint-Tropez». Las simulaciones cambiaron tras ampliar el público objetivo y revisar la imposibilidad de estimar audiencias menores a 200.000 personas en el planificador.<\/p><div class=\"tw\"><table class=\"\"><thead><tr><th>Escenario<\/th><th>Moda SS27<\/th><th>Café restante<\/th><th>Total<\/th><th>Estado<\/th><\/tr><\/thead><tbody><tr><td>A - Branding<\/td><td>USD 700 Meta Alcance<\/td><td>USD 2.620<\/td><td>USD 3.320<\/td><td>NO APROBADO<\/td><\/tr><tr><td>B - Branding + tráfico<\/td><td>USD 700 Meta Alcance + USD 200 tráfico<\/td><td>USD 2.420<\/td><td>USD 3.320<\/td><td>NO APROBADO<\/td><\/tr><\/tbody><\/table><\/div><p><strong>Frecuencia de Moda SS27 (simulación Cocoon):<\/strong> siete impactos fue una condición de los escenarios estudiados. El planificador no permitía estimar algunas audiencias menores de 200.000 personas. Las cifras de alcance se modelaron con supuestos de CPM (aprox. USD 1), <strong>no<\/strong> como proyecciones oficiales de Meta ni resultados garantizados. Volver a validar la segmentación y la inversión con el nombre y PDM definitivos.<\/p><p>Una de las descomposiciones exploradas del escenario B reducia café a: Alcance USD 500; promocionado USD 300; Mensajes USD 300; tráfico Meitre USD 200; TikTok USD 720; Search General USD 350; Search Brand USD 50. Es un ejemplo de redistribución de trabajo, no un PDM ejecutado.<\/p><div class=\"call\"><b class=\"t\">Regla de Moda SS27<\/b><p>No activar campañas bajo Cocoon ni pausar, reducir o duplicar las de Cafetería para financiar Moda sin confirmar nombre final, aprobación creativa y presupuestaria, responsables, destino, público y fecha de lanzamiento. Mantener inversión y resultados separados por unidad de negocio desde la activación.<\/p><\/div>"
    }
   ]
  },
  {
   "id": "creatividad-y-segmentaciones-aprendizaje",
   "title": "Creatividad y segmentaciones: aprendizajes",
   "blocks": [
    {
     "t": "raw",
     "h": "<ul><li>En Meta, el Alcance se reoriento en septiembre a una audiencia más concentrada para acercarse a siete impactos. El alcance es un KPI de branding, no el único indicador para performance.<\/li><li>Meta Mensajes recibio ajustes etarios en agosto a pedido del cliente tras concentración de consultas en mujeres y personas mayores. No copiar segmentos de junio sin revisar la configuración vigente.<\/li><li>TikTok 25-34 años fue el principal grupo en impresiones y clics, sin implicar que sea la única audiencia relevante para visitas al local.<\/li><li>Creatividades: café, productos gastronomicos y recorrido del local aportan mejores referencias que mensajes demasiado abstractos. Separar el contenido de evento/arte del contenido directamente relacionado con conversión en el café.<\/li><li>Comunicar Rostand 1555, propuesta de cafetería, café colombiano y motivos concretos para visitar o reservar. Seguir la guía de tono y la carta actualizada.<\/li><\/ul>"
    }
   ]
  },
  {
   "id": "accesos-cuentas-y-activos-compartidos",
   "title": "Accesos, cuentas y activos compartidos",
   "blocks": [
    {
     "t": "raw",
     "h": "<p>Los enlaces siguientes provienen de los marcadores de trabajo asociados a la carpeta \"Art\". Se incluyen como punto de partida y deben contrastarse con permisos actuales.<\/p><div class=\"links\"><a class=\"lk\" href=\"https://adsmanager.facebook.com/adsmanager/manage/campaigns?global_scope_id=1503838648148971&business_id=1503838648148971&act=996299342962447\" target=\"_blank\" rel=\"noopener\"><b>Meta Ads | cuenta marcada de Artesia<i>↗<\/i><\/b><em>adsmanager.facebook.com<\/em><\/a><a class=\"lk\" href=\"https://ads.google.com/aw/campaigns?ocid=8293029319&ascid=8293029319\" target=\"_blank\" rel=\"noopener\"><b>Google Ads | cuenta identificada como GADS<i>↗<\/i><\/b><em>ads.google.com<\/em><\/a><a class=\"lk\" href=\"https://ads.google.com/aw/campaigns?ocid=7662653259&workspaceId=0\" target=\"_blank\" rel=\"noopener\"><b>Google Ads | marcador GADS - Merco (verificar rol)<i>↗<\/i><\/b><em>ads.google.com<\/em><\/a><a class=\"lk\" href=\"https://ads.tiktok.com/i18n/manage/campaign?aadvid=7647643977004466184\" target=\"_blank\" rel=\"noopener\"><b>TikTok Ads | Artesia<i>↗<\/i><\/b><em>ads.tiktok.com<\/em><\/a><a class=\"lk\" href=\"https://docs.google.com/spreadsheets/d/1dRpW_vjrvZwUyZhcSHTxLK37VmtLhjWnjqsbzwZZ3e4/edit?gid=1555914838#gid=1555914838\" target=\"_blank\" rel=\"noopener\"><b>Planilla de Activaciones | Artesia<i>↗<\/i><\/b><em>docs.google.com<\/em><\/a><a class=\"lk\" href=\"https://wasabimd-my.sharepoint.com/:x:/r/personal/wasabinos_wasabi_com_uy/_layouts/15/Doc.aspx?sourcedoc=%7B42744C96-6ACF-4CFB-B2B8-39ED2D0314FC%7D&file=Reporte%20Mensajes%20-%20Anuncios.xlsx&action=default\" target=\"_blank\" rel=\"noopener\"><b>Seguimiento de mensajes | Excel SharePoint<i>↗<\/i><\/b><em>wasabimd-my.sharepoint.com<\/em><\/a><a class=\"lk\" href=\"https://datastudio.google.com/u/0/reporting/ecd15d04-019e-457e-93d2-47307976a413/page/mFl3F\" target=\"_blank\" rel=\"noopener\"><b>Looker Studio | reporte mensual Artesia<i>↗<\/i><\/b><em>datastudio.google.com<\/em><\/a><a class=\"lk\" href=\"https://docs.google.com/spreadsheets/d/1ZEqOL8P7ULaBDTjcSEsj0C7NB74tH2xDxllMvQkN3M0/edit?gid=0#gid=0\" target=\"_blank\" rel=\"noopener\"><b>Mainsheet | Artesia<i>↗<\/i><\/b><em>docs.google.com<\/em><\/a><a class=\"lk\" href=\"https://wasabimd-my.sharepoint.com/shared?id=%2Fpersonal%2Fwasabinos%5Fwasabi%5Fcom%5Fuy%2FDocuments%2FWasabi%20Digital%2FEQUIPO%20PUTAPARI%C3%93%2FARTESIA&viewid=b855fcfb%2D0a16%2D45e2%2Db04a%2D364614209379\" target=\"_blank\" rel=\"noopener\"><b>Carpeta de marca | SharePoint<i>↗<\/i><\/b><em>wasabimd-my.sharepoint.com<\/em><\/a><a class=\"lk\" href=\"https://artesia.meitre.com\" target=\"_blank\" rel=\"noopener\"><b>Reservas Meitre | Artesia<i>↗<\/i><\/b><em>artesia.meitre.com<\/em><\/a><a class=\"lk\" href=\"https://www.instagram.com/artesiaexperience/\" target=\"_blank\" rel=\"noopener\"><b>Instagram | @artesiaexperience<i>↗<\/i><\/b><em>instagram.com<\/em><\/a><a class=\"lk\" href=\"https://linktr.ee/artesiaexperience\" target=\"_blank\" rel=\"noopener\"><b>Linktree | Artesia Experience<i>↗<\/i><\/b><em>linktr.ee<\/em><\/a><\/div><p><strong>Otros activos a ubicar:<\/strong> GTM GTM-MW9KZC22; Events Manager del Pixel 1623276219158195; Google Business Profile de Rostand 1555; web final definida en Search. No hay URL de acceso directa verificada a esos contenedores en la carpeta de marcadores.<\/p><p><strong>Propiedad Meta:<\/strong> en mayo se discutio liberar/reclamar la página e Instagram desde otro portfolio. Antes de modificar configuración o permisos, comprobar en Business Settings la propiedad final, no solamente el acceso como socio. El historial no alcanza para afirmar que todos los activos quedaron transferidos.<\/p>"
    }
   ]

  {
   "id": "administracion-medios-de-pago-y-contrato",
   "title": "Administración, medios de pago y contrato",
   "blocks": [
    {
     "t": "raw",
     "h": "<p>Los rechazos de tarjeta afectaron la continuidad de la pauta en junio, julio y agosto. Controlar al iniciar el mes estado del metodo de pago y limite efectivo de gasto en Meta y Google; dejar registro de caidas y recuperación de entrega para que el reporte no atribuya esos cambios a performance creativa.<\/p><p>Al 20/10/2026 existía un antecedente de <strong>contrato aún sin firma<\/strong>. Este es un asunto de gestión comercial, no una tarea técnica de Paid. A 28/10, además, la propuesta de Moda bajo el nombre Cocoon no fue aprobada; ni esa propuesta ni los escenarios de USD 700/900 prueban un nuevo contrato o presupuesto vigente. Confirmar con coordinación de cuentas el alcance definitivo de Cafetería y Moda, el naming y la autorización de salida.<\/p>"
    }
   ]
  },
  {
   "id": "operativa-de-arco-especifica-de-artesia",
   "title": "Operativa de ARCO específica de Artesia",
   "blocks": [
    {
     "t": "raw",
     "h": "<h3>Activaciones<\/h3><p>Tomar como fuente primaria la Planilla de Activaciones y cronograma vigente. Confirmar anuncios finales, objetivo Meta, destino de cada anuncio (Meitre, web, perfil, mensajes), segmento geografico/edad y fechas; no reactivar PMax o un destino anterior por duplicar campañas.<\/p><h3>Reportes<\/h3><p>El cierre mensual integra Meta, TikTok y Google Ads; leer branding por alcance/frecuencia, Mensajes por conversación y calidad comercial, tráfico Meitre por visitas y Search por reservas + acciones locales. Los datos de septiembre en Meta requieren validar filtros de Looker antes de usar un único alcance.<\/p><h3>Chequeos<\/h3><p>Cruzar diariamente circulación activa de Planilla vs. administradores. Revisar gasto, rechazos, URLs finales, tracking, nombres de campañas y links de reservas. Si se activa Moda SS27 bajo el nombre que finalmente se apruebe, llevar control de inversión, resultados y materiales separado de Cafetería.<\/p><h3>Optimizaciones<\/h3><p>Registrar fecha, hipótesis y cambio real en la bitácora: edades ajustadas en agosto; Search en agosto; tráfico Meitre y cambio web en septiembre; píxel y pruebas de Schedule; propuestas de Ventas/influencers; y escenarios Cocoon para Moda que NO fueron aprobados por naming. Diferenciar ejecutado, en prueba, no aprobado, propuesto y pendiente.<\/p>"
    }
   ]
  },

   "blocks": [

     "t": "raw",
     "h": "<div class=\"tw\"><table class=\"\"><thead><tr><th>Indicador<\/th><th>Que mide<\/th><th>No equivale a<\/th><\/tr><\/thead><tbody><tr><td>Meta Mensajes<\/td><td>Conversaciones iniciadas atribuidas a anuncios.<\/td><td>Reservas concretadas o clientes calificados.<\/td><\/tr><tr><td>Meta Tráfico Meitre<\/td><td>Visitas a página/destino de reservas.<\/td><td>Reservas terminadas.<\/td><\/tr><tr><td>Search - Reservas<\/td><td>Conversiones atribuidas al evento configurado en Meitre.<\/td><td>Total de reservas del negocio por todos los canales.<\/td><\/tr><tr><td>Google acciones locales<\/td><td>Clics en info, indicaciones o llamadas.<\/td><td>Ventas ni reservas concretadas.<\/td><\/tr><tr><td>TikTok Alcance/Frecuencia<\/td><td>Cobertura y repetición.<\/td><td>Retorno directo en reservas.<\/td><\/tr><tr><td>Meta Schedule<\/td><td>Evento de reserva procesado en Meta.<\/td><td>campaña optimizada a Schedule, si no se configuro asi.<\/td><\/tr><tr><td>Moda SS27 (naming pendiente)<\/td><td>Objetivos, audiencia y presupuestos propios.<\/td><td>Resultado de café.<\/td><\/tr><\/tbody><\/table><\/div><p><strong>Base comparativa:<\/strong> junio parcial, julio con interrupciones, agosto con transición PMax/Search y septiembre con cambio de destino a mitad de mes. Comparaciones mecanicas mes vs mes pueden ocultar el efecto de las modificaciones.<\/p>"
    }
   ]

     "t": "raw",
     "h": "<div class=\"tw\"><table class=\"\"><thead><tr><th>Tema<\/th><th>Estatus al 28/10/26<\/th><th>Siguiente control<\/th><\/tr><\/thead><tbody><tr><td>Search General + Brand<\/td><td>Ejecutadas en agosto/septiembre.<\/td><td>Confirmar estado y destino final octubre.<\/td><\/tr><tr><td>PMax Reservas<\/td><td>Antecedente de campaña pausada/reemplazada.<\/td><td>Evitar duplicación; verificar si permanece pausada.<\/td><\/tr><tr><td>Meta tráfico Meitre<\/td><td>Activada a mitad de septiembre.<\/td><td>Revisar vigencia, resultados y destino.<\/td><\/tr><tr><td>Meta Mensajes<\/td><td>Activa hasta septiembre con menor volumen.<\/td><td>Revisar calidad / planilla de mensajes.<\/td><\/tr><tr><td>Pixel Meta / Schedule Meitre<\/td><td>Registro de prueba positiva fines de septiembre.<\/td><td>Verificar eventos actuales y no duplicación.<\/td><\/tr><tr><td>campaña Meta Ventas Schedule<\/td><td>Propuesta, no ejecución confirmada.<\/td><td>No asumir que optimiza por reservas.<\/td><\/tr><tr><td>Moda SS27 / Cocoon<\/td><td>Nombre Cocoon NO aprobado; escenarios A/B históricos; campaña aún no confirmada como activa.<\/td><td>Validar naming final (posible Saint-Tropez), aprobaciones, PDM, piezas y fecha antes de activar.<\/td><\/tr><tr><td>Contrato y alcance<\/td><td>Antecedente de falta de firma al 20/10.<\/td><td>Confirmar con cuentas/responsables.<\/td><\/tr><tr><td>Presupuesto octubre y noviembre<\/td><td>último PDM no contrastado con plataforma.<\/td><td>Validar Planilla de Activaciones actual.<\/td><\/tr><tr><td>Cuenta Meta / Google / GTM<\/td><td>Marcadores y IDs identificados.<\/td><td>Verificar propiedad, permisos y facturación.<\/td><\/tr><tr><td>Looker Septiembre Meta<\/td><td>Dos alcances y frecuencias no coincidentes.<\/td><td>Revisar filtros antes de consolidar.<\/td><\/tr><\/tbody><\/table><\/div>"

   "id": "la-cuenta-en-un-minuto",
   "title": "La cuenta en un minuto",
   "blocks": [
    {
     "t": "raw",
     "h": "<div class=\"tw\"><table class=\"left\"><thead><tr><th>Eje<\/th><th>Lo que necesitás saber<\/th><\/tr><\/thead><tbody><tr><td>Negocio<\/td><td>Dos líneas diferentes: Agencia de Viajes (paquetes y viajes) y Rentadora (alquiler de vehículos). Cada línea usa mensajes y contactos específicos.<\/td><\/tr><tr><td>Canales<\/td><td>Meta Ads: Alcance + Mensajes por línea. Google Ads: tres Search (Agencia, Rentadora y Brand) con medición de clics a WhatsApp.<\/td><\/tr><tr><td>Presupuesto de referencia<\/td><td>NOVIEMBRE 2026: Meta USD 1.500 y Google USD 1.000, total USD 2.500. Referencia histórica anterior: Meta USD 2.000 y Google USD 1.000, total USD 3.000. El cambio mensual es de USD -500, concentrado en Meta Mensajes.<\/td><\/tr><tr><td>Medición real<\/td><td>Un clic al botón de WhatsApp en Google Ads no equivale a una conversación efectiva, reserva o venta. Cruzar Ads con planillas comerciales.<\/td><\/tr><tr><td>Seguimiento comercial<\/td><td>La Planilla de contactos y el Seguimiento de paquetes son recursos críticos; sus clasificaciones pueden abarcar más fuentes o períodos que los mensajes atribuibles a Meta.<\/td><\/tr><tr><td>Última actualización operativa<\/td><td>En septiembre se aplicaron cambios de audiencias y Search con la nueva web. El 28/10 se comunicó una nueva distribución de inversión para noviembre; el estado de activación se verifica en Planilla de Activaciones.<\/td><\/tr><\/tbody><\/table><\/div>"
    }

  {
   "id": "estructura-de-marca-y-objetivos",
   "title": "Estructura de marca y objetivos",
   "blocks": [
    {
     "t": "raw",
     "h": "<h3>Agencia de Viajes<\/h3><p>Promociona viajes, paquetes, salidas acompañadas, cruceros y propuestas de temporada. El objetivo de pauta combina construcción de marca con consultas a un WhatsApp específico y seguimiento de ventas por destino. Referencias creativas: Porto de Galinhas, Búzios, Crucero Costa Serena, Punta Cana, Colombia y Curazao. Cada promoción debe revisarse por disponibilidad, precio, vigencia y condiciones comerciales.<\/p><h3>Rentadora<\/h3><p>Promociona alquiler de autos y soluciones de movilidad, con foco en modelos y categorías. Históricamente traccionaron Kwid y Fiat Mobi en volumen de mensajes; Fiorino y movilidad para empresas tienen espacios creativos específicos. Los cierres se reportan por Categoría Económica, Media o Camioneta. La web nueva incorpora alquiler directo online; la ruta de conversión de esa reserva debe verificarse aparte del clic a WhatsApp.<\/p><h3>Objetivo de cobertura<\/h3><p>En los reportes de Meta se utiliza como referencia cubrir al menos el 60% del público objetivo, indicado como aproximadamente 400.000 personas, con frecuencia promedio de 7 impactos mensuales. La distribución actual prioriza generación de contactos; por eso la frecuencia real de ambas líneas estuvo por debajo de 7. Incrementar inversión en Alcance o acotar público es una alternativa a evaluar, no un cambio implementado.<\/p>"
    }
   ]
  },
  {
   "id": "arquitectura-de-inversion-y-campanas",
   "title": "Arquitectura de inversión y campañas",
   "blocks": [
    {
     "t": "raw",
     "h": "<h3>Meta Ads — distribución acordada para noviembre 2026<\/h3><div class=\"tw\"><table class=\"\"><thead><tr><th>Línea<\/th><th>Campaña<\/th><th>USD/mes<\/th><th>Función<\/th><\/tr><\/thead><tbody><tr><td>Agencia<\/td><td>Branding / Alcance<\/td><td>330<\/td><td>Presencia de marca y cobertura.<\/td><\/tr><tr><td>Agencia<\/td><td>Mensajes<\/td><td>540<\/td><td>Consultas: USD 300 menos que la partida previa de Mensajes.<\/td><\/tr><tr><td>Rentadora<\/td><td>Branding / Alcance<\/td><td>220<\/td><td>Visibilidad de vehículos y rentadora.<\/td><\/tr><tr><td>Rentadora<\/td><td>Mensajes<\/td><td>360<\/td><td>Consultas: USD 200 menos que la partida previa de Mensajes.<\/td><\/tr><tr><td>Ambas líneas<\/td><td>Sorteo<\/td><td>50<\/td><td>Partida específica para activación; comprobar fechas y pieza.<\/td><\/tr><tr class=\"total\"><td>TOTAL META<\/td><td><\/td><td>1.500<\/td><td>Agencia 870 + Rentadora 580 + Sorteo 50.<\/td><\/tr><\/tbody><\/table><\/div><p>NUEVO PDM NOVIEMBRE (28/10): la distribución fue comunicada tras el pedido del cliente y la conversación con FD y Eli. El recorte de USD 500 se aplica exclusivamente a campañas de Mensajes de Meta (Agencia -USD 300, Rentadora -USD 200). La asignación informada también distingue USD 50 para Sorteo. La estructura anterior de Meta USD 2.000/mes (USD 1.200 Agencia y USD 800 Rentadora) queda como referencia histórica, no como presupuesto de noviembre. Verificar que cada nuevo importe quede aplicado en la Planilla de Activaciones y Meta Ads antes de iniciar noviembre.<\/p><h3>Google Ads — Search desde septiembre<\/h3><div class=\"tw\"><table class=\"\"><thead><tr><th>Campaña<\/th><th>USD/mes<\/th><th>Aprox. USD/día<\/th><th>Destino / objetivo<\/th><\/tr><\/thead><tbody><tr><td>Search | Agencia<\/td><td>500<\/td><td>16,45<\/td><td>Búsquedas de viajes y paquetes → WhatsApp Agencia.<\/td><\/tr><tr><td>Search | Rentadora<\/td><td>400<\/td><td>13,15<\/td><td>Alquiler de autos → WhatsApp Rentadora.<\/td><\/tr><tr><td>Search | Brand<\/td><td>100<\/td><td>3,30<\/td><td>Búsquedas de E-Travels → acceso a ambas líneas.<\/td><\/tr><tr class=\"total\"><td>TOTAL<\/td><td>1.000<\/td><td>32,90<\/td><td>Presupuesto mensual definido, no inversión ejecutada de septiembre.<\/td><\/tr><\/tbody><\/table><\/div><p>Google Ads no cambia en noviembre: Search Agencia USD 500, Search Rentadora USD 400 y Search Branded USD 100, total USD 1.000. Se mantiene el antecedente de septiembre con Search y concordancia amplia; revisar términos de búsqueda y negativas como parte del control habitual.<\/p><p>ACTUALIZACIÓN 28/10 · Noviembre: PDM total USD 2.500, frente a USD 3.000 anteriores (Meta 1.500; Google 1.000 sin cambios). La distribución de noviembre está comunicada, pero no debe confundirse con ejecución real ya verificada en las plataformas. Octubre: confirmar campañas y presupuesto efectivamente consumido en la Planilla de Activaciones. La situación de PMax requiere comprobación independiente; no tratarla como activa ni pausada sin evidencia.<\/p>"
    }
   ]
  },
  {
   "id": "evolucion-de-resultados-junio-a-septiemb",
   "title": "Evolución de resultados: junio a septiembre 2026",
   "blocks": [
    {
     "t": "raw",
     "h": "<p>Los resultados de Meta se separan por Agencia y Rentadora. La inversión de Google Ads de septiembre cubre un período parcial tras el lanzamiento de la web y no debe extrapolarse directamente a un mes completo.<\/p><div class=\"tw\"><table class=\"\"><thead><tr><th>Mes<\/th><th>Agencia: mensajes<\/th><th>Rentadora: mensajes<\/th><th>Cierres informados<\/th><th>Contexto<\/th><\/tr><\/thead><tbody><tr><td>Junio<\/td><td>433<\/td><td>300<\/td><td>1 crucero; 12 alquileres<\/td><td>Seguimiento comercial con muchas clasificaciones; Meta como fuente de pauta.<\/td><\/tr><tr><td>Julio<\/td><td>505<\/td><td>354<\/td><td>4 Porto de Galinhas; 9 alquileres<\/td><td>Sube captación sin aumento relevante de inversión; destacaron paquetes de Brasil y Fiat Mobi.<\/td><\/tr><tr><td>Agosto<\/td><td>495<\/td><td>366<\/td><td>1 Búzios; alquileres: 8 o 9*<\/td><td>Costa Serena y Kwid lideran mensajes; mejoras posteriores de segmentación.<\/td><\/tr><tr><td>Septiembre<\/td><td>372<\/td><td>357<\/td><td>1 Pipa y Natal; 11 alquileres<\/td><td>Ajustes de públicos en Meta; Search Google comenzó a mitad de mes.<\/td><\/tr><\/tbody><\/table><\/div><p>*Inconsistencia de fuente: la One Page de agosto muestra 8 alquileres en el indicador agregado y 9 en la tabla de categorías. El reporte de septiembre compara 11 vs. 8 (+37,5%). Confirmar la cifra con el Seguimiento de paquetes antes de usarla para análisis histórico.<\/p><h3>Septiembre: lectura resumida<\/h3><div class=\"tw\"><table class=\"\"><thead><tr><th>Métrica<\/th><th>Agencia<\/th><th>Rentadora<\/th><\/tr><\/thead><tbody><tr><td>Inversión Meta ejecutada<\/td><td>USD 1.199,51<\/td><td>USD 799,75<\/td><\/tr><tr><td>Alcance global de línea<\/td><td>411.668<\/td><td>326.352<\/td><\/tr><tr><td>Frecuencia global<\/td><td>3,99<\/td><td>3,36<\/td><\/tr><tr><td>Mensajes Meta<\/td><td>372 (–24,8% vs agosto)<\/td><td>357 (–2,5% vs agosto)<\/td><\/tr><tr><td>Campaña de Mensajes<\/td><td>343 principales + 29 Curazao<\/td><td>357 aprox.; 356 en la fila de campaña<\/td><\/tr><tr><td>Tendencia comercial<\/td><td>14 negativos vs 29 en agosto; 1 venta<\/td><td>11 alquileres (+37,5% según reporte); 8 negativos vs 12<\/td><\/tr><\/tbody><\/table><\/div><p>No confundir alcance global de la línea con alcance exclusivo de la campaña de Alcance, ni inversión total de la línea con inversión exclusivamente en Mensajes. La lectura de eficiencia debe respetar ese alcance metodológico.<\/p>"
    }
   ]
  },
  {
   "id": "meta-ads-publicos-aprendizaje-y-contenid",
   "title": "Meta Ads: públicos, aprendizaje y contenidos",
   "blocks": [
    {
     "t": "raw",
     "h": "<h3>Ajuste de segmentación aplicado a comienzos de septiembre<\/h3><p>Se decidió priorizar las bases de datos de mayor interés y los públicos similares pertinentes, retirando de Mensajes las audiencias creadas a partir de contactos REGULARES de la planilla, que mostraban baja respuesta. El cambio se aplicó tanto a Agencia como a Rentadora, con foco en la calidad comercial por encima del volumen. No confundir ese ajuste específico con la exclusión general de todas las bases de datos ni de todos los públicos similares.<\/p><p>Hubo conversaciones sobre asegurar participación relevante de segmentos de BBDD y públicos similares en la inversión; no se confirmó en las fuentes un porcentaje efectivamente aplicado a todas las campañas. Verificar conjuntos de anuncios y presupuestos reales antes de documentarlo como norma fija.<\/p><h3>Señales creativas útiles<\/h3><ul><li>Agencia: las ofertas con destino, fecha, precio y propuesta clara tienden a generar consultas. Julio: Porto de Galinhas, Maragogi y Salvador. Agosto: Crucero Costa Serena generó 287 mensajes entre los anuncios destacados. Septiembre: Costa Serena 159 mensajes; Curazao incrementó sus consultas y mejoró su costo respecto a agosto.<\/li><li>Rentadora: Kwid concentró aproximadamente 319 de los 357 mensajes de septiembre entre sus variantes destacadas. Fiat Mobi fue fuerte en julio; Fiorino funciona como línea para empresas y movilidad. Usar costos y calidad comercial juntos, no solamente el anuncio con más mensajes.<\/li><li>Perfiles de respuesta: en Agencia predominan mensajes de mujeres, especialmente grupos de mayor edad; en Rentadora, en septiembre predominaron hombres (61,1%), con concentración entre 25 y 44 años. Son patrones históricos, no segmentaciones obligatorias.<\/li><\/ul><h3>Cuidado con el seguimiento comercial<\/h3><p>Los contactos pueden clasificarse como Buenos, Regulares y Malos, y registrarse cierres en la planilla. En distintos meses las clasificaciones superaron la cantidad de mensajes atribuibles a Meta (por ejemplo, Agencia: 443 clasificados frente a 372 mensajes en septiembre). Eso puede responder a fuentes, períodos o carga de datos distintos: NO calcular automáticamente “tasa de clasificación de Meta” ni atribuir una venta a una campaña sin trazabilidad por plataforma. Confirmar origen, período y reglas de carga con el equipo comercial.<\/p><p>En septiembre se registraron 428 regulares, 14 malos y 1 bueno para Agencia; en Rentadora, 451 regulares, 8 malos y 11 buenos. Los valores describen la planilla comercial de ese período y deben interpretarse aparte del recuento de Mensajes Meta.<\/p>"
    }
   ]
  },
  {
   "id": "google-ads-conversion-configuracion-y-re",
   "title": "Google Ads: conversión, configuración y reporting",
   "blocks": [
    {
     "t": "raw",
     "h": "<h3>Qué se implementó con la web nueva<\/h3><p>A mediados de septiembre se lanzaron tres campañas Search: Agencia, Rentadora y Brand. Agencia dirige al recorrido de paquetes (referencia web /paquetes/) y sus botones de WhatsApp; Rentadora apunta a rutas de autos / rent-a-car y su propio contacto; Brand admite acceso a ambas líneas. En GTM se trabajó con Google Ads Base / Conversion Linker y acciones de conversión diferenciadas para los clics de WhatsApp de Agencia y Rentadora, con pruebas validadas en septiembre.<\/p><p>La implementación histórica de Rentadora se apoyó en enlaces del tipo api.whatsapp.com/send asociados a la ruta de rent-a-car; Agencia contempló JoinChat general y enlaces de paquetes. Con cambios de web o plugins conviene volver a probar ambos recorridos en GTM Preview y en las acciones de Google Ads.<\/p><h3>Resultados parciales de septiembre (Search)<\/h3><div class=\"tw\"><table class=\"\"><thead><tr><th>Campaña<\/th><th>Gasto USD<\/th><th>Conversiones atribuidas<\/th><th>Costo por conversión<\/th><\/tr><\/thead><tbody><tr><td>Agencia<\/td><td>279,85<\/td><td>37<\/td><td>USD 7,56<\/td><\/tr><tr><td>Rentadora<\/td><td>223,67<\/td><td>39<\/td><td>USD 5,74<\/td><\/tr><tr><td>Brand<\/td><td>40,05<\/td><td>3,5<\/td><td>USD 11,44 (calculado)<\/td><\/tr><tr class=\"total\"><td>TOTAL<\/td><td>543,57<\/td><td>79,5<\/td><td>USD 6,84<\/td><\/tr><\/tbody><\/table><\/div><p>Las 79,5 conversiones corresponden a acciones/clics hacia WhatsApp atribuidos por Google Ads. NO equivalen a 79,5 conversaciones efectivas, reservas, alquileres o paquetes vendidos. Los valores fraccionarios provienen de la atribución de la plataforma. A partir de octubre es necesario cruzar las conversiones con consultas y cierres identificados por fuente, si la planilla lo permite.<\/p><h3>Aprendizajes iniciales de Search<\/h3><ul><li>Rentadora fue inicialmente más eficiente que Agencia al convertir clics web en clics a WhatsApp: 39 conversiones vs. 37, con menos de la mitad de clics de sitio (499 vs. 1.058).<\/li><li>Entre las palabras clave visibles destacaron “agencia de viajes” (24 conversiones), “alquiler de autos montevideo” (28) y “rent a car uruguay” (7). La concordancia amplia requiere vigilancia de relevancia y negativas específicas.<\/li><li>Antes de mover presupuesto o declarar ganadora una campaña, evaluar calidad de las consultas recibidas, disponibilidad de paquetes, precio final y cierres concretados.<\/li><\/ul>"
    }
   ]
  },
  {
   "id": "web-medicion-y-decisiones-tecnicas",
   "title": "Web, medición y decisiones técnicas",
   "blocks": [
    {
     "t": "raw",
     "h": "<p>La web e-travels.com.uy tuvo una actualización/lanzamiento a mediados de septiembre. En octubre se destacó la posibilidad de alquiler de autos directamente online, por lo que conviene distinguir “reserva web completada” de “clic al WhatsApp de Rentadora”; no hay evidencia aquí de una conversión de reserva online implementada en Google Ads.<\/p><p>Antecedentes de la web anterior (2025) incluyeron enlaces/imágenes rotos, navegación confusa y un botón “Consultar” de rentadora que no redirigía correctamente. La versión nueva reemplazó parte del contexto anterior; esos problemas no deben trasladarse como incidencias vigentes sin testearlos. En la reunión de octubre se informó que la web estaba lenta; el estado de solución no quedó confirmado.<\/p><p>Se mencionó una integración con el mayorista Abtour como tema del proveedor / cliente, sin acción que WASABI pudiera ejecutar directamente en esa instancia. Para Google Ads, validar URLs finales, botones de contacto, rastreo por GTM y disponibilidad de la propuesta comercial antes de introducir cambios de presupuesto.<\/p>"
    }
   ]
  },
  {
   "id": "reportes-documentos-y-rutina-especifica",
   "title": "Reportes, documentos y rutina específica",
   "blocks": [
    {
     "t": "raw",
     "h": "<ol class=\"steps\"><li>Planilla de Activaciones: consultar campañas de Agencia y Rentadora activas, destinos/anuncios, presupuestos, fechas y URLs antes de cada activación o chequeo.<\/li><li>Meta: revisar inversión, cobertura, frecuencia, mensajes y costo por conversación por línea y campaña; distinguir principal y activaciones especiales por destino.<\/li><li>Google Ads: separar Search Agencia / Rentadora / Brand; revisar búsquedas reales, costos por clic de WhatsApp y funcionamiento de las acciones de conversión. Registrar fechas y cambios de tracking.<\/li><li>Planilla de contactos + Seguimiento de paquetes: evaluar buenos, regulares, malos, paquetes vendidos y alquileres. Pedir trazabilidad por plataforma para poder contrastar Meta vs. Google.<\/li><li>Looker Studio: preparar reporte mensual, con secciones diferenciadas de Agencia y Rentadora y las métricas orgánicas pertinentes. Se trabaja con cierres de mes; revisar fuentes y filtros antes de enviar el PDF.<\/li><li>Cuando existan campañas/acciones especiales, documentar objetivos, inversión extra, duración y resultados por separado para no distorsionar la lectura del Always On.<\/li><\/ol><h3>Resultados orgánicos de referencia<\/h3><p>Septiembre: 8.255 seguidores, alcance del perfil 122.462 e interacciones totales 92 según los indicadores principales. El reporte señala +247 seguidores frente al mes anterior y una mayor concentración de interacciones en carruseles. Deben verificarse en la fuente las diferencias menores entre indicadores y textos del mismo reporte antes de citarlos en clientes.<\/p>"
    }
   ]
  },
  {
   "id": "ultimas-reuniones-estacionalidad-y-asunt",
   "title": "Últimas reuniones, estacionalidad y asuntos a seguir",
   "blocks": [
    {
     "t": "raw",
     "h": "<div class=\"tw\"><table class=\"left\"><thead><tr><th>Tema<\/th><th>Situación registrada<\/th><th>Acción / criterio<\/th><\/tr><\/thead><tbody><tr><td>Agencia, noviembre<\/td><td>Para noviembre hay un nuevo PDM acordado: Agencia Branding USD 330 y Mensajes USD 540. Las ofertas de fin de año deben aprobarse por separado.<\/td><td>Aplicar USD 540 a Mensajes Agencia cuando se active noviembre; verificar fechas, campañas y propuestas comerciales validadas.<\/td><\/tr><tr><td>Rentadora, temporada<\/td><td>Expectativa de incremento de reservas por temporada y mayor exposición.<\/td><td>Revisar disponibilidad, categorías y alquileres cerrados; no optimizar solo por mensajes.<\/td><\/tr><tr><td>Cyber / Ciber<\/td><td>Se solicitaron dos contenidos para activaciones comerciales.<\/td><td>Confirmar fecha, ofertas, piezas y presupuesto extra antes de cargar.<\/td><\/tr><tr><td>MBC: evento y sorteo<\/td><td>Evento previsto para 13/11 en Museo Oceanográfico. Premio anunciado: dos pasajes a Río en temporada baja; acción colaborativa con MBC.<\/td><td>Confirmar bases notariales, vigencia y alcance del premio; coordinación de 8–10 entradas pendiente de cantidad final.<\/td><\/tr><tr><td>Alianza MBC: difusión<\/td><td>Se conversó colaboración de publicaciones Meta y presencia del logo en comunicaciones/pantallas.<\/td><td>Confirmar publicación, inversión de MBC y aprobación creativa antes de dar por ejecutada la difusión.<\/td><\/tr><tr><td>ProPlan / PMax<\/td><td>Se pidió revisar situación de PMax y preparar informe ProPlan para 17/10.<\/td><td>Comprobar si se realizó y cuál fue el resultado; no tratarlo como pendiente sin validarlo.<\/td><\/tr><tr><td>Contrato Always On<\/td><td>Se presentó propuesta de renovación anual el 20/10; en la última conversación no había respuesta.<\/td><td>Verificar estado comercial con el responsable de cuenta; no modificar campaña por ese motivo sin indicación.<\/td><\/tr><tr><td>Presupuesto Meta noviembre (28/10)<\/td><td>Total USD 1.500: Branding Agencia 330, Mensajes Agencia 540, Branding Rentadora 220, Mensajes Rentadora 360, Sorteo 50. Recorte exclusivo en Mensajes: -300 y -200.<\/td><td>Confirmar en Meta y Planilla de Activaciones los montos, la fecha de cambio y que no queden saldos o campañas duplicadas. Google Ads se mantiene en USD 1.000.<\/td><\/tr><\/tbody><\/table><\/div><p>Estos hitos proceden de las últimas conversaciones internas de octubre y pueden cambiar por aprobación comercial o decisión del cliente. La persona asignada debe pedir el estado actualizado, especialmente para MBC y promociones de noviembre.<\/p>"
    }
   ]

  {

   "blocks": [
    {
     "t": "raw",
     "h": "<p>Espacio Mascota combina <strong>e-commerce de productos para mascotas<\/strong> con <strong>tienda y servicios veterinarios presenciales<\/strong>. WASABI opera <strong>Meta Ads y Google Ads<\/strong> con objetivo de venta online y presencia de marca. El seguimiento exige separar las compras reales del e-commerce de señales locales (llamadas o solicitudes de indicaciones).<\/p><ul><li><strong>Meta Ads:<\/strong> Alcance Always On, Ventas por marcas comerciales y Remarketing web.<\/li><li><strong>Google Ads:<\/strong> Branded EM, Performance Max (PMax - EM) y DSA Search.<\/li><li><strong>Negocio:<\/strong> GA4 para total de compras e ingresos de tienda; plataformas publicitarias para atribución de cada canal.<\/li><li><strong>Particularidad crítica:<\/strong> datos de Google Ads se atribuyen retroactivamente; revisar cuándo se extrajeron antes de comparar cierres históricos.<\/li><\/ul>"
