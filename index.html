    {
     "t": "raw",
     "h": "<div class=\"tw\"><table class=\"\"><thead><tr><th>Campaña<\/th><th>ROAS ago.<\/th><th>ROAS sep.<\/th><th>Compras ago. → sep.<\/th><\/tr><\/thead><tbody><tr><td>Branded<\/td><td>91,46x<\/td><td>116,02x<\/td><td>202 → 276<\/td><\/tr><tr><td>PMax<\/td><td>47,24x<\/td><td>32,16x<\/td><td>503 → 347<\/td><\/tr><tr><td>DSA Search<\/td><td>15,60x<\/td><td>17,20x<\/td><td>43 → 58<\/td><\/tr><\/tbody><\/table><\/div><p>PMax concentró la pérdida de eficiencia mensual (<strong>-32% en ROAS y -31% en compras<\/strong> del reporte de cierre); Branded y DSA mejoraron. Las auditorías posteriores del informe de distribución por canales arrojan otros valores porque la atribución cambia con el tiempo y pueden existir diferencias en filtros/acciones. <strong>No mezclar snapshots como si fueran el mismo cierre.<\/strong><\/p>"
    }
   ]
  },
  {
   "id": "medicion-la-distincion-que-no-hay-que-pe",
   "title": "Medición: la distinción que no hay que perder",
   "blocks": [
    {
     "t": "raw",
     "h": "<h3>GA4 vs. Google Ads<\/h3><p><strong>GA4<\/strong> registra las compras en la fecha real del evento. <strong>Google Ads<\/strong> puede acreditar compras a una interacción publicitaria anterior y actualizar retroactivamente su valor o cantidad. Con <strong>Supermetrics → Looker Studio<\/strong>, el histórico de Google puede cambiar aun cuando el mes ya fue presentado. La regla de trabajo es registrar el período, la fecha de extracción y conservar una copia/exportación del reporte presentado.<\/p><h3>Purchase vs. acciones locales<\/h3><p>El historial de Google Ads incluye <strong>Purchase, Cómo llegar y Llamadas<\/strong>; las acciones locales llegaron a tener valores referenciales de <strong>US$1<\/strong>. Hubo intentos y revisiones históricas sobre acciones principales/secundarias; posteriormente <strong>Growth recomendó mantener múltiples conversiones principales<\/strong> en la estrategia. <strong>No consta un cambio finalmente implementado para dejar solamente Purchase.<\/strong> La configuración vigente debe comprobarse en la cuenta antes de tocar objetivos, tROAS o pujas.<\/p><div class=\"call\"><b class=\"t\">Interpretación correcta<\/b><p>Una conversión puede ser una llamada o consulta de indicaciones, no una compra. Para evaluar ventas y rentabilidad de e-commerce, <strong>segmentar por acción de conversión y aislar Purchase y su valor<\/strong>. A la vez, no excluir en bloque búsquedas de veterinaria: el negocio también presta servicios locales.<\/p><\/div>"
    }
   ]
  },
  {
   "id": "procedimiento-de-cierre-mensual",
   "title": "Procedimiento de cierre mensual",
   "blocks": [
    {
     "t": "raw",
     "h": "<ol class=\"steps\"><li>Tomar las compras e ingresos totales del e-commerce en <strong>GA4<\/strong>, para el rango mensual acordado en el equipo.<\/li><li>Consultar Meta y Google Ads para el mismo período y dejar explícita la <strong>moneda<\/strong> de cada cifra (Meta en UYU; Google en USD).<\/li><li>Registrar fecha exacta de extracción de Google, guardar el PDF/captura o versión del reporte presentado y usar snapshots consistentes al comparar.<\/li><li>Separar <strong>Always On<\/strong> de promociones y presupuestos extraordinarios, para no atribuir cambios del ROAS base solo al algoritmo.<\/li><li>Preparar la <strong>One Page HTML<\/strong> desde la herramienta compartida, con apoyo de Looker Studio/Supermetrics; conservar copia presentada y contrastar con GA4.<\/li><\/ol><p><strong>Herramienta de One Page:<\/strong> <a href=\"https://apimienta-cloud.github.io/reporte-performance-mensual/\">https://apimienta-cloud.github.io/reporte-performance-mensual/<\/a> . Es el recurso específico incorporado posteriormente al traspaso.<\/p>"
    }
   ]
  },
  {
   "id": "promociones-y-lectura-de-performance",
   "title": "Promociones y lectura de performance",
   "blocks": [
    {
     "t": "raw",
     "h": "<div class=\"tw\"><table class=\"left\"><thead><tr><th>Período<\/th><th>Activación<\/th><th>Efecto sobre lectura<\/th><\/tr><\/thead><tbody><tr><td>Junio 2026<\/td><td>CyberMascota 1-8/06; beneficio BROU aumentado del 10% al 15% entre el 25 y el 30/06.<\/td><td>Picos promocionales de ventas; separar de desempeño ordinario.<\/td><\/tr><tr><td>Agosto 2026<\/td><td>Día del Gato: 25% de descuento en web entre el 1 y 8/08.<\/td><td>Base comparativa con incentivo comercial especial.<\/td><\/tr><tr><td>31/08 a 10/09<\/td><td>CyberMascota; refuerzo Meta de US$375 en septiembre.<\/td><td>Aumentó inversión; ROAS Meta cayó aunque las compras atribuidas subieron.<\/td><\/tr><tr><td>Próxima acción comercial (acuerdos 27/10)<\/td><td>Cyber: USD 300 de Venta General; Black Friday: refuerzo previsto de USD 50; cupón 5% a evaluar.<\/td><td>Plan previsto, no resultados cerrados. Separar las inversiones por campaña/fecha y conciliar su origen antes de reportar.<\/td><\/tr><\/tbody><\/table><\/div>"
    }
   ]
  },
  {
   "id": "performance-max-diagnostico-y-decisiones",
   "title": "Performance Max: diagnóstico y decisiones",
   "blocks": [
    {
     "t": "raw",
     "h": "<h3>De dónde vino la caída de septiembre<\/h3><p>Los informes de distribución por canal revisados mostraron que el descenso de valor atribuido estuvo principalmente en <strong>Búsqueda con feed de productos<\/strong>, no en una migración masiva de presupuesto hacia YouTube o Display. Los datos de distribución no son idénticos a los del reporte mensual por diferencias de momento de extracción: usar siempre una sola foto de datos cuando se comparen cifras.<\/p><p>Se observaron dos patrones: <strong>pérdida de exposición<\/strong> de determinados artículos que recibieron muchos menos clics y <strong>pérdida de eficiencia<\/strong> de otros que conservaron tráfico pero redujeron su valor atribuido. Referencias de revisión del histórico: Equilibrio gato, Virbac HPM, Vitalcan Balanced, Fórmula Natural, Biofresh y Three Cats. Esto justifica comprobar stock, precio, promoción, disponibilidad y ficha de producto antes de excluir referencias o subir presupuestos.<\/p><h3>Merchant Center: elegibilidad de productos<\/h3><p>La auditoría identificó <strong>92 fichas no aptas exclusivamente por falta de imagen<\/strong> y otros <strong>28 casos con problema de imagen combinado<\/strong> con exclusiones de grupos de fichas. La mayor parte de los <strong>865 «No apto»<\/strong> del informe corresponde a exclusiones de grupos y no debe confundirse automáticamente con rechazos de políticas. El estado de elegibilidad mostrado en exportaciones puede ser el estado al descargar, <strong>no un histórico fiable<\/strong>. No hay confirmación de que las correcciones de imágenes se hayan ejecutado.<\/p><h3>BRAVECTO: política, URL y feed son planos distintos<\/h3><p>Se registraron alertas o rechazos vinculados con BRAVECTO y destinos de Google Ads. <strong>Se implementaron exclusiones de URL<\/strong> y ajustes en referencias de BRAVECTO de PMax. Sin embargo, excluir una página de la expansión de URLs <strong>no garantiza<\/strong> retirar un artículo del feed de Shopping ni elimina menciones del contenido de la home. Ante rechazos nuevos, revisar diagnóstico exacto, URL de destino, feed de Merchant Center y resultado de apelaciones.<\/p><h3>Términos de búsqueda y acciones locales<\/h3><p>Las búsquedas de veterinaria, clínicas o urgencias pueden ser relevantes para negocio local y registrar llamadas o solicitudes de indicaciones; no tratarlas automáticamente como despilfarro. Se estudiaron negativas de marcas competidoras <strong>Laika<\/strong> y <strong>Animal Shop<\/strong>, de impacto económico reducido, pero <strong>no constan implementadas<\/strong>. Tampoco se recomienda excluir consultas de productos que generaron valor en meses previos por una sola caída de conversión.<\/p>"
    }
   ]
  },
  {
   "id": "matriz-de-estado-aplicado-decidido-y-pro",
   "title": "Matriz de estado: aplicado, decidido y propuesto",
   "blocks": [
    {
     "t": "raw",
     "h": "<div class=\"tw\"><table class=\"left\"><thead><tr><th>Estado<\/th><th>Cambio o hallazgo<\/th><\/tr><\/thead><tbody><tr><td><span class=\"tag ok\">IMPLEMENTADO<\/span><\/td><td>20/06: exclusiones de audiencias RM en campañas de marcas Meta.<\/td><\/tr><tr><td><span class=\"tag ok\">IMPLEMENTADO<\/span><\/td><td>PMax: exclusiones de URL ligadas a BRAVECTO (no equivale a exclusión de ficha Merchant).<\/td><\/tr><tr><td>DECISIÓN DE CRITERIO<\/td><td>Growth: mantener múltiples conversiones principales; no modificar a solo Purchase sin nueva validación.<\/td><\/tr><tr><td>A COMPROBAR<\/td><td>Estado actual de rechazos, imágenes y elegibilidad de Merchant Center; home y destinos.<\/td><\/tr><tr><td><span class=\"tag media\">PROPUESTO<\/span><\/td><td>Corregir imágenes de fichas no aptas y estudiar productos con pérdida de exposición/eficiencia.<\/td><\/tr><tr><td>NO CONFIRMADO<\/td><td>Negativas de Laika/Animal Shop, ajustes de puja/tROAS y redistribuciones.<\/td><\/tr><tr><td>ACORDADO 27/10; VERIFICAR<\/td><td>Venta General: USD 500, divididos en USD 300 para Cyber y USD 200 para el resto del mes; refuerzo Black Friday de USD 50 cuyo origen dentro de la distribución debe conciliarse.<\/td><\/tr><tr><td>ACORDADO 27/10; VERIFICAR<\/td><td>Transferir USD 100 desde Meta Alcance hacia Venta General. Confirmar si ya forman parte de los USD 500 para evitar sumar el mismo dinero dos veces.<\/td><\/tr><tr><td>ACORDADO 27/10; VERIFICAR<\/td><td>Agregar Bravery con USD 125 a Meta Venta de Marcas. Confirmar si es refuerzo o redistribución del presupuesto aprobado.<\/td><\/tr><tr><td>CAMBIO INDICADO; VERIFICAR<\/td><td>Reducir CPC máximo de Mundo Mascota de USD 0,20 a USD 0,10. Verificar plataforma, configuración vigente y entrega posterior.<\/td><\/tr><tr><td>IMPLEMENTADO 28/10<\/td><td>Catálogos Meta: exclusión de bolsas chicas de Pro Plan y Frost aplicada. Confirmado por el Paid Media responsable; verificar persistencia al duplicar conjuntos o campañas.<\/td><\/tr><tr><td>EN EVALUACIÓN<\/td><td>Posible cupón 5% durante Cyber para competir en visibilidad con Mercado Libre y variante creativa correspondiente; no confirmado como promoción activa.<\/td><\/tr><tr><td>POR SEGUIMIENTO<\/td><td>Confirmar el estado del contenido de Black Friday y la programación del impulso de USD 50.<\/td><\/tr><tr><td>A EVALUAR<\/td><td>Bravery: revisar si corresponde excluir presentaciones pequeñas del catálogo. No consta una exclusión implementada.<\/td><\/tr><\/tbody><\/table><\/div>"
    }
   ]
  },
  {
   "id": "reunion-con-juanpi-27-de-octubre-de-2026",
   "title": "Reunión con Juanpi | 27 de octubre de 2026",
   "blocks": [
    {
     "t": "raw",
     "h": "<p>Estado de los acuerdos: la minuta del 27/10 registra definiciones sobre pauta y creatividad. Actualización confirmada el 28/10 por el Paid Media responsable: las bolsas pequeñas de Pro Plan y Frost ya fueron excluidas de los catálogos de Meta. La revisión de Bravery sigue por evaluar y los restantes cambios deben cotejarse con las plataformas y la Planilla de Activaciones.<\/p><h3>Pauta y conciliación del presupuesto<\/h3><p>La distinción más importante es entre asignación total, redistribuciones internas y refuerzos de campañas. No sumar automáticamente los importes como si todos fueran presupuesto adicional.<\/p><div class=\"tw\"><table class=\"left\"><thead><tr><th>Decisión<\/th><th>Importe / ajuste<\/th><th>Aplicación y control<\/th><\/tr><\/thead><tbody><tr><td>Meta · Venta General<\/td><td>USD 500<\/td><td>Distribuir USD 300 en Cyber y USD 200 en el resto del mes. Validar fechas y conjuntos/anuncios concretos.<\/td><\/tr><tr><td>Meta · Alcance → Venta General<\/td><td>USD 100<\/td><td>Reducir Alcance y reforzar Venta General. Confirmar si estos USD 100 están comprendidos en los USD 500, no adicionarlos dos veces.<\/td><\/tr><tr><td>Black Friday · refuerzo<\/td><td>USD 50<\/td><td>Dar un push al contenido de BF. Precisar si sale del tramo de USD 200, del de Cyber o de otra línea aprobada.<\/td><\/tr><tr><td>Meta · Venta de Marcas / Bravery<\/td><td>USD 125<\/td><td>Bravery USD 125 en Venta por Marcas: confirmar partida y activación. La revisión de exclusiones de bolsas de Bravery es otra decisión aún no ejecutada.<\/td><\/tr><\/tbody><\/table><\/div><p>Conciliación mínima antes de activar: comprobar presupuesto mensual aprobado, presupuesto vigente de Alcance, total neto de Venta General, partida de Bravery, origen de los USD 50 de BF y fechas de Cyber. Registrar el ajuste en Planilla de Activaciones y bitácora.<\/p><h3>Catálogos de Meta: exclusiones por tamaño y marca<\/h3><p>IMPLEMENTADO AL 28/10: se retiraron de los catálogos de Meta las bolsas pequeñas de Pro Plan y Frost, según confirmación del Paid Media responsable. Bravery: permanece como marca por revisar para decidir si corresponde excluir alguna presentación; no consta exclusión implementada. Se trata de un filtro sobre el surtido publicitado, no de eliminar productos del e-commerce.<\/p><ul><li>Control posterior a la implementación: identificar los filtros y conjuntos de productos que excluyen las bolsas pequeñas de Pro Plan y Frost; verificar que las presentaciones grandes y productos deseados sigan elegibles y visibles en la vista previa de anuncios. Documentar los identificadores para que la exclusión se conserve al duplicar campañas o catálogos.<\/li><li>Monitorear el antes/después de las exclusiones ya aplicadas: alcance del catálogo, entrega, compras, CPA y ROAS de Venta por Marcas y Venta General. Revisar Bravery por separado antes de realizar cualquier exclusión adicional; una mejora en resultados no debe asumirse sin comparar datos de períodos compatibles.<\/li><\/ul><h3>Mundo Mascota: CPC máximo<\/h3><p>La minuta indica una reducción del CPC máximo de Mundo Mascota de USD 0,20 a USD 0,10 (reducción del 50%). Verificar en la cuenta correspondiente que el ajuste efectivamente quedó aplicado. Como esta denominación no figura en la arquitectura histórica de campañas de este documento, localizar primero la campaña, estrategia de puja y plataforma exactas: no asociarla sin comprobarlo a PMax, DSA o Branded.<\/p><ul><li>Chequeo posterior al cambio: comparar impresiones, clics, cuota de impresiones si aplica, CPC real, inversión y ventas atribuidas. Un CPC máximo más bajo puede reducir la capacidad de entrega, incluso si abarata el tráfico.<\/li><\/ul><h3>Creatividad, Cyber y Black Friday<\/h3><ul><li>Cyber | Cupón del 5%: se planteó como posibilidad para sostener visibilidad frente a Mercado Libre. Falta verificar decisión comercial, condiciones, vigencia y la necesidad de una variante creativa. No publicar ni comunicar un descuento todavía no aprobado.<\/li><li>Black Friday | Contenido y pauta: confirmar en qué estado está la pieza de Black Friday y reservar/programar el impulso de USD 50 una vez conciliado su origen presupuestario. Confirmar fechas exactas y piezas finales antes de activar.<\/li><\/ul><h3>Validación operativa y registro<\/h3><ol class=\"steps\"><li>Conciliar la Planilla de Activaciones con la distribución aprobada y los anuncios en circulación. La exclusión de bolsas pequeñas de Pro Plan y Frost ya fue ejecutada; verificar que continúe correctamente aplicada.<\/li><li>Revisar en Meta Ads presupuestos de Alcance, Venta General, Cyber y partida Bravery. Confirmar que se mantengan las exclusiones implementadas de Pro Plan y Frost y que Bravery no se modifique sin decisión específica.<\/li><li>Localizar Mundo Mascota, contrastar CPC máximo USD 0,10 frente a USD 0,20 anterior y anotar fecha real del cambio.<\/li><li>Coordinar con el equipo creativo el estado de BF y la posibilidad del cupón 5%; registrar aprobación, piezas y fechas de circulación.<\/li><li>Anotar todos los cambios en bitácora: fecha, plataforma, campaña/conjunto, antes/después, motivo, presupuesto fuente/destino y estado. Revisar resultados por producto y por tramo comercial, separando las compras reales de las acciones locales.<\/li><\/ol>"
    }
   ]
  },

   "id": "continuidad-operativa-y-chequeos-al-toma",
   "title": "Continuidad operativa y chequeos al tomar la cuenta",
   "blocks": [
    {
     "t": "raw",
     "h": "<ol class=\"steps\"><li>Confirmar en la Planilla de Activaciones los presupuestos y campañas vigentes, incluidos los acuerdos del 27/10: Venta General USD 500, transferencia de USD 100 desde Alcance, Bravery USD 125, Cyber y el refuerzo de Black Friday.<\/li><li>En Google Ads, revisar <strong>objetivos principales/ secundarios y acciones de conversión<\/strong>. Para ROAS comercial, segmentar Purchase frente a llamadas y Cómo llegar.<\/li><li>En PMax/Merchant Center, consultar rechazos vigentes, páginas de destino, feed y disponibilidad de productos. Verificar si se resolvieron incidencias BRAVECTO y faltas de imagen.<\/li><li>No modificar pujas ni excluir búsquedas comerciales sin verificar resultados con snapshots compatibles y valores de conversiones separados.<\/li><li>En Meta, distinguir Alcance, Venta General, Venta de Marcas y Remarketing. Verificar exclusión de bolsas pequeñas de Pro Plan y Frost, revisar Bravery, y separar inversión promocional de la base Always On.<\/li><li>En la estructura de Mundo Mascota, comprobar el nuevo CPC máximo de USD 0,10 y vigilar que la reducción de puja no comprometa la entrega; conservar el registro del cambio.<\/li><li>Registrar fecha de extracción y conservar la One Page presentada para que el cierre no cambie retroactivamente sin explicación.<\/li><\/ol><p>8. La distribución interna definitiva entre Flor, Pimi y Mono no debe darse por confirmada.<\/p>"
    }
   ]

xiliar de reporting y registros<\/span><em>docs.google.com<\/em><\/a><a class=\"lk\" href=\"https://wasabimd-my.sharepoint.com/shared?id=%2Fpersonal%2Fwasabinos_wasabi_com_uy%2FDocuments%2FWasabi%20Digital%2FEQUIPO%20PUTAPARI%C3%93%2FESPACIO%20MASCOTA&viewid=b855fcfb-0a16-45e2-b04a-364614209379\" target=\"_blank\" rel=\"noopener\"><b>Carpeta Espacio Mascota<i>↗<\/i><\/b><span>Cronogramas, assets y documentación<\/span><em>wasabimd-my.sharepoint.com<\/em><\/a><a class=\"lk\" href=\"https://espaciomascota.com.uy/\" target=\"_blank\" rel=\"noopener\"><b>Tienda online<i>↗<\/i><\/b><span>Catálogo comercial y páginas de destino<\/span><em>espaciomascota.com.uy<\/em><\/a><\/div>"

    {
     "t": "raw",
     "h": "<p>Restaurante en San José 909, Montevideo; propuesta gastronómica íntegramente sin gluten, asociada a cocina al fuego, variedad de platos, experiencia y reservas por Tableo. Es el mismo grupo cliente de Ramona, pero sus perfiles, cuentas, presupuestos y conversiones se deben administrar por separado.<\/p><p>El foco de Paid Media combina reconocimiento, crecimiento de @loslenosuy tras la migración de Instagram, visitas al sistema de reservas y consultas de eventos empresariales. Plataformas operadas: Meta Ads y TikTok Ads. En octubre, la medición de reservas reales en Tableo avanzó a través de GTM y Meta Schedule; el objetivo de optimización de la campaña no se cambió automáticamente a conversiones.<\/p>"

   "id": "historia-del-problema-con-instagram-y-mi",

   "blocks": [
    {
     "t": "raw",
     "h": "<p>La cuenta original @loslenosmvd (aproximadamente 25.100 seguidores al preparar el plan) presentó problemas que impidieron utilizarla normalmente para la nueva estrategia. Se creó @loslenosuy como destino de la comunicación; al inicio tenía alrededor de 19 seguidores. La migración de seguidores no es un traspaso automático ni una fusión de seguidores entre cuentas: se pidió a la comunidad volver a seguir el perfil nuevo.<\/p><p>Acciones planificadas/ejecutadas según el material de migración: bio de la cuenta anterior con aviso y @loslenosuy; publicaciones fijadas tipo línea de tres; historias recurrentes con enlace o mención al perfil nuevo; apoyo de creadores de contenido y publicidad de tráfico al perfil. Mantener la cuenta anterior como puente de derivación mientras sea relevante, sin asumir que quedó eliminada o desactivada.<\/p><p>Fecha de comienzo efectivo de pauta: 14/08/2026, pese a que algunas presentaciones previas proyectaban lanzamiento el 15/08. La cifra real la confirman los reportes mensuales.<\/p><p>Métricas de comunidad: agosto sumó 1.710 seguidores, de los cuales 1.424 fueron atribuidos a campañas de tráfico al perfil; septiembre registró 2.458 seguidores aportados por pauta. Los anuncios de influencers fueron particularmente relevantes. No sumar cifras de seguidores orgánicos, variación neta y atribución publicitaria como si representaran exactamente el mismo indicador.<\/p>"
    }
   ]
  },
  {
   "id": "plan-de-medios-inversion-variable-y-cont",
   "title": "Plan de Medios: inversión variable y control mensual obligatorio",
   "blocks": [
    {
     "t": "raw",
     "h": "<p>El total anual acordado es USD 25.000 (julio 2026 a abril 2027), incluyendo USD 1.740 ejecutados en julio para influencers. La pauta no corrió en julio por la problemática de cuentas y empezó en agosto. USD 2.000 que no se invirtieron en la etapa inicial se redistribuyeron con USD 500 adicionales mensuales entre septiembre y diciembre. No se incrementó el total anual.<\/p><div class=\"tw\"><table class=\"\"><thead><tr><th>Mes/etapa<\/th><th>Presupuesto USD<\/th><th>Criterio<\/th><\/tr><\/thead><tbody><tr><td>Julio 2026<\/td><td>1.740<\/td><td>Acciones con influencers; sin pauta activa<\/td><\/tr><tr><td>Agosto 2026<\/td><td>2.260<\/td><td>Mes parcial: desde 14/08<\/td><\/tr><tr><td>Septiembre–diciembre 2026<\/td><td>3.500 cada mes<\/td><td>Etapa de escala (+USD 500/mes)<\/td><\/tr><tr><td>Enero–abril 2027<\/td><td>1.750 cada mes<\/td><td>Continuidad / menor inversión<\/td><\/tr><tr class=\"total\"><td>TOTAL<\/td><td>25.000<\/td><td>Se mantiene la inversión anual<\/td><\/tr><\/tbody><\/table><\/div><div class=\"call\"><b class=\"t\">Regla operativa<\/b><p>Antes de empezar cada mes, releer el Plan de Medios aprobado. NO copiar automáticamente los presupuestos, objetivos ni distribuciones del mes anterior.<\/p><\/div><p>En Los Leños el PDM cambia a lo largo del año por etapa, temporada, necesidades comerciales y ajustes aprobados. El presupuesto de septiembre-diciembre de 2026 es USD 3.500 por mes, mientras que de enero a abril de 2027 baja a USD 1.750 por mes. La inversión global prevista es de USD 25.000: los aumentos de algunos meses se compensan con la redistribución documentada, no representan un aumento automático del presupuesto anual.<\/p><h3>Secuencia de control antes de cada nuevo mes<\/h3><ul><li>Abrir la última versión aprobada del Plan de Medios. Identificar si el mes corresponde a escala/inversión alta, continuidad/inversión baja o una activación extraordinaria; confirmar montos por plataforma.<\/li><li>Comparar el PDM con la Planilla de Activaciones y el cronograma. Revisar objetivos y presupuesto de cada campaña: Meta Alcance, promocionados, tráfico al perfil propio, influencers, visitas a Tableo, eventos empresariales y TikTok.<\/li><li>Revisar lo gastado, los días de circulación y el ritmo de consumo por campaña. No trasladar automáticamente saldos, extras o presupuestos de una campaña/mes a otro sin verificar la aprobación correspondiente.<\/li><li>Si cambian montos o prioridades del período, confirmar la versión aprobada, la fecha del ajuste y el impacto sobre alcance, frecuencia, captación de seguidores, visitas a Tableo y mensajes; registrar el cambio donde corresponda.<\/li><li>Si el mes coincide con la migración publicitaria a Aleph (prevista para noviembre), revisar el presupuesto tanto en la cuenta original como en la nueva, definir la fecha de corte y evitar dos campañas activas gastando sobre la misma partida.<\/li><li>Al cerrar el mes, conciliar inversión planificada versus ejecutada por plataforma y campaña. Documentar desvíos aprobados y comenzar el siguiente mes con la etapa y los importes vigentes, no con la configuración heredada.<\/li><\/ul><div class=\"call\"><b class=\"t\">Punto de control para noviembre<\/b><p>La referencia del PDM es USD 3.500, pero antes de activar se debe confirmar la distribución final aprobada y la transición a Aleph. En enero de 2027 el plan baja a USD 1.750 por mes: no mantener por inercia los presupuestos altos de diciembre.<\/p><\/div><div class=\"tw\"><table class=\"\"><thead><tr><th>Etapa<\/th><th>Meta alcance<\/th><th>Meta tráfico perfil<\/th><th>TikTok<\/th><th>Meta visitas reservas<\/th><\/tr><\/thead><tbody><tr><td>Agosto (plan)<\/td><td>900<\/td><td>300<\/td><td>600<\/td><td>460<\/td><\/tr><tr><td>Sept–dic (plan)<\/td><td>1.400<\/td><td>450<\/td><td>950<\/td><td>700<\/td><\/tr><tr><td>Ene–abr (plan)<\/td><td>700<\/td><td>225<\/td><td>475<\/td><td>350<\/td><\/tr><\/tbody><\/table><\/div><p>Estas distribuciones son el plan de referencia por etapa, no la fotografía exacta de las campañas ejecutadas. En septiembre efectivamente se trabajó con seis campañas Meta y TikTok, con reasignaciones y una campaña de mensajes de eventos. El desglose ejecutado debe verificarse contra el Ads Manager y la Planilla.<\/p>"
    }
   ]
  },
  {
   "id": "estructura-de-campanas-ejecutada-en-sept",
   "title": "Estructura de campañas ejecutada en septiembre 2026",
   "blocks": [
    {
     "t": "raw",
     "h": "<div class=\"tw\"><table class=\"\"><thead><tr><th>Campaña Meta<\/th><th>Inversión USD<\/th><th>Función<\/th><\/tr><\/thead><tbody><tr><td>Alcance AO<\/td><td>697,91<\/td><td>Cobertura / branding<\/td><\/tr><tr><td>Alcance AO promocionado<\/td><td>596,52<\/td><td>Reforzar contenidos de marca<\/td><\/tr><tr><td>Tráfico a Tableo AO<\/td><td>698,88<\/td><td>Visitas al sistema de reservas<\/td><\/tr><tr><td>Tráfico al perfil AO<\/td><td>399,52<\/td><td>Seguidores en @loslenosuy<\/td><\/tr><tr><td>Tráfico al perfil – Influencers<\/td><td>299,87<\/td><td>Amplificar creadores y atraer comunidad<\/td><\/tr><tr><td>Mensajes – Eventos empresariales<\/td><td>99,96<\/td><td>Consultas de eventos<\/td><\/tr><tr class=\"total\"><td>TOTAL META<\/td><td>2.792,66<\/td><td>Cierre septiembre<\/td><\/tr><\/tbody><\/table><\/div><p>TikTok Alcance: inversión USD 700 en septiembre, 357.806 personas alcanzadas y frecuencia 7,88. La suma de inversión de Meta y TikTok en el cierre fue USD 3.492,66, próxima a los USD 3.500 planificados, pero la distribución por campaña difiere del esquema inicial: no copiar las partidas de la propuesta como si fueran el desglose real.<\/p>"
    }
   ]
  },
  {
   "id": "resultados-y-criterios-de-lectura",
   "title": "Resultados y criterios de lectura",
   "blocks": [
    {
     "t": "raw",
     "h": "<div class=\"tw\"><table class=\"\"><thead><tr><th>Indicador<\/th><th>Agosto<\/th><th>Septiembre<\/th><\/tr><\/thead><tbody><tr><td>Meta: inversión USD<\/td><td>1.627,34<\/td><td>2.792,66<\/td><\/tr><tr><td>Meta: alcance objetivo branding<\/td><td>407.987<\/td><td>435.348<\/td><\/tr><tr><td>Meta: frecuencia branding<\/td><td>4,70<\/td><td>8,11<\/td><\/tr><tr><td>Crecimiento por pauta / seguidores reportados<\/td><td>1.710 (total); 1.424 atribuibles a tráfico al perfil<\/td><td>2.458 atribuidos a pauta<\/td><\/tr><tr><td>Visitas a Tableo<\/td><td>4.013<\/td><td>8.471<\/td><\/tr><tr><td>TikTok: alcance<\/td><td>364.750<\/td><td>357.806<\/td><\/tr><tr><td>TikTok: frecuencia<\/td><td>6,53<\/td><td>7,88<\/td><\/tr><tr><td>TikTok: inversión USD<\/td><td>599,98<\/td><td>700<\/td><\/tr><\/tbody><\/table><\/div><p>Septiembre también generó 25 conversaciones de eventos empresariales a USD 4 por conversación. Los indicadores de alcance/frecuencia pueden corresponder a la selección de campañas de branding, no necesariamente al total agregado de todas las campañas; revisar filtros del reporte antes de comparar.<\/p><p>Principales aprendizajes: septiembre superó la meta de 300.000 personas alcanzadas en Meta y los 7 impactos; TikTok superó su frecuencia objetivo pero quedó por debajo del alcance previsto de 420.000. Se busca optimizar la relación entre cobertura y repetición, no aumentar frecuencia indiscriminadamente.<\/p>"
    }
   ]
  },
  {
   "id": "creatividades-y-aprendizajes",
   "title": "Creatividades y aprendizajes",
   "blocks": [
    {
     "t": "raw",
     "h": "<p>Reconocimiento: horno a leña, experiencia de cena, variedad de platos. Tráfico al perfil: productos reales y el diferencial de propuesta 100% libre de gluten; “Platos individuales” atribuyó 257 seguidores; “Desconfianza”, 124; “No tienen”, 122. Influencers: Pati Wolf (639 seguidores), Guía Sin Gluten (373) y Recomiendo (372) entre las piezas destacadas del reporte de septiembre. Estos resultados se refieren a anuncios destacados, no al total de cada campaña.<\/p><p>Tráfico a Tableo: la pieza de Tarta Vasca registró 4.003 visitas en septiembre y concentró casi la mitad del total de 8.471. Otros recursos eficientes: llamados claros a reservar, productos atractivos y beneficios Santander. Los contenidos creativos deben funcionar para personas celíacas y también para quienes eligen el restaurante por experiencia y sabor.<\/p>"
    }
   ]
  },
  {
   "id": "medicion-real-de-reservas-tableo-gtm-met",
   "title": "Medición real de reservas: Tableo → GTM → Meta",
   "blocks": [
    {
     "t": "raw",
     "h": "<p>Antecedente: la campaña de tráfico a Tableo medía visitas al enlace, que no equivalen a reservas confirmadas. En septiembre se identificó la necesidad de captar un evento real de confirmación. Los Leños no contaba inicialmente con una web propia ni contenedor GTM dedicado; se inició configuración específica sobre la confirmación del widget de Tableo.<\/p><p>Se trabajó con el píxel de Meta 1448703297103486 y el evento estándar Schedule, disparado en páginas de reserva confirmada de Tableo. Se diseñó una protección contra duplicados por booking ID en almacenamiento del navegador, ya que al recargar la página GTM podía ejecutar nuevamente la etiqueta. La protección reduce duplicaciones en el mismo navegador; no garantiza deduplicación universal entre dispositivos.<\/p><p>Estado según la última validación conversada el 19/10: Tableo → GTM → Meta probado; Schedule recibido y recarga sin nuevo evento duplicado en Meta. En ese intercambio también se había señalado la posible falta de publicación del contenedor; verificar en GTM si la versión validada está efectivamente PUBLICADA y en Eventos de prueba / Administrador de eventos la recepción desde tráfico real. No confundir prueba correcta en vista previa con producción confirmada.<\/p><p>Decisión de optimización: durante octubre se mantuvo el objetivo de visitas a Tableo. Se evaluaría cambiar a una campaña optimizada por reservas reales durante noviembre, solo si la medición quedaba consolidada y había volumen de conversiones suficiente. No presentar ese cambio como ejecutado sin verificarlo.<\/p><h3>Chequeo técnico al tomar la cuenta<\/h3><p>1) Abrir el contenedor GTM y revisar versión publicada. 2) Revisar etiquetas, activador de confirmación y protección de duplicados. 3) Validar Schedule en Meta para una reserva real o prueba autorizada. 4) Contrastar reservas del gestor Tableo con eventos registrados; cuantificar discrepancias. 5) Revisar qué evento está seleccionado como resultado/optimización en la campaña vigente. 6) Documentar cualquier cambio en la bitácora.<\/p>"
    }
   ]
  },
  {
   "id": "migracion-de-pauta-a-aleph-noviembre",
   "title": "Migración de pauta a Aleph: noviembre",
   "blocks": [
    {
     "t": "raw",
     "h": "<p>ACTUALIZACIÓN 28/10: Los Leños y Ramona cuentan con nuevas cuentas publicitarias de Meta bajo el Business Portfolio de Aleph para la transición de noviembre. Para Los Leños se compartió la nueva cuenta Meta ID 1655980199656682 (Business 4439100643027772). La CUENTA YA EXISTE, pero eso no confirma que los anuncios se hayan migrado, que los eventos de Tableo/Schedule estén asignados o que la inversión esté activa allí. TikTok Aleph aún requiere confirmar nueva cuenta y alcance de la migración.<\/p><p>Checklist de transición: verificar responsables y permisos; propiedad y acceso a página e Instagram nuevos; asociación de píxel/dataset y acceso al mismo evento Schedule; GTM y Tableo; métodos de pago; públicos y contenidos autorizados; estructura de campaña, presupuesto mensual aprobado y fechas. Evitar que la cuenta anterior y la nueva gasten en simultáneo sin plan de transición. En TikTok también hay que revisar identidad, acceso y nueva cuenta de anuncios.<\/p><p>La migración de cuentas publicitarias a Aleph es distinta de la migración de Instagram de julio-agosto: la primera cambia la infraestructura de compra de medios; la segunda trasladó a la audiencia hacia un perfil nuevo mediante comunicación y pauta.<\/p>"
    }
   ]
  },
  {
   "id": "reporting-mensual-comparabilidad-y-alert",
   "title": "Reporting: mensual, comparabilidad y alertas",
   "blocks": [
    {
     "t": "raw",
     "h": "<p>Reporte mensual en Looker Studio; usar Planilla de Activaciones para validar nombres, presupuesto y períodos. En agosto la pauta fue parcial (14/08–31/08), por lo que comparar contra septiembre exige explicar ese cambio de días activos, inversión y distribución. En octubre revisar la campaña de visitas versus medición Schedule sin declarar que son el mismo KPI. Para leer la evolución mensual, comprobar además si cambió la etapa del PDM: una variación de inversión, días activos o mezcla de campañas no debe interpretarse automáticamente como mejora o deterioro de performance.<\/p><p>Seguimiento recomendado: Alcance y frecuencia Meta/TikTok; visitas a Tableo; seguidores de @loslenosuy y atribución por anuncios; mensajes de eventos empresariales; reservas confirmadas reales si Schedule se encuentra publicado y validado. En el reporte separar claramente KPI de plataforma, resultado de negocio y período de medición. Si se informa ROAS o costo por reserva, establecer previamente qué reservas y valores se están contando.<\/p>"
    }
   ]

"><b>Instagram nuevo<i>↗<\/i><\/b><em>instagram.com<\/em><\/a><a class=\"lk\" href=\"https://www.instagram.com/loslenosmvd/\" target=\"_blank\" rel=\"noopener\"><b>Instagram anterior<i>↗<\/i><\/b><em>instagram.com<\/em><\/a><\/div><p>Los enlaces históricos provienen de los marcadores Chrome. La nueva cuenta Meta Aleph fue comunicada el 28/10/2026 y se incluye en este mapa de accesos. Mantener acceso a ambas hasta confirmar el corte; actualizar Planilla de Activaciones y reporting cuando la campaña pase efectivamente a la nueva cuenta.<\/p>"

  {
   "id": "proximos-hitos-estados-y-responsables",
   "title": "Próximos hitos, estados y responsables",
   "blocks": [
    {
     "t": "raw",
     "h": "<div class=\"tw\"><table class=\"\"><thead><tr><th>Tema<\/th><th>Estado al corte<\/th><th>Próxima comprobación<\/th><\/tr><\/thead><tbody><tr><td>Campañas AO Meta/TikTok<\/td><td>Confirmadas en septiembre; octubre no revisado en vivo<\/td><td>Comparar Planilla y Ads Manager<\/td><\/tr><tr><td>Presupuesto noviembre<\/td><td>Plan vigente: USD 3.500<\/td><td>Confirmar aprobación y distribución antes de activar<\/td><\/tr><tr><td>Migración a Aleph (Meta)<\/td><td>NUEVA cuenta Meta creada: ID 1655980199656682; Business 4439100643027772. Campañas aún sin migración confirmada.<\/td><td>Validar permisos, activos, pixel/dataset, Schedule, facturación, fecha de corte y primer gasto en nueva cuenta. TikTok Aleph pendiente de confirmar.<\/td><\/tr><tr><td>Schedule Tableo en Meta<\/td><td>Probado en octubre<\/td><td>Confirmar GTM publicado y eventos de producción<\/td><\/tr><tr><td>Optimización a reservas<\/td><td>No consta aplicada; octubre seguía a visitas<\/td><td>Evaluar en noviembre según calidad/volumen<\/td><\/tr><tr><td>Migración de seguidores<\/td><td>Nueva cuenta activa; cuenta anterior como puente<\/td><td>Revisar bio, historias y seguimiento<\/td><\/tr><tr><td>Responsable Paid definitivo<\/td><td>Sin confirmar<\/td><td>Coordinar con el equipo de Paid<\/td><\/tr><\/tbody><\/table><\/div>"

  {
   "id": "criterios-de-decisiones-y-riesgos",
   "title": "Criterios de decisiones y riesgos",
   "blocks": [
    {
     "t": "raw",
     "h": "<p>Priorizar datos reales de reservas antes que clics cuando la medición sea confiable, pero no cambiar pujas ni objetivos sin validación. Mantener por separado alcance, perfil, visitas a Tableo, influencers y eventos empresariales: cada campaña aporta una parte distinta del funnel. Revisar siempre el total mensual, los períodos de mayor/menor inversión y la existencia de campañas extras. No asumir que la nueva infraestructura Aleph conserva automáticamente audiencias, píxeles, resultados históricos o permisos de la cuenta anterior.<\/p>"

    {
     "t": "raw",
     "h": "<p>Los Nietitos es una marca uruguaya de alimentos, de posicionamiento familiar y masivo. Comunica dulce de leche, dulces y mermeladas, membrillo, miel, jugos y productos especiales. El territorio de marca trabajado en las comunicaciones es \"Hecho con gusto\", con cercanía a los momentos cotidianos de desayuno, merienda, recetas y reuniones familiares.<\/p><p>La pauta Always On cumple principalmente una función de branding: asegurar cobertura amplia y repetición suficiente para construir recordación. Las activaciones extraordinarias buscan reforzar lanzamientos y momentos relevantes de marca. La promoción Mundo DDL incluye una mecánica de participación, pero los reportes entregados no miden directamente compras o inscripciones atribuibles a medios.<\/p><div class=\"tw\"><table class=\"left\"><thead><tr><th>Pilar<\/th><th>Objetivo y criterio de éxito<\/th><\/tr><\/thead><tbody><tr><td>Always On<\/td><td>Alcance único, frecuencia, impresiones y CPM; los clics son indicador secundario de interés, no el KPI comercial principal.<\/td><\/tr><tr><td>Promociones extra<\/td><td>Difusión y recordación de mecánica, premios y ventana de participación; seguimiento separado por canal y periodo.<\/td><\/tr><tr><td>Lanzamientos<\/td><td>Presentar nuevos productos y su disponibilidad; si no existe medición comercial, no atribuir ventas a las impresiones.<\/td><\/tr><tr><td>Contenido orgánico<\/td><td>Recetas, producto, tradición, humor cotidiano y piezas interactivas que alimentan la rotación publicitaria.<\/td><\/tr><\/tbody><\/table><\/div>"
    }
   ]
  },
  {
   "id": "ecosistema-de-medios-y-fuentes-operativa",
   "title": "Ecosistema de medios y fuentes operativas",
   "blocks": [
    {
     "t": "raw",
     "h": "<p>En la operativa documentada durante 2026 conviven Meta Ads (Facebook e Instagram), TikTok Ads y Google Ads para campañas de video extraordinarias. El Always On mensual medido en los reportes de junio a septiembre corresponde a Meta y TikTok; no debe suponerse que Google forme parte del presupuesto mensual estable.<\/p><p>Fuentes de gestión: Planilla de Activaciones para fechas, anuncios, objetivos y montos; cronograma aprobado para definiciones creativas y circulación; Looker Studio para reportes mensuales; Mainsheet para datos complementarios; carpeta de marca/Carpeta Cliente para aprobaciones y cierres extraordinarios.<\/p><p>La persona que toma la cuenta conoce ARCO. El valor de este documento es mostrar qué revisar específicamente en Los Nietitos, sin explicar procedimientos generales de activación.<\/p>"
    }
   ]
  },
  {
   "id": "plan-de-medios-revision-mensual-obligato",
   "title": "Plan de Medios: revisión mensual obligatoria",
   "blocks": [
    {
     "t": "raw",
     "h": "<div class=\"call\"><b class=\"t\">Regla operativa<\/b><p>antes de activar o duplicar cualquier campaña, consultar el último Plan de Medios aprobado y la pestaña Los Nietitos de la Planilla de Activaciones. No copiar presupuestos, fechas o frecuencias del mes anterior sin verificar cambios de inversión, aprobaciones o campañas extra.<\/p><\/div><div class=\"tw\"><table class=\"left\"><thead><tr><th>Concepto<\/th><th>Referencia documentada<\/th><th>Advertencia<\/th><\/tr><\/thead><tbody><tr><td>Meta Always On<\/td><td>En junio y julio se ejecutaron aproximadamente USD 920; agosto USD 879,98; septiembre USD 919,93.<\/td><td>Histórico de reportes, no presupuesto aprobado para octubre.<\/td><\/tr><tr><td>TikTok Always On<\/td><td>Aproximadamente USD 300 al mes entre junio y septiembre.<\/td><td>Corroborar monto del PDM del mes actual.<\/td><\/tr><tr><td>Mundo DDL<\/td><td>Acción extra del 17/09 al 11/10 en Meta, TikTok y Google.<\/td><td>Presupuesto fuera del Always On: no sumar como si fuese gasto mensual recurrente.<\/td><\/tr><tr><td>Día DDL<\/td><td>Acción extra del 06/10 al 11/10, incluida pieza TopView el 11/10.<\/td><td>Ventana corta: objetivos, gasto y distribución distintos de un mes completo.<\/td><\/tr><tr><td>Mocaccino<\/td><td>Se envió un PDM específico solicitando aprobación a Claudia.<\/td><td>Confirmar aprobación y estado de pauta; no se dispone de un cierre verificado.<\/td><\/tr><\/tbody><\/table><\/div><h3>Secuencia de control mensual<\/h3><ul><li>Abrir el Plan de Medios vigente y confirmar fecha, plataforma, monto y objetivo por campaña.<\/li><li>Comparar con Planilla de Activaciones, cronograma aprobado y estado real en Meta/TikTok/Google.<\/li><li>Separar Always On de campañas extra; verificar que no se duplique presupuesto al solapar períodos.<\/li><li>Controlar ritmo de consumo diario y límites de gasto en Google, especialmente para acciones cortas.<\/li><li>Verificar disponibilidad de piezas aprobadas; si el cronograma se retrasa, documentar el impacto en la rotación.<\/li><li>Al cerrar el mes, conciliar inversión planificada versus ejecutada por canal/campaña y explicar desvíos.<\/li><\/ul>"
    }
   ]
  },
  {
   "id": "resultados-always-on-junio-a-septiembre-",
   "title": "Resultados Always On: junio a septiembre de 2026",
   "blocks": [
    {
     "t": "raw",
     "h": "<p>Cifras de portada de los reportes mensuales. Para comparaciones, conservar siempre el mismo nivel de filtro (plataforma, campaña, fecha). Meta septiembre presenta una inconsistencia entre portada y detalle que se documenta debajo.<\/p><div class=\"tw\"><table class=\"\"><thead><tr><th>Mes<\/th><th>Meta: alcance / frecuencia / USD<\/th><th>TikTok: alcance / frecuencia / USD<\/th><\/tr><\/thead><tbody><tr><td>Junio<\/td><td>477.488 | 6,95 | 920<\/td><td>327.089 | 4,65 | 300<\/td><\/tr><tr><td>Julio<\/td><td>495.621 | 7,49 | 919,99<\/td><td>327.441 | 5,10 | 299,55<\/td><\/tr><tr><td>Agosto<\/td><td>505.923 | 7,47 | 879,98<\/td><td>359.949 | 4,75 | 300<\/td><\/tr><tr><td>Septiembre*<\/td><td>870.586 | 7,75 | 919,93<\/td><td>430.606 | 4,13 | 299,75<\/td><\/tr><\/tbody><\/table><\/div><div class=\"call\"><b class=\"t\">Aclaración septiembre<\/b><p>el resumen principal del reporte Meta exhibe alcance 870.586 y frecuencia 7,75, mientras el total de la tabla de detalle muestra 522.243 personas y frecuencia 6,59 (la fila Always On indica 491.311 y 6,33). No corresponde presentar estas cifras como si midieran el mismo universo. Verificar filtros y alcances agregados de Looker antes de hacer un comparativo consolidado.<\/p><\/div><p>Interpretación: Meta logró frecuencia cercana o superior al objetivo mensual durante julio y agosto, y en el detalle de septiembre mantuvo una cobertura de escala relevante. TikTok superó el umbral de frecuencia 4 en los cuatro meses, pero el reporte fija una aspiración de cobertura amplia (~750.000 personas) que no queda alcanzada con los volúmenes observados. No confundir cumplir frecuencia con cumplir simultáneamente todos los objetivos de cobertura.<\/p>"
    }
   ]
  },
  {
   "id": "audiencias-y-criterio-de-optimizacion",
   "title": "Audiencias y criterio de optimización",
   "blocks": [
    {
     "t": "raw",
     "h": "<p>En junio se decidió acotar el público para acercar la frecuencia objetivo al presupuesto disponible. Se mantuvo la lógica de cobertura masiva pero con mayor concentración de impresiones, en lugar de distribuir la inversión sobre un universo tan amplio que diluyera el contacto.<\/p><div class=\"tw\"><table class=\"left\"><thead><tr><th>Canal<\/th><th>Metas históricas mencionadas<\/th><th>Señales de audiencia<\/th><\/tr><\/thead><tbody><tr><td>Meta<\/td><td>Referencia: 60% del público (aprox. 400.000 personas) y 7 impactos mensuales.<\/td><td>Instagram amplió cobertura; Facebook tendió a concentrar más clics. Mujeres 25-34 destacaron en clics, con presencia de segmentos mayores.<\/td><\/tr><tr><td>TikTok<\/td><td>Referencia: 60% del público (aprox. 750.000 personas) y 4 impactos mensuales.<\/td><td>Audiencia 18-34 relevante; mantener equilibrio entre cobertura y repetición, no maximizar frecuencia indefinidamente.<\/td><\/tr><\/tbody><\/table><\/div><p>Las comparaciones de género, edad, CPM y CPC deben interpretarse como aprendizaje creativo/distributivo; no equivalen a una segmentación manual confirmada como vigente. Validar la configuración efectiva antes de modificar los conjuntos o grupos de anuncios.<\/p>"
    }
   ]
  },
  {
   "id": "creatividades-que-funciono-y-por-que",
   "title": "Creatividades: qué funcionó y por qué",
   "blocks": [
    {
     "t": "raw",
     "h": "<div class=\"tw\"><table class=\"\"><thead><tr><th>Período / medio<\/th><th>Piezas destacadas<\/th><th>Aprendizaje<\/th><\/tr><\/thead><tbody><tr><td>Junio / Meta<\/td><td>Crumble de Membrillo; Dulce Intenso; Jugadores.<\/td><td>Crumble lideró alcance/clics/eficiencia; el contenido de Mundial sumó contexto.<\/td><\/tr><tr><td>Julio / Meta<\/td><td>Receta Waffles; Crumble de Membrillo.<\/td><td>Las recetas combinaron cobertura de escala con respuesta por clic.<\/td><\/tr><tr><td>Agosto / Meta<\/td><td>Waffles; Crumble de Membrillo; Dulce Intenso.<\/td><td>Producto en uso, preparaciones reales y un beneficio visual concreto mejoran respuesta.<\/td><\/tr><tr><td>Septiembre / Meta<\/td><td>Sabor Intenso; Budín de Pan; Sumas.<\/td><td>Sabor Intenso lideró volumen; Budín de Pan fue eficiente; el juego aportó interacción.<\/td><\/tr><tr><td>Junio-agosto / TikTok<\/td><td>Dulce Intenso y Miel Intensa.<\/td><td>Videos simples con producto protagonista sostuvieron distribución.<\/td><\/tr><tr><td>Septiembre / TikTok<\/td><td>Refruta Manzana Banana y Membrillo Untable.<\/td><td>Visibilidad de líneas diferentes dentro de una misma marca masiva.<\/td><\/tr><\/tbody><\/table><\/div><p>Criterio de continuación: combinar recetas, novedades, atributos de producto, dinámicas de participación y formatos de contexto. No limitar el Always On a una sola categoría de dulce de leche: la marca trabaja también mermeladas, dulces, jugos y miel.<\/p>"
    }
   ]
  },
  {
   "id": "campana-extra-mundo-dulce-de-leche",
   "title": "Campaña extra: Mundo Dulce de Leche",
   "blocks": [
    {
     "t": "raw",
     "h": "<p>Periodo documentado: 17/09 al 11/10/2026. Acción adicional para incentivar la compra de Dulce de Leche Los Nietitos y la participación promocional mediante ingreso del número de lote del producto en una web específica. En la planificación se mencionaron 1.000 premios; confirmar las bases oficiales si la mecánica se vuelve a comunicar.<\/p><p>El objetivo publicitario reportado fue alcance y frecuencia/recordación, no conversiones directas. Los anuncios de Meta se dirigieron a los perfiles sociales de Los Nietitos; por tanto, el volumen de clics no demuestra tráfico a la web de participación ni ventas de productos.<\/p><div class=\"tw\"><table class=\"\"><thead><tr><th>Plataforma<\/th><th>Objetivo de campaña<\/th><th>Resultado<\/th><th>Inversión<\/th><\/tr><\/thead><tbody><tr><td>Meta<\/td><td>600.000 personas / 7 impactos<\/td><td>838.230 / 7,17; 6.006.812 impresiones<\/td><td>USD 1.800,00<\/td><\/tr><tr><td>TikTok<\/td><td>450.000 personas / 5 impactos<\/td><td>543.604 / 6,33; 3.442.343 impresiones<\/td><td>USD 825,00<\/td><\/tr><tr><td>Google (video)<\/td><td>450.000 personas / 3 impactos<\/td><td>376.956 / 3,40; 4.272.961 impresiones<\/td><td>USD 1.538,19<\/td><\/tr><\/tbody><\/table><\/div><p>Meta: el anuncio de lanzamiento tuvo USD 1.000 asignados; otros USD 800 se repartieron entre piezas sobre mecánica, premios y continuidad de la promoción. Facebook aportó mayor cobertura y clics que Instagram en el informe de la campaña.<\/p><p>TikTok: se documentan contenidos de lanzamiento, promoción, tentación, premios restantes y cómo participar. Google: cumplió frecuencia >3, pero quedó por debajo de la meta de 450.000 personas alcanzadas; el consumo de presupuesto se describe en la sección 9.<\/p><p>Fuente: Los-Nietitos-Reporte-de-resultados-10-Mundo-DDL-Extra.pdf. El informe posee encabezado de filtro temporal de septiembre aunque la ventana declarada es 17/09-11/10; usar las fechas de la campaña al comunicarlo y revisar filtros si se actualiza.<\/p>"
    }
   ]
  },
  {
   "id": "campana-extra-dia-del-dulce-de-leche",
   "title": "Campaña extra: Día del Dulce de Leche",
   "blocks": [
    {
     "t": "raw",
     "h": "<p>Periodo documentado: 06/10 al 11/10/2026. Campaña de alta concentración de inversión en solo seis días para el Día del Dulce de Leche (11 de octubre). La pieza principal fue un spot de 19 segundos en horizontal y vertical, más una reducción vertical de 13 segundos. El 11/10 se utilizó un TopView en TikTok, según el informe de cierre.<\/p><p>Criterio creativo trabajado: destacar la trayectoria y el conocimiento de Los Nietitos en dulce de leche, con foco en producto, textura y calidad; la variedad es una consecuencia de ese expertise. En comunicaciones se trabajaron \"El sabor que nos une\", \"Dulce de Leche para todos\" y la idea de expertos en dulce de leche. No asumir que todos los conceptos o versiones exploradas fueron publicaciones finales.<\/p><div class=\"tw\"><table class=\"\"><thead><tr><th>Plataforma<\/th><th>Objetivo de campaña<\/th><th>Resultado<\/th><th>Inversión<\/th><\/tr><\/thead><tbody><tr><td>Meta<\/td><td>800.000 personas / 4 impactos<\/td><td>724.525 / 3,58; 2.594.753 impresiones<\/td><td>USD 799,98<\/td><\/tr><tr><td>TikTok<\/td><td>400.000 personas / 4 impactos<\/td><td>808.922 / 2,17; 1.755.408 impresiones<\/td><td>USD 498,34<\/td><\/tr><tr><td>Google (video)<\/td><td>450.000 personas / 3 impactos<\/td><td>460.083 / 1,70; 706.599 impresiones<\/td><td>USD 263,43<\/td><\/tr><\/tbody><\/table><\/div><p>Lectura responsable: Meta estuvo cerca de los dos objetivos, sin alcanzar plenamente las referencias de 800.000 y 4; TikTok superó ampliamente alcance pero no frecuencia; Google superó alcance y quedó debajo de la frecuencia prevista. El margen de optimización fue menor por la duración muy corta de la activación.<\/p><p>Meta: el spot horizontal de 19 segundos tuvo USD 500 asignados, seguido de versión vertical de 19 segundos y recorte de 13 segundos. El reporte señala mayor alcance masculino y mayor proporción de clics de Instagram, aunque Facebook lideró cobertura.<\/p><p>TopView: la ejecución está mencionada en el reporte. No sumar una inversión específica de TopView a estas tablas sin comprobar si se reportó por separado y si la inversión ya está incluida en el cierre.<\/p><p>Fuente: Los-Nietitos-Reporte-de-resultados-10-DDL-Extra.pdf.<\/p>"
    }
   ]
  },
  {
   "id": "alerta-tecnica-gasto-de-google-en-las-do",
   "title": "Alerta técnica: gasto de Google en las dos extras",
   "blocks": [
    {
     "t": "raw",
     "h": "<p>El problema: los reportes atribuyen a un límite de presupuesto de la plataforma la imposibilidad de distribuir/consumir el monto pensado para Día DDL. En esa campaña estaban previstos USD 800 para Google y solo se ejecutaron USD 263,43; esto limitó especialmente la frecuencia.<\/p><div class=\"tw\"><table class=\"\"><thead><tr><th>Campaña<\/th><th>Gasto Google<\/th><th>Referencia<\/th><\/tr><\/thead><tbody><tr><td>Mundo Dulce de Leche<\/td><td>USD 1.538,19<\/td><td>17/09-11/10<\/td><\/tr><tr><td>Día del Dulce de Leche<\/td><td>USD 263,43<\/td><td>06/10-11/10; USD 800 previstos para esta campaña<\/td><\/tr><tr class=\"total\"><td>TOTAL COMBINADO<\/td><td>USD 1.801,62<\/td><td>Los informes indican USD 1.800 de presupuesto total combinado<\/td><\/tr><\/tbody><\/table><\/div><div class=\"call warn\"><b class=\"t\">Aclaración crítica<\/b><p>los montos efectivamente consumidos suman USD 1.801,62, prácticamente el total combinado de USD 1.800. Por tanto, NO es correcto informar sin matices que Google \"dejó sin gastar gran parte del presupuesto total\". Lo que sí está documentado es el desbalance de inversión entre acciones y la limitación particular del Día DDL. El tipo exacto de límite (cuenta, campaña, facturación u otra restricción) no consta validado en los materiales.<\/p><\/div><p>Procedimiento ante una nueva campaña de Google: revisar presupuesto aprobado por pieza y fechas; inspeccionar alertas/límites de gasto de la cuenta antes del lanzamiento; controlar delivery diario en acciones cortas; documentar desajustes y comunicar el alcance real del incidente con cifras verificadas.<\/p><p>En el traspaso comercial: los dos reportes extraordinarios de octubre se dejaron en Carpeta Cliente, sin reunión específica de presentación. Al remitirlos, adjuntar ambos enlaces y explicar la particularidad del consumo de Google dentro del cuerpo del correo.<\/p>"
    }
   ]
  },
  {
   "id": "lanzamiento-de-dulce-de-leche-mocaccino",
   "title": "Lanzamiento de Dulce de Leche Mocaccino",
   "blocks": [
    {
     "t": "raw",
     "h": "<p>En octubre de 2026 se comunicó un nuevo sabor de dulce de leche: Mocaccino, que combina dulce de leche, café y chocolate. Se comunicó disponibilidad durante octubre en Disco, Devoto y Géant. En la planificación anterior se trabajó el segmento de 30 a 50 años y una presentación de perfil premium/edición limitada, sujeto a los materiales finales aprobados.<\/p><p>Existe antecedente de envío a Claudia del Plan de Medios de inversión de la campaña de Mocaccino, solicitando aprobación para ponerlo en marcha. NO se encontró en los materiales revisados el monto final, fecha de activación confirmada ni reporte de resultados. Verificar todo esto antes de marcar la acción como ejecutada.<\/p><p>Los lineamientos de contenido de octubre también mencionaron jugos y línea Light junto al protagonismo de dulce de leche. Esto es una referencia editorial, no evidencia de presupuesto adicional aprobado para esas líneas.<\/p>"
    }
   ]
  },
  {
   "id": "otros-territorios-y-activaciones-mencion",
   "title": "Otros territorios y activaciones mencionadas en conversaciones",
   "blocks": [
    {
     "t": "raw",
     "h": "<div class=\"tw\"><table class=\"left\"><thead><tr><th>Acción<\/th><th>Contexto histórico<\/th><th>Estado de evidencia<\/th><\/tr><\/thead><tbody><tr><td>Día del Abuelo (junio 2026)<\/td><td>Propuesta de sorteo con audio de recetas familiares por WhatsApp y apoyo de creadores (cocina/humor/familia).<\/td><td>Hubo planificación y propuestas de copy; confirmar ejecución final y resultados antes de citarlo como campaña cerrada.<\/td><\/tr><tr><td>Jugos 100% fruta<\/td><td>Naranja, manzana y naranja-durazno; comunicación de sin azúcares agregados y sin conservantes.<\/td><td>Territorio de producto trabajado en contenido; verificar claims aprobados por etiqueta.<\/td><\/tr><tr><td>Día del Celíaco<\/td><td>El foco de copy fue destacar la variedad de productos sin gluten, evitando la palabra \"acompañamos\" en ese contexto.<\/td><td>Criterio de redacción de contenido; no se documenta inversión extra.<\/td><\/tr><tr><td>Dulce de Leche para todos<\/td><td>Concepto de variedad trabajado entre septiembre y octubre; piezas con formatos y tonos diferentes.<\/td><td>No equiparar automáticamente cada idea creativa explorada con material finalmente pautado.<\/td><\/tr><tr><td>Recetas y tradición<\/td><td>Desayunos, meriendas, mermeladas, membrillo, dulce de batata y dulces de leche, con familiares y recetas como contexto.<\/td><td>Territorio Always On con evidencia en cronograma y resultados.<\/td><\/tr><\/tbody><\/table><\/div>"
    }
   ]
  },
  {
   "id": "criterios-creativos-y-tono-de-la-marca",
   "title": "Criterios creativos y tono de la marca",
   "blocks": [
    {
     "t": "raw",
     "h": "<p>Tono cercano, cálido, familiar y uruguayo. Lenguaje claro, cotidiano y positivo, con invitaciones simples a probar. Usar emojis moderados (preferentemente al final de la primera frase, no al comienzo) y hashtags recurrentes #LosNietitos y #HechoConGusto. Evitar un tono grandilocuente, dramático o excesivamente neutro.<\/p><p>Para nuevos productos, priorizar una bajada comercial invitante con ventaja concreta. Para la campaña del Día del Dulce de Leche, el trabajo creativo subrayó expertise de producto, experiencia y más de 60 años de trayectoria; la variedad se incorpora sin desplazar la promesa principal de calidad.<\/p><p>El proceso de aprobación importa: Claudia participa en la revisión de piezas y PDM. En septiembre se comentaron objeciones a una propuesta de TopView y ajustes para que no replicara sin adaptación el spot de TV. Como el reporte luego informa TopView ejecutado el 11/10, no se debe asumir qué variante específica fue la definitiva sin revisar los artes y archivos finales.<\/p>"
    }
   ]
  },
  {
   "id": "operativa-de-activaciones-aprobaciones-y",
   "title": "Operativa de activaciones, aprobaciones y chequeos",
   "blocks": [
    {
     "t": "raw",
     "h": "<h3>Aprobaciones y continuidad Always On<\/h3><p>En agosto y septiembre los propios reportes registraron que la falta de aprobación de cronogramas afectaba directamente el rendimiento de Meta y TikTok. El Paid entrante debe verificar de forma anticipada qué piezas tienen aprobación y hasta cuándo circulan; si hay demoras, acordar alternativas existentes y documentar el impacto. No cargar anuncios o presupuestos sin la versión final aprobada.<\/p><h3>Chequeo diario/semanal<\/h3><ul><li>Contrastar cada campaña activa con la Planilla de Activaciones: nombre, plataforma, conjunto, monto, inicio, fin, URL y estado.<\/li><li>Verificar inversión, impresiones y frecuencia; detectar pausas, learning, rechazos o creatividades vencidas.<\/li><li>Controlar que los extras no reemplacen sin intención al Always On y que el reporte mantenga universos separados.<\/li><li>En Google, revisar límites y consumo por campaña durante promociones breves, no únicamente al final.<\/li><li>Actualizar bitácora/registro cuando se modifican presupuestos, audiencias, piezas o fechas, distinguiendo implementado de propuesto.<\/li><\/ul>"
    }
   ]
  },
  {
   "id": "reporting-cuales-son-los-cierres-y-como-",
   "title": "Reporting: cuáles son los cierres y cómo leerlos",
   "blocks": [
    {
     "t": "raw",
     "h": "<div class=\"tw\"><table class=\"left\"><thead><tr><th>Entregable<\/th><th>Fuente / periodicidad<\/th><th>Cuidado<\/th><\/tr><\/thead><tbody><tr><td>Always On Meta + TikTok<\/td><td>Reporte Looker Studio mensual; datos y filtros por plataforma.<\/td><td>Meta septiembre requiere conciliar resumen y detalle; no combinar alcance no deduplicado entre plataformas.<\/td><\/tr><tr><td>Mundo Dulce de Leche<\/td><td>Reporte extra del 17/09 al 11/10.<\/td><td>Separar de septiembre y octubre AO; verificar su ventana real.<\/td><\/tr><tr><td>Día Dulce de Leche<\/td><td>Reporte extra del 06/10 al 11/10.<\/td><td>Evento corto, TopView, y desbalance del presupuesto Google.<\/td><\/tr><tr><td>Acción/resultado comercial<\/td><td>Mecánica web con ingreso de lote.<\/td><td>Sin cifras de compras, registros, lotes o ventas validadas en fuentes: no inferir conversión.<\/td><\/tr><\/tbody><\/table><\/div><p>El análisis competitivo de los reportes incluye referencias como Conaprole (dulce de leche), Limay y Rincón del Gigante (mermeladas/dulces), Citric y Campo Claro (jugos). La actividad es variable por mes. Es contexto de benchmarking de Biblioteca de Anuncios, no prueba de presupuestos de competidores.<\/p><p>Los cierres de octubre se guardaron en Carpeta Cliente; no se solicitó reunión para presentarlos. Para un email de seguimiento, compartir los dos enlaces y concentrar la explicación en la distribución del gasto Google y la comparación correcta de objetivos, sin repetir todas las métricas del reporte.<\/p>"
    }

repoint.com<\/em><\/a><a class=\"lk\" href=\"https://www.instagram.com/losnietitos/\" target=\"_blank\" rel=\"noopener\"><b>Instagram | @losnietitos<i>↗<\/i><\/b><em>instagram.com<\/em><\/a><a class=\"lk\" href=\"https://www.tiktok.com/@losnietitosuy\" target=\"_blank\" rel=\"noopener\"><b>TikTok | @losnietitosuy<i>↗<\/i><\/b><em>tiktok.com<\/em><\/a><\/div><p>Archivos clave dentro de los recursos: reportes de resultados 06, 07, 08 y 09 de 2026; Los-Nietitos-Reporte-de-resultados-10-Mundo-DDL-Extra.pdf; Los-Nietitos-Reporte-de-resultados-10-DDL-Extra.pdf; Cronograma-Los Nietitos-08-2026.pdf; Plan de Medios Mocaccino y artes finales a localizar en la Carpeta Cliente. Los enlaces directos a los dos PDFs de octubre deben recuperarse desde esa carpeta.<\/p>"

   "blocks": [
    {
     "t": "raw",
     "h": "<div class=\"tw\"><table class=\"\"><thead><tr><th>Tema<\/th><th>Estado al corte<\/th><th>Qué verificar<\/th><\/tr><\/thead><tbody><tr><td>AO Meta/TikTok junio-septiembre<\/td><td>Ejecutado y reportado<\/td><td>PDM de octubre y noviembre; aprobaciones, presupuesto e inventario activo.<\/td><\/tr><tr><td>Público más acotado desde junio<\/td><td>Optimización documentada<\/td><td>Segmentación actual y criterios 2026, sin extrapolar configuración histórica.<\/td><\/tr><tr><td>Mundo DDL<\/td><td>Campaña finalizada con cierre al 11/10<\/td><td>Enlaces finales, bases promoción y participaciones reales si la marca los aporta.<\/td><\/tr><tr><td>Día DDL + TopView<\/td><td>Ejecución informada en el reporte<\/td><td>Activos finales, coste TopView y alcance con/sin cruce entre formatos.<\/td><\/tr><tr><td>Google | límite de gasto<\/td><td>Incidencia reportada<\/td><td>Naturaleza del límite y control de delivery para nuevos extras.<\/td><\/tr><tr><td>Mocaccino<\/td><td>PDM enviado para aprobación<\/td><td>Aprobación, fecha y presupuestos, piezas finales, si hubo pauta activa.<\/td><\/tr><tr><td>Aprobación de cronogramas<\/td><td>Demoras reportadas<\/td><td>Quíen aprueba, estado de artes y fechas para siguientes semanas.<\/td><\/tr><tr><td>Meta septiembre | alcance<\/td><td>Resumen y detalle discrepantes<\/td><td>Revisar filtros en Looker antes de comparativos anuales.<\/td><\/tr><tr><td>Responsable Paid y destinatarios<\/td><td>Sin asignación final documentada<\/td><td>Actualizar persona asignada, contraparte cliente y accesos.<\/td><\/tr><\/tbody><\/table><\/div>"

     "h": "<p>En gráficos comparativos no sumar alcances Meta + TikTok + Google como personas únicas (hay superposición entre plataformas). No usar el presupuesto aprobado como sinónimo de gasto ejecutado. No transformar clics hacia una red social en conversiones de promoción. No afirmar que una pieza creativa propuesta fue finalmente emitida sin revisar su versión final.<\/p><p>Nombres de archivos revisados: Los-Nietitos-Reporte-de-resultados-06-2026.pdf; 07-2026.pdf; 08-2026.pdf; 09-2026.pdf; Los-Nietitos-Reporte-de-resultados-10-Mundo-DDL-Extra.pdf; Los-Nietitos-Reporte-de-resultados-10-DDL-Extra.pdf; Cronograma-Los Nietitos-08-2026.pdf. Contexto adicional: conversaciones con el equipo 2025-2026 sobre concepto creativo, pauta extraordinaria, Mocaccino, aprobaciones y correo de resultados del 22/10/2026; archivo interno Marcadores Chrome.html.<\/p>"

 "alert": "Actualizado: 28 de octubre de 2026 / Último cierre de resultados: septiembre 2026 / Nueva cuenta Meta Aleph creada; migración de pauta por validar",
 "home": {
  "canales": "Meta Ads · TikTok Ads",
  "inversion": "Variable por períodos altos y bajos; septiembre–octubre se planificó en conjunto (17/09 al 31/10). Revisar el PDM",
