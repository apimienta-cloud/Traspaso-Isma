  {
   "id": "la-cuenta-en-un-minuto",
   "title": "La cuenta en un minuto",
   "blocks": [
    {
     "t": "raw",
     "h": "<div class=\"tw\"><table class=\"left\"><thead><tr><th>Dimensión<\/th><th>Situación operativa<\/th><\/tr><\/thead><tbody><tr><td>Marca y objetivo<\/td><td>TopLine: construir recordación de marca en públicos jóvenes a través de Meta Ads y TikTok Ads.<\/td><\/tr><tr><td>Inversión de referencia<\/td><td>USD 1.000 mensuales como base histórica de AO: Meta USD 700 y TikTok USD 300. Puede variar por sorteos, activaciones de Antel Arena u otros eventos especiales; confirmar siempre el PDM del mes.<\/td><\/tr><tr><td>Meta Ads<\/td><td>Alcance Always On; Alcance Promocionado registrado en septiembre; Tráfico al perfil con septiembre como último mes documentado y pausa efectiva por confirmar; Interacción en sorteos.<\/td><\/tr><tr><td>TikTok Ads<\/td><td>Alcance Always On con producciones audiovisuales, contenido contextual, tendencias y piezas de producto.<\/td><\/tr><tr><td>Diferencial operativo<\/td><td>Acuerdo con Antel Arena vinculado a sorteos de entradas; activa la comunidad, pero modifica inversión, resultados y seguimiento.<\/td><\/tr><tr><td>Momento del traspaso<\/td><td>El cierre documentado más reciente es septiembre. Para octubre hay que comprobar qué sorteos continuaron y cómo se reasignó Tráfico.<\/td><\/tr><\/tbody><\/table><\/div>"
    }
   ]
  },
  {
   "id": "contexto-de-marca-y-papel-de-paid-media",
   "title": "Contexto de marca y papel de Paid Media",
   "blocks": [
    {
     "t": "raw",
     "h": "<p>TopLine es una marca de consumo masivo. La pauta digital se ha concentrado en presencia sostenida, contacto frecuente con el público y asociación con momentos culturales y de entretenimiento. Meta aporta cobertura y acciones hacia Instagram; TikTok permite repetir el mensaje con un lenguaje audiovisual más cercano a la audiencia joven.<\/p><ul><li>No se identificó un objetivo central de e-commerce, ROAS, CPA ni ventas directas en los reportes analizados: no juzgar el plan por conversiones de compra.<\/li><li>El crecimiento del perfil es una meta secundaria trabajada con Tráfico, contenido orgánico y sorteos. Separar visitas al perfil de seguidores ganados y de retención posterior.<\/li><li>Las acciones con entradas de espectáculos producen picos de comentarios, seguidores y mensajes. Esto no debe confundirse con una mejora estructural del Always On.<\/li><li>El público con mayor respuesta en pauta tiende a ubicarse entre 18 y 34 años, especialmente 25-34; los perfiles de seguidores orgánicos y las distribuciones de género no son exactamente iguales.<\/li><\/ul>"
    }
   ]
  },
  {
   "id": "arquitectura-de-campanas-rol-y-lectura",
   "title": "Arquitectura de campañas: rol y lectura",
   "blocks": [
    {
     "t": "raw",
     "h": "<div class=\"tw\"><table class=\"left\"><thead><tr><th>Campaña / canal<\/th><th>Función<\/th><th>KPI correcto / observación<\/th><\/tr><\/thead><tbody><tr><td>Meta - Alcance AO<\/td><td>Presencia masiva, recordación y escala de marca.<\/td><td>Alcance único, frecuencia, CPM, inversión y evolución de cobertura.<\/td><\/tr><tr><td>Meta - Alcance Promocionado AO<\/td><td>Reforzar frecuencia sobre un público más concentrado (septiembre).<\/td><td>Frecuencia del conjunto, escala real y posible solapamiento con Alcance AO.<\/td><\/tr><tr><td>Meta - Tráfico al perfil<\/td><td>Llevar visitas a Instagram y apoyar el crecimiento de seguidores.<\/td><td>Visitas al perfil, coste por visita y crecimiento orgánico neto; último mes documentado: septiembre.<\/td><\/tr><tr><td>Meta - Interacción / Sorteos<\/td><td>Amplificar contenidos de concursos o sorteos en fechas específicas.<\/td><td>Presupuesto separado, período, interacciones y resultado cualitativo / seguidores retenidos.<\/td><\/tr><tr><td>TikTok - Alcance AO<\/td><td>Branding en formatos de creadores, tendencias, producto y situaciones culturales.<\/td><td>Alcance, frecuencia, impresiones, inversión y creatividad destacada.<\/td><\/tr><\/tbody><\/table><\/div><div class=\"call\"><b class=\"t\">Regla de plataforma<\/b><p>Los resultados de alcance y frecuencia deben interpretarse por objetivo y nivel de agregación. No sumar alcances de distintas campañas como si fueran personas únicas deduplicadas.<\/p><\/div>"
    }
   ]
  },
  {
   "id": "plan-de-medios-inversion-y-control-mensu",
   "title": "Plan de Medios: inversión y control mensual obligatorio",
   "blocks": [
    {
     "t": "raw",
     "h": "<p>El presupuesto mensual habitual de Always On (AO) es de USD 1.000, distribuido históricamente entre Meta (USD 700) y TikTok (USD 300). Este es el monto de referencia actual para la pauta regular, pero no un presupuesto invariable: puede modificarse cuando se realizan sorteos, acciones con Antel Arena u otros eventos especiales, ya sea por inversión extra o por una redistribución aprobada. Antes de cada mes, revisar el PDM vigente, la Planilla de Activaciones y el cronograma para confirmar el monto total, la distribución y las campañas en circulación.<\/p><h3>Evolución de la inversión ejecutada (USD)<\/h3><div class=\"tw\"><table class=\"\"><thead><tr><th>Mes 2026<\/th><th>Meta, ejecutado<\/th><th>TikTok, ejecutado<\/th><th>Interpretación<\/th><\/tr><\/thead><tbody><tr><td>Junio<\/td><td>799,75<\/td><td>299,98<\/td><td>Meta incluye refuerzo puntual ligado al sorteo Airbag; base aproximada USD 700.<\/td><\/tr><tr><td>Julio<\/td><td>699,96<\/td><td>299,58<\/td><td>Mes más cercano al presupuesto regular; sin sorteo en pauta según el reporte.<\/td><\/tr><tr><td>Agosto<\/td><td>699,43<\/td><td>300,00<\/td><td>Pauta regular; el desglose visible de Meta requiere conciliación.<\/td><\/tr><tr><td>Septiembre<\/td><td>917,33<\/td><td>299,99<\/td><td>Meta incluye sorteo Tan Biónica y comienzo parcial de María Becerra; separar extra de AO.<\/td><\/tr><\/tbody><\/table><\/div><p>Control de agosto: el detalle visible del reporte lista USD 450 en Alcance y USD 150 en Tráfico, pero el total se informa alrededor de USD 699. No atribuir los USD 100 restantes a un objetivo específico sin revisar Ads Manager y la Planilla.<\/p><h3>Desglose relevante de Meta en septiembre<\/h3><div class=\"tw\"><table class=\"\"><thead><tr><th>Objetivo / campaña<\/th><th>USD aprox.<\/th><th>Condición<\/th><\/tr><\/thead><tbody><tr><td>Alcance AO<\/td><td>350<\/td><td>Always On<\/td><\/tr><tr><td>Alcance Promocionado AO<\/td><td>200<\/td><td>Always On, refuerzo de frecuencia<\/td><\/tr><tr><td>Tráfico al perfil AO<\/td><td>150<\/td><td>Último mes de la campaña, según reporte<\/td><\/tr><tr><td>Interacción - sorteo Tan Biónica<\/td><td>200<\/td><td>Extra, activación específica<\/td><\/tr><tr><td>Interacción - sorteo María Becerra<\/td><td>18<\/td><td>Tramo parcial a fines de septiembre; campaña nombrada octubre<\/td><\/tr><\/tbody><\/table><\/div><p>El total de septiembre fue USD 917,33 según el reporte; la suma de presupuestos redondeados de las filas es ligeramente distinta. Para cierres y comparaciones, usar siempre el gasto ejecutado del mismo corte de datos.<\/p><h3>Procedimiento de control al iniciar cada mes<\/h3><ol class=\"steps\"><li>Leer el PDM aprobado y verificar si Antel Arena o el cliente sumaron sorteos; identificar monto extraordinario, responsable y fechas.<\/li><li>Contrastar los montos de PDM con la Planilla de Activaciones y los presupuestos vigentes de Meta y TikTok, incluidas campañas programadas.<\/li><li>Separar presupuesto de branding mensual de Interacción puntual; revisar que los extras no se dupliquen ni se absorban silenciosamente.<\/li><li>Confirmar si Tráfico al perfil está desactivada y si su presupuesto fue trasladado efectivamente a Alcance. Registrar el cambio con fecha.<\/li><li>Revisar cronograma, anuncios activos, creatividades, estado de pagos y posibles rechazos antes de comenzar la circulación.<\/li><li>Dejar documentado qué quedó aplicado, quién aprobó cada cambio y cuál es la métrica principal de evaluación.<\/li><\/ol>"
    }
   ]
  },
  {
   "id": "resultados-de-branding-evolucion-de-juni",
   "title": "Resultados de branding: evolución de junio a septiembre",
   "blocks": [
    {
     "t": "raw",
     "h": "<h3>Meta Ads - cifras de resumen mensual<\/h3><div class=\"tw\"><table class=\"\"><thead><tr><th>Mes 2026<\/th><th>Alcance reportado<\/th><th>Frecuencia resumen<\/th><th>Meta referencial<\/th><\/tr><\/thead><tbody><tr><td>Junio<\/td><td>363.164<\/td><td>6,56<\/td><td>420.000 personas / 7 impactos<\/td><\/tr><tr><td>Julio<\/td><td>412.701<\/td><td>5,68<\/td><td>420.000 / 7<\/td><\/tr><tr><td>Agosto<\/td><td>441.400<\/td><td>5,47<\/td><td>420.000 / 7<\/td><\/tr><tr><td>Septiembre<\/td><td>368.361<\/td><td>6,35*<\/td><td>420.000 / 7<\/td><\/tr><\/tbody><\/table><\/div><p>* Importante: en septiembre el resumen muestra frecuencia 6,35, mientras la tabla total de campañas de Meta muestra 5,66. Además, Alcance AO tiene frecuencia 4,73 y Alcance Promocionado 7,28. Son lecturas de distintas vistas o filtros que deben revisarse antes de publicar una comparativa definitiva. Mantener intactas las cifras de origen.<\/p><h3>TikTok Ads - cifras de resumen mensual<\/h3><div class=\"tw\"><table class=\"\"><thead><tr><th>Mes 2026<\/th><th>Alcance<\/th><th>Frecuencia<\/th><th>Inversión USD<\/th><\/tr><\/thead><tbody><tr><td>Junio<\/td><td>268.612<\/td><td>5,17<\/td><td>299,98<\/td><\/tr><tr><td>Julio<\/td><td>282.931<\/td><td>5,32<\/td><td>299,58<\/td><\/tr><tr><td>Agosto<\/td><td>258.174<\/td><td>5,75<\/td><td>300,00<\/td><\/tr><tr><td>Septiembre<\/td><td>237.836<\/td><td>5,85<\/td><td>299,99<\/td><\/tr><\/tbody><\/table><\/div><p>La referencia de TikTok en los reportes es alcanzar aproximadamente 280.000 personas y una frecuencia mínima de 4 impactos mensuales. La frecuencia se sostuvo por encima de 4 en los cuatro meses; la cobertura varió y no alcanzó siempre la referencia.<\/p><div class=\"call\"><b class=\"t\">Lectura de performance<\/b><p>TopLine busca un equilibrio entre cobertura y repetición, no solo el máximo alcance posible. La cuenta puede superar frecuencia en una audiencia pequeña y continuar por debajo de la cobertura buscada.<\/p><\/div>"
    }
   ]
  },
  {
   "id": "sorteos-y-acuerdo-con-antel-arena-eje-cr",
   "title": "Sorteos y acuerdo con Antel Arena: eje crítico de continuidad",
   "blocks": [
    {
     "t": "raw",
     "h": "<p>TopLine ha realizado múltiples sorteos de entradas ligados a su vínculo con Antel Arena, según el contexto comercial de la cuenta. Estos concursos generan incrementos puntuales de interacción y consultas, además de oportunidades de crecimiento de Instagram. Cada activación debe tener un registro propio: fecha, evento, partida de pauta, creatividad y condiciones concretas validadas con el equipo.<\/p><h3>Historial identificado<\/h3><div class=\"tw\"><table class=\"left\"><thead><tr><th>Acción<\/th><th>Periodo / pauta respaldada<\/th><th>Lectura para el traspaso<\/th><\/tr><\/thead><tbody><tr><td>Sorteo Cumbia Club<\/td><td>Mayo 2026, mencionado en el cierre de junio.<\/td><td>Sorteo asociado a buenos resultados de interacción; no hay inversión individual validada en las fuentes revisadas.<\/td><\/tr><tr><td>Sorteo entradas Airbag<\/td><td>Junio 2026; Meta Interacción USD 100.<\/td><td>Refuerzo puntual sobre Meta, con importante participación orgánica; no atribuir todo el crecimiento de seguidores al anuncio.<\/td><\/tr><tr><td>Sorteo Tan Biónica<\/td><td>Del 4 al 17 de septiembre; Meta Interacción USD 200.<\/td><td>Campaña extraordinaria documentada; 925 clics en tabla de pauta, no equivalentes a participaciones verificadas.<\/td><\/tr><tr><td>Sorteo María Becerra<\/td><td>30 de septiembre al 1 de octubre; USD 18 ejecutados en septiembre.<\/td><td>Campana etiquetada octubre y solapada con cierre de septiembre; su presupuesto total y cierre completo no están confirmados aquí.<\/td><\/tr><tr><td>Otras acciones culturales<\/td><td>Antecedentes: Cosquín Rock y Blowing Mandarine.<\/td><td>Se mencionan como activaciones históricas; no adjudicarles automáticamente condiciones del acuerdo Antel Arena.<\/td><\/tr><\/tbody><\/table><\/div><h3>Qué revisar antes, durante y después de un sorteo<\/h3><ol class=\"steps\"><li>Confirmar con el equipo responsable qué entradas están disponibles, a qué función corresponden y qué mecánica/condiciones están aprobadas; no asumir cantidad de premios ni derechos de uso.<\/li><li>Definir fechas de publicación, cierre, selección, contacto y anuncio de ganadores; coordinar con creatividad y Community Management.<\/li><li>Dejar el presupuesto de Interacción separado del AO e identificar si es adicional o una redistribución; ingresar todo en Planilla y cronograma.<\/li><li>Comprobar campaña, destino, creatividad, políticas aplicables y condiciones del sorteo antes de publicar; verificar aprobación de anuncios.<\/li><li>Monitorear interacciones, dudas por mensajes, comentarios y reputación. Medir impacto temporal en visitas al perfil y en seguidores netos; no reportar clics como participantes.<\/li><li>Cerrar y pausar la pauta en fecha; registrar ganadores y entrega mediante el circuito definido por el cliente, sin trasladar información personal sensible al reporte de pauta.<\/li><\/ol><div class=\"call\"><b class=\"t\">Lectura del acuerdo<\/b><p>El alcance exacto del convenio con Antel Arena (entradas disponibles, cronograma futuro, aprobaciones y responsables) no aparece desarrollado en los reportes. Confirmarlo con quienes gestionan la cuenta antes de planificar nuevos sorteos.<\/p><\/div>"
    }
   ]
  },
  {
   "id": "trafico-al-perfil-de-instagram-etapa-y-f",
   "title": "Tráfico al perfil de Instagram: etapa y fin de la campaña",
   "blocks": [
    {
     "t": "raw",
     "h": "<p>Meta sostuvo una campaña específica de Tráfico al perfil al menos desde mayo de 2026. Funcionaba como apoyo al crecimiento de Instagram, junto a contenidos de creadores y sorteos. Septiembre aparece documentado como su último mes, porque el rendimiento dejó de justificar su continuidad frente al objetivo de branding.<\/p><div class=\"tw\"><table class=\"\"><thead><tr><th>Mes<\/th><th>Visitas al perfil (reporte)<\/th><th>Inversión Tráfico aprox.<\/th><th>Contexto<\/th><\/tr><\/thead><tbody><tr><td>Junio<\/td><td>6.422<\/td><td>USD 200<\/td><td>Acciones ligadas al Mundial y sorteo Airbag; buen volumen de clics.<\/td><\/tr><tr><td>Julio<\/td><td>3.852<\/td><td>USD 200<\/td><td>Caen las visitas tras el impulso de junio y sin sorteo en pauta.<\/td><\/tr><tr><td>Agosto<\/td><td>2.419<\/td><td>USD 150<\/td><td>Nuevo descenso pese a costes por clic relativamente bajos.<\/td><\/tr><tr><td>Septiembre<\/td><td>2.652<\/td><td>USD 150<\/td><td>Leve repunte, pero se decidió discontinuar el objetivo para priorizar branding.<\/td><\/tr><\/tbody><\/table><\/div><h3>Seguidores no son visitas<\/h3><div class=\"tw\"><table class=\"\"><thead><tr><th>Cierre mensual<\/th><th>Seguidores del perfil (snapshot)<\/th><th>Observación<\/th><\/tr><\/thead><tbody><tr><td>Junio<\/td><td>11.175<\/td><td>No refleja directamente atribución exclusiva de pauta.<\/td><\/tr><tr><td>Julio<\/td><td>11.288<\/td><td>La comunidad sigue creciendo, con contenido contextual.<\/td><\/tr><tr><td>Agosto<\/td><td>11.434<\/td><td>Continúa el crecimiento de comunidad.<\/td><\/tr><tr><td>Septiembre<\/td><td>11.425<\/td><td>Baja neta de nueve respecto a agosto pese a sorteos; alerta de retención / rebote.<\/td><\/tr><\/tbody><\/table><\/div><p>La diferencia mensual de seguidores puede incorporar altas, bajas y acciones orgánicas simultáneas. Los reportes mencionan un posible rebote luego de anunciar ganadores de sorteos. El valor de Tráfico no debe evaluarse solo por clics baratos: la retención y la contribución real al crecimiento son esenciales.<\/p><div class=\"call warn\"><b class=\"t\">Estado a verificar en octubre<\/b><p>En septiembre quedó comunicada la decisión de finalizar Tráfico. La eventual reasignación de sus USD 150 a Alcance se planteó como próximo paso, pero su ejecución debe verificarse en la Planilla y Ads Manager antes de darla por aplicada.<\/p><\/div>"
    }
   ]
  },
  {
   "id": "meta-aprendizajes-de-cobertura-frecuenci",
   "title": "Meta: aprendizajes de cobertura, frecuencia y anuncios",
   "blocks": [
    {
     "t": "raw",
     "h": "<p>La referencia de branding en Meta fue alcanzar unas 420.000 personas con al menos siete impactos mensuales. La inversión se distribuyó entre Alcance AO y, en septiembre, un bloque de Alcance Promocionado para buscar mayor frecuencia. El promocionado alcanzó 76.515 personas con frecuencia 7,28 en septiembre: buena repetición local, pero sin cubrir por sí solo la meta general.<\/p><ul><li>Septiembre: Alcance AO gastó USD 350, Alcance Promocionado USD 200 y Tráfico USD 150; el resto del gasto fueron concursos de Interacción.<\/li><li>El alcance septiembre fue inferior al de agosto, aunque crecieron algunos indicadores de repetición. No interpretar solo la frecuencia alta de una campaña como éxito de toda la estrategia.<\/li><li>Las audiencias de 25-34 y 18-24 concentraron gran parte de la respuesta; el reporte de Meta mostró mayor peso masculino en alcance y clics.<\/li><li>Anuncios destacados: tocadiscos, aire fresco, pantalla de cámara; la estética retro y los objetos reconocibles fueron recursos eficaces para generar atención.<\/li><li>Al bajar o subir fondos entre Alcance, Promocionado y Tráfico, revisar el efecto conjunto: escala, saturación por subaudiencia y nivel de inversión real.<\/li><\/ul>"
    }
   ]
  },
  {
   "id": "tiktok-branding-y-particularidades-de-la",
   "title": "TikTok: branding y particularidades de la plataforma",
   "blocks": [
    {
     "t": "raw",
     "h": "<p>TikTok mantuvo una campaña de alcance de alrededor de USD 300 mensuales entre junio y septiembre. La frecuencia superó de forma sostenida la meta de cuatro impactos. Los clips con cultura pop, situaciones cortas y estética de creadores encajaron con la audiencia de la plataforma.<\/p><ul><li>Junio: Álbum y Caída; vinculación contextual con el Mundial y formatos breves.<\/li><li>Julio: Turbo Cancha, Globo y Content Mundial; mezcla de juego, producto y contexto.<\/li><li>Agosto: Tocadiscos, Content Chisme y Filmadora; continuidad de recursos retro y lenguaje de creadores.<\/li><li>Septiembre: Pantalla Cámara, DVD y Aire Fresco, con buena presencia en la campaña.<\/li><li>Los grupos 18-24 y 25-34 son los más relevantes en el histórico, sin que esto justifique modificar audiencias sin revisar la configuración vigente.<\/li><\/ul><p>Existe un antecedente comentado de anuncios de TikTok con infracciones aparentemente erróneas y apelaciones previas aceptadas. No hay un rechazo pendiente documentado en el cierre de septiembre: ante nuevos casos, revisar motivo y cuenta afectada y apelar cuando corresponda, sin asumir que todas las incidencias son errores.<\/p>"
    }
   ]
  },
  {
   "id": "creatividad-que-tipo-de-contenido-funcio",
   "title": "Creatividad: qué tipo de contenido funciona",
   "blocks": [
    {
     "t": "raw",
     "h": "<p>La pauta de TopLine se ha nutrido de un mix entre piezas de producto, contenido contextual y código de creadores. Las piezas que involucran personas, entrevistas y momentos culturales suelen aportar una interacción más significativa que materiales puramente descriptivos de producto.<\/p><ul><li>Mundial 2026: entrevistas sobre figuritas, dominadas y contenido con creadores fueron útiles para atraer visitas al perfil. En junio una entrevista de figuritas aportó 65 seguidores identificados en el reporte de anuncios; en julio hubo nuevas contribuciones de piezas de entrevistas.<\/li><li>Sorteos: generan interacción y pueden acelerar seguidores, pero requieren evaluar la baja posterior y la calidad de la comunidad que permanece.<\/li><li>Estética retro: tocadiscos, videojuegos, cámaras, DVD, filmadoras, garage y recursos de nostalgia se destacaron en agosto y septiembre.<\/li><li>Producto y formatos aspiracionales: mantener variedad de creatividades. Los resultados de anuncios destacados son referencias para nuevas versiones, no garantías de rendimiento.<\/li><li>Producción con influencers: septiembre tuvo una activación de tres días con participación de creadores; revisar cronograma específico para atribuir contenidos y fechas.<\/li><\/ul><h3>Banco de conceptos creativos comentados, no equivalentes a pauta aprobada<\/h3><p>Se discutieron ideas asociadas al Mundial como \"Golazo uruguayo\", \"auspiciante oficial del mejor aliento\" y recursos FOOH/FOH, así como visuales con packs TopLine. Son antecedentes de exploración creativa; no se dispone de confirmación de su activación como campañas pagas. No incluirlos como resultados ni como PDM aprobado.<\/p>"
    }
   ]
  },
  {
   "id": "reporting-y-lectura-correcta-de-los-dato",
   "title": "Reporting y lectura correcta de los datos",
   "blocks": [
    {
     "t": "raw",
     "h": "<ol class=\"steps\"><li>Elegir mes calendario y snapshot de Looker. Identificar objetivo, plataforma y si el dato corresponde al resumen, a Alcance AO, a Promocionado o a toda la cuenta Meta.<\/li><li>Reportar Meta y TikTok con alcance, frecuencia, impresiones e inversión. Comparar contra los objetivos declarados en el reporte y no con metas de otra plataforma.<\/li><li>Separar concursos e inversión extra de Always On. El presupuesto de Interacción no es directamente comparable con objetivos mensuales de branding.<\/li><li>Para Instagram diferenciar visitas al perfil, seguidores del mes, saldo neto y alcance orgánico. No sumar contactos o clicks como si fueran nuevos seguidores.<\/li><li>Incluir aprendizaje cualitativo de comentarios, mensajes y creatividades; evitar atribuir causalidad total del crecimiento de la cuenta a una pieza sin prueba.<\/li><li>Guardar versión presentada y registrar cualquier discrepancia de filtros antes de hacer comparativos entre meses.<\/li><\/ol><div class=\"call warn\"><b class=\"t\">Alerta del cierre de septiembre<\/b><p>El resumen general registra Meta alcance 368.361 con frecuencia 6,35, pero la tabla total indica frecuencia 5,66. Además, la primera tabla de la página muestra inversión aproximada USD 699 (solo AO) y el total con sorteos supera USD 917. Son universos distintos: explicitar qué se incluye en cada cifra.<\/p><\/div>"
    }
   ]
  },
  {
   "id": "competencia-referencias-de-social-y-paut",
   "title": "Competencia: referencias de social y pauta",
   "blocks": [
    {
     "t": "raw",
     "h": "<p>Los reportes siguen a Beldent y Mentos mediante Biblioteca de Anuncios y monitoreo orgánico. En julio y septiembre no figuraban anuncios activos de ambas marcas en el corte de Biblioteca de Anuncios consultado. Esa ausencia es temporal y no significa que no inviertan nunca o en otras plataformas.<\/p><ul><li>Beldent: antecedente de piezas centradas en producto, lanzamiento de sabor y participación de un artista, junto con rebranding y presencia digital irregular en ciertos meses.<\/li><li>Mentos: referencias de formatos de creadores y adaptación al lenguaje TikTok; volumen y actividad varían por mes.<\/li><li>Uso para Paid: observar formatos, frecuencia publicitaria y categorías comunicadas; no trasladar benchmarks externos sin considerar audiencia y objetivos.<\/li><\/ul>"
    }
   ]
  },
  {
   "id": "operativa-arco-adaptacion-especifica-a-t",
   "title": "Operativa ARCO: adaptación específica a TopLine",
   "blocks": [
    {
     "t": "raw",
     "h": "<div class=\"tw\"><table class=\"left\"><thead><tr><th>Frente<\/th><th>Regla de trabajo en esta marca<\/th><\/tr><\/thead><tbody><tr><td>ACTIVACIONES<\/td><td>Confirmar PDM, cronograma y contenidos con nombre de campaña; diferenciar AO de Interacción / sorteos. Validar fechas y cierre de cada promoción.<\/td><\/tr><tr><td>REPORTES<\/td><td>Cierre mensual en Looker. Separar campañas de branding de extras, resultados orgánicos y aprendizajes de concursos.<\/td><\/tr><tr><td>CHEQUEOS<\/td><td>Revisar alcance y frecuencia por plataforma, entrega diaria, presupuestos, sorteos por vencer, anuncios rechazados, vigencia de links y acciones de comunidad.<\/td><\/tr><tr><td>OPTIMIZACIONES<\/td><td>Documentar cambios de pesos Alcance/Promocionado/Tráfico, resultados buscados y estado real. No asumir que la propuesta de reasignación de septiembre está ejecutada.<\/td><\/tr><\/tbody><\/table><\/div>"
    }
   ]
  },
  {
   "id": "accesos-y-recursos-operativos-marcadores",
   "title": "Accesos y recursos operativos (marcadores de la carpeta Top)",
   "blocks": [
    {
     "t": "raw",
     "h": "<p>Los accesos se recuperaron del archivo de marcadores de trabajo. Los enlaces indican el destino histórico y deben confirmarse los permisos del nuevo Paid, en especial tras cualquier cambio de equipo o de cuenta publicitaria.<\/p><div class=\"links\"><a class=\"lk\" href=\"https://adsmanager.facebook.com/adsmanager/manage/campaigns?global_scope_id=741152185920682&business_id=741152185920682&act=1232057507690001&redirect_session_id=ce1ea6ca-56b2-4632-a474-38027bba34b9#\" target=\"_blank\" rel=\"noopener\"><b>Meta Ads - TopLine<i>↗<\/i><\/b><span>Alcance, Alcance Promocionado, Tráfico y sorteos.<\/span><em>adsmanager.facebook.com<\/em><\/a><a class=\"lk\" href=\"https://ads.tiktok.com/i18n/manage/campaign?aadvid=7216428783576924161&is_refresh_page=true\" target=\"_blank\" rel=\"noopener\"><b>TikTok Ads - TopLine<i>↗<\/i><\/b><span>Campaña de alcance, aprendizaje y estado de aprobaciones.<\/span><em>ads.tiktok.com<\/em><\/a><a class=\"lk\" href=\"https://lookerstudio.google.com/u/0/reporting/33a4aa36-5048-44b2-892b-db81c6fad94c/page/p_brq6ydasrd\" target=\"_blank\" rel=\"noopener\"><b>Looker Studio - Reporte<i>↗<\/i><\/b><span>Cierre de resultados pagados y orgánicos.<\/span><em>lookerstudio.google.com<\/em><\/a><a class=\"lk\" href=\"https://docs.google.com/spreadsheets/d/1YquYIhEAnW75bAPd8DRDm7IWQUQLxlpcJO_kuvZerhE/edit?gid=1614481835#gid=1614481835\" target=\"_blank\" rel=\"noopener\"><b>Mainsheet TopLine<i>↗<\/i><\/b><span>Soporte de datos, registros operativos y seguimiento.<\/span><em>docs.google.com<\/em><\/a><a class=\"lk\" href=\"https://docs.google.com/spreadsheets/d/1xcstTSLsC9Z4MBDeeK9Jc42YhSVDkGTP/edit?gid=1489300807#gid=1489300807\" target=\"_blank\" rel=\"noopener\"><b>Planilla de Activaciones TopLine<i>↗<\/i><\/b><span>Campanas, anuncios, montos y fechas vigentes: fuente de verdad para activar.<\/span><em>docs.google.com<\/em><\/a><a class=\"lk\" href=\"https://wasabimd-my.sharepoint.com/shared?id=%2Fpersonal%2Fwasabinos_wasabi_com_uy%2FDocuments%2FWasabi%20Digital%2FEQUIPO%20PEPPERS%2FTOPLINE&viewid=b855fcfb-0a16-45e2-b04a-364614209379\" target=\"_blank\" rel=\"noopener\"><b>Carpeta TopLine en SharePoint<i>↗<\/i><\/b><span>Activos, cronogramas y recursos de marca.<\/span><em>wasabimd-my.sharepoint.com<\/em><\/a><a class=\"lk\" href=\"https://docs.google.com/spreadsheets/d/1U3EEkR8-0XwDh2apIBKw5AZzzB7wSZBZTov6BGizJak/edit?gid=0#gid=0\" target=\"_blank\" rel=\"noopener\"><b>Presupuesto Mandarina (histórico)<i>↗<\/i><\/b><span>Planilla de una activación especial; validar vigencia y relación con el plan actual.<\/span><em>docs.google.com<\/em><\/a><\/div>"
    }
   ]
  },
  {
   "id": "matriz-de-decisiones-hecho-criterio-y-pe",
   "title": "Matriz de decisiones: hecho, criterio y pendiente",
   "blocks": [
    {
     "t": "raw",
     "h": "<div class=\"tw\"><table class=\"left\"><thead><tr><th>Estado<\/th><th>Decisión o antecedente<\/th><th>Qué debe saber el próximo Paid<\/th><\/tr><\/thead><tbody><tr><td>HECHO HISTÓRICO<\/td><td>Meta y TikTok sostuvieron campañas de branding en junio-septiembre.<\/td><td>AO habitual: USD 1.000 mensuales (Meta USD 700 + TikTok USD 300). Las acciones especiales o sorteos pueden cambiar el monto y/o su distribución.<\/td><\/tr><tr><td>IMPLEMENTADO EN EL HISTÓRICO<\/td><td>Interacción vinculada al sorteo Airbag en junio; Tan Biónica y María Becerra en septiembre.<\/td><td>Presupuestos y fechas se suman al contexto; no mezclar con AO.<\/td><\/tr><tr><td>DECISIÓN DOCUMENTADA<\/td><td>La campaña Tráfico al perfil tuvo su último mes en septiembre.<\/td><td>Comprobar estado pausado/cerrado en el administrador de octubre.<\/td><\/tr><tr><td>EVALUADO, NO CONFIRMADO<\/td><td>Reasignar presupuesto antes destinado a Tráfico hacia Alcance.<\/td><td>No presentarlo como aplicado sin revisar Planilla y Ads Manager.<\/td><\/tr><tr><td>ANTECEDENTE TÉCNICO<\/td><td>TikTok tuvo rechazos presuntamente erróneos y apelaciones favorables previas.<\/td><td>Verificar si persisten incidencias antes de cambiar contenido o configuración.<\/td><\/tr><tr><td><span class=\"tag pend\">A VALIDAR<\/span><\/td><td>Próximas activaciones, presupuestos, entradas y condiciones del convenio Antel Arena.<\/td><td>Confirmar fechas, presupuesto extra, mecánica y responsables.<\/td><\/tr><tr><td>DATO A CONCILIAR<\/td><td>Frecuencias de septiembre y desglose de Meta agosto no coinciden en todas las vistas.<\/td><td>No armonizar por intuición; registrar fuente, filtro y fecha del reporte.<\/td><\/tr><\/tbody><\/table><\/div>"
    }
   ]
  },
  {
   "id": "continuidad-que-revisar-al-tomar-la-cuen",
   "title": "Continuidad: qué revisar al tomar la cuenta",
   "blocks": [
    {
     "t": "raw",
     "h": "<ol class=\"steps\"><li>Confirmar PDM de octubre / noviembre, presupuestos, campañas realmente activas y fechas en la Planilla de Activaciones.<\/li><li>Revisar en Meta si Tráfico al perfil está pausada y si el presupuesto fue reasignado a Alcance; comprobar si Alcance Promocionado sigue activo.<\/li><li>Revisar el calendario de Antel Arena, posibles sorteos y partidas adicionales. Coordinar con cliente y equipo creativo antes de activar Interacción.<\/li><li>Consultar la Mainsheet y Looker para la continuidad del reporte; guardar comparativas desde el mismo nivel de agregación y evitar mezclar presupuestos extra con AO.<\/li><li>Confirmar que la cuenta de TikTok no mantiene anuncios rechazados, apelaciones sin resolver ni limitaciones de publicación.<\/li><li>Revisar cronogramas y resultados de contenidos con creadores e influencers. Evaluar frecuencia, alcance y retención en comunidad antes de proponer nuevas partidas de Tráfico.<\/li><li>La asignación definitiva dentro del equipo Paid (Flor / Pimi / Mono u otra persona) debe comunicarse, no suponerse.<\/li><\/ol>"
    }

   "title": "Fuentes, fecha de corte y verificaciones abiertas",
   "blocks": [
    {
     "t": "raw",
     "h": "<p>Fuentes documentales principales: Topline-Reporte-de-Resultados-06-2026.pdf; Topline-Reporte-de-Resultados.pdf (julio); Topline-Reporte-de-Resultados-08-2026.pdf; Topline-Reporte-de-Resultados-09-2026.pdf; Marcadores Chrome.html (carpeta Top). Además, antecedentes de conversaciones de Paid Media sobre activaciones del Mundial y apelaciones de TikTok, identificados como no validados en cuenta en vivo.<\/p><p>Fecha de corte: 28 de octubre de 2026. El último mes cerrado con reporte respaldado es septiembre de 2026. No se confirma con estas fuentes la configuración de octubre ni una aprobación de nuevas partidas para sorteos.<\/p><h3>Hoja de verificación para completar al tomar la marca<\/h3><div class=\"tw\"><table class=\"\"><thead><tr><th>Control<\/th><th>Estado en este traspaso<\/th><th>Registro a incorporar<\/th><\/tr><\/thead><tbody><tr><td>PDM aprobado del mes en curso<\/td><td><span class=\"tag pend\">Pendiente de validación<\/span><\/td><td>Fecha, aprobación y monto por canal.<\/td><\/tr><tr><td>Meta: destino de presupuesto Tráfico<\/td><td><span class=\"tag pend\">Pendiente de validación<\/span><\/td><td>Campaña pausada; si hubo reasignación, fecha y monto.<\/td><\/tr><tr><td>Sorteos del acuerdo Antel Arena<\/td><td><span class=\"tag pend\">Pendiente de validación<\/span><\/td><td>Agenda, premios, mecánica, fechas, creatividades y extra de pauta.<\/td><\/tr><tr><td>TikTok: incidencias y rechazos<\/td><td><span class=\"tag pend\">Pendiente de validación<\/span><\/td><td>Estado de anuncios y apelaciones abiertas.<\/td><\/tr><tr><td>Looker: frecuencia Meta septiembre<\/td><td><span class=\"tag pend\">Requiere conciliación<\/span><\/td><td>Confirmar filtro y nivel de agregación.<\/td><\/tr><tr><td>Accesos de quien recibe la marca<\/td><td><span class=\"tag pend\">Pendiente de asignación<\/span><\/td><td>Responsable y permisos en cada herramienta.<\/td><\/tr><\/tbody><\/table><\/div>"

const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];

function domain(u){try{return new URL(u).hostname.replace('www.','')}catch(e){return ''}}

function block(b){
  switch(b.t){
    case 'raw': return b.h;
    case 'p': return `<p>${b.h}</p>`;
    case 'h3': return `<h3>${b.h}</h3>`;
    case 'note': return `<p class="note">${b.h}</p>`;
    case 'ul': return `<ul>${b.items.map(i=>`<li>${i}</li>`).join('')}</ul>`;
    case 'steps': return `<ol class="steps">${b.items.map(i=>`<li>${i}</li>`).join('')}</ol>`;
    case 'cards': return `<div class="cards">${b.items.map(i=>`<div class="card"><b>${i.b}</b><p>${i.p}</p></div>`).join('')}</div>`;
    case 'kpis': return `<div class="kpis">${b.items.map(i=>`<div class="kpi"><div class="v">${i.v}</div><div class="l">${i.l}</div><div class="s">${i.s||''}</div></div>`).join('')}</div>`;
    case 'callout': return `<div class="call ${b.k==='rule'?'':b.k}"><b class="t">${b.title}</b><p>${b.h}</p></div>`;
    case 'table': {
      const rows=b.rows.map(r=>{
        const tot=!Array.isArray(r)&&r.total; const cells=tot?r.cells:r;
        return `<tr${tot?' class="total"':''}>${cells.map(c=>`<td>${c}</td>`).join('')}</tr>`;
      }).join('');
      return `<div class="tw"><table class="${b.cls||''}"><thead><tr>${b.head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;
    }
    case 'links': return `<div class="links">${b.items.map(i=>`<a class="lk" href="${i.u}" target="_blank" rel="noopener"><b>${i.n}<i>↗</i></b><span>${i.d}</span><em>${domain(i.u)}</em></a>`).join('')}</div>`;
  }
  return '';
}

function renderHome(){
  const rows = BRANDS.map(b=>`<tr><td style="white-space:nowrap"><a href="#${b.id}">${b.name}</a></td><td>${b.home.canales}</td><td>${b.home.inversion}</td><td style="white-space:nowrap">${b.asof.replace(' de octubre de 2026','/10/2026')}</td><td style="text-align:left">${b.home.pendiente}</td></tr>`).join('');
  return `
  <div class="panel" id="p-inicio">
    <div class="hero"><div class="eyebrow">Wasabi · Paid Media · Uso interno</div>
      <h1>${HOME.title}</h1><p>${HOME.lead}</p>
      <div class="meta"><span class="chip">${BRANDS.length} marcas cargadas</span><span class="chip o">Usá el buscador para cruzar marcas</span></div>
    </div>
    <div class="content">
      <section id="s-inicio-estado"><h2><span class="n">1</span>Estado por marca</h2>
        <div class="tw"><table><thead><tr><th>Marca</th><th>Canales</th><th>Inversión de referencia</th><th>Datos al</th><th>Pendiente clave</th></tr></thead><tbody>${rows}</tbody></table></div>
      </section>
      <section id="s-inicio-checklist"><h2><span class="n">2</span>Al tomar cualquier cuenta</h2>
        <ol class="steps">${HOME.checklist.map(i=>`<li>${i}</li>`).join('')}</ol>
      </section>
      <section id="s-inicio-conv"><h2><span class="n">3</span>Convenciones de lectura</h2>
        <ul>
          <li><b>Estados no verificados</b> aparecen en recuadros naranja: no asumirlos como vigentes.</li>
          <li><b>Reglas de cálculo y criterio</b> aparecen en recuadros verdes.</li>
          <li><b>Antecedentes</b> (no incidencias abiertas) aparecen en recuadros violeta.</li>
          <li>Prioridad en pendientes: ${T.alta} ${T.media} ${T.admin}</li>
          <li>Todos los links abren en una pestaña nueva.</li>
        </ul>
      </section>
      <div class="foot">WASABI · Uso interno</div>
    </div>
  </div>`;
}

function renderBrand(b){
  const idx = b.sections.map((s,i)=>`<a href="#${b.id}/${s.id}" data-s="${s.id}">${i+1}. ${s.title}</a>`).join('');
  const secs = b.sections.map((s,i)=>`<section id="s-${b.id}-${s.id}"><h2><span class="n">${i+1}</span>${s.title}</h2>${s.blocks.map(block).join('')}</section>`).join('');
  return `
  <div class="panel" id="p-${b.id}">
    <div class="hero"><div class="eyebrow">Wasabi / Paid Media · Documento de continuidad</div>
      <h1>${b.name} | Traspaso de Paid Media</h1><p>${[b.tagline,b.alert].filter(Boolean).join('. ')}</p>
      <div class="meta"><span class="chip">Información al ${b.asof}</span>${b.chips.map(c=>`<span class="chip o">${c}</span>`).join('')}</div>
    </div>
    <div class="grid">
      <nav class="index"><h4>En esta marca</h4>${idx}</nav>
      <div class="content">${secs}<div class="foot">WASABI · Uso interno</div></div>
    </div>
  </div>`;
}

$('#tabs').innerHTML = `<button class="tab" data-id="inicio">Inicio</button>` + BRANDS.map(b=>`<button class="tab" data-id="${b.id}">${b.name}</button>`).join('');
$('#app').innerHTML = renderHome() + BRANDS.map(renderBrand).join('');
$$('.content a').forEach(a=>{ if(/^https?:/.test(a.getAttribute('href')||'')){ a.target='_blank'; a.rel='noopener'; } });

/* ---------- Navegación ---------- */
let spy=null;
function show(id, sec){
  if(!$('#p-'+id)) id='inicio';
  $$('.panel').forEach(p=>p.classList.toggle('on',p.id==='p-'+id));
  $$('.tab').forEach(t=>t.classList.toggle('on',t.dataset.id===id));
  const b = BRANDS.find(x=>x.id===id);
  document.title = (b?b.name+' · ':'')+'Traspaso Paid Media · Wasabi';
  if(spy) spy.disconnect();
  if(b){
    const links=$$('#p-'+id+' .index a');
    spy=new IntersectionObserver(es=>{
      es.forEach(e=>{ if(e.isIntersecting){ const s=e.target.id.replace('s-'+id+'-',''); links.forEach(a=>a.classList.toggle('on',a.dataset.s===s)); }});
    },{rootMargin:'-140px 0px -65% 0px'});
    $$('#p-'+id+' .content section').forEach(s=>spy.observe(s));
  }
  if(sec){
    const el=$('#s-'+id+'-'+sec);
    if(el){ setTimeout(()=>{el.scrollIntoView({behavior:'smooth',block:'start'});el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1800)},40); return; }
  }
  window.scrollTo({top:0});
}
function route(){
  const [id,sec]=(location.hash.replace('#','')||'inicio').split('/');
  show(id,sec);
}
window.addEventListener('hashchange',route);
$('#tabs').addEventListener('click',e=>{const t=e.target.closest('.tab'); if(t) location.hash=t.dataset.id;});
route();

/* ---------- Buscador ---------- */
const INDEX=[];
BRANDS.forEach(b=>b.sections.forEach(s=>{
  const el=$('#s-'+b.id+'-'+s.id);
  INDEX.push({brand:b,sec:s,text:el.innerText.replace(/\s+/g,' ').trim()});
}));
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const q=$('#q'), box=$('#results');
q.addEventListener('input',()=>{
  const v=q.value.trim();
  if(v.length<2){box.classList.remove('on');return}
  const nv=norm(v); const out=[];
  INDEX.forEach(i=>{
    const nt=norm(i.text); let p=nt.indexOf(nv); if(p<0) return;
    const a=Math.max(0,p-50), z=Math.min(i.text.length,p+v.length+90);
    const snip=(a>0?'…':'')+i.text.slice(a,p)+'<mark>'+i.text.slice(p,p+v.length)+'</mark>'+i.text.slice(p+v.length,z)+(z<i.text.length?'…':'');
    out.push(`<a class="res" href="#${i.brand.id}/${i.sec.id}"><small>${i.brand.name} · ${i.sec.title}</small><span>${snip}</span></a>`);
  });
  box.innerHTML = out.length? out.join('') : `<div class="nores">Sin resultados para «${v.replace(/</g,'&lt;')}».</div>`;
  box.classList.add('on');
});
box.addEventListener('click',()=>{box.classList.remove('on')});
document.addEventListener('click',e=>{if(!e.target.closest('.search')) box.classList.remove('on')});
q.addEventListener('keydown',e=>{if(e.key==='Escape'){box.classList.remove('on');q.blur()}});
</script>
</body>
</html>
