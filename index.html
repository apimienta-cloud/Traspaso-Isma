 },
 "sections": [
  {
   "id": "lectura-inicial",
   "title": "Lectura inicial",
   "blocks": [
    {
     "t": "raw",
     "h": "<p>Este documento concentra el conocimiento de la cuenta para quien asuma Paid Media en WASABI. No sustituye el Plan de Medios aprobado ni la Planilla de Activaciones: ambos deben consultarse para decidir la inversión y la configuración vigente.<\/p>"
    }
   ]
  },
  {
   "id": "la-cuenta-en-un-minuto",
   "title": "La cuenta en un minuto",
   "blocks": [
    {
     "t": "raw",
     "h": "<div class=\"tw\"><table class=\"left\"><thead><tr><th>Eje<\/th><th>Lo fundamental para operar<\/th><\/tr><\/thead><tbody><tr><td>Marca<\/td><td>Ramona: restaurantes y panaderías con propuesta 100% libre de gluten; claim \"Comida del bien\".<\/td><\/tr><tr><td>Instagram oficial<\/td><td>@ramona_uruguay. Perfil unificado a partir de @lapanaderiaderamona; se comunicó el cambio desde @caferamona.<\/td><\/tr><tr><td>Pauta de lanzamiento<\/td><td>Meta: Alcance AO, Alcance promocionado, Tráfico a Linktree y Tráfico al perfil. TikTok: Alcance.<\/td><\/tr><tr><td>Período extraordinario<\/td><td>Planificación conjunta de septiembre y octubre: 17/09 al 31/10/2026. No tratar septiembre como un mes entero.<\/td><\/tr><tr><td>Presupuestos<\/td><td>Variables mes a mes según períodos altos y bajos. Revisar SIEMPRE el Plan de Medios antes de activar, duplicar o renovar.<\/td><\/tr><tr><td>Cambio de noviembre<\/td><td>NUEVA CUENTA META ALEPH CREADA (ID 1874975983496318); cambio operativo previsto para noviembre. No consta que las campañas, dataset y facturación ya se encuentren migrados o activos.<\/td><\/tr><tr><td>Medición<\/td><td>Meta Pixel/dataset 1826567935208840; GTM-NMKK2FQ3 para Tableo. No consta confirmación final del evento Schedule publicado y probado.<\/td><\/tr><\/tbody><\/table><\/div><p>PRIORIDADES DE TRASPASO | 1) PDM mensual 2) Instagram y seguidores 3) Aleph 4) medición Tableo<\/p>"
    }
   ]
  },
  {
   "id": "contexto-de-marca-y-enfoque-de-pauta",
   "title": "Contexto de marca y enfoque de pauta",
   "blocks": [
    {
     "t": "raw",
     "h": "<p>Ramona combina gastronomía y panadería 100% gluten free. El nuevo posicionamiento \"Comida del bien\" busca demostrar que una propuesta sin gluten también puede ser atractiva por sabor, variedad, ocasión de consumo y personalidad de marca. La comunicación abarca Centro, Pocitos/WTC y Carrasco, con particularidades por local que deben validarse en el cronograma vigente.<\/p><p>La pauta del lanzamiento no persiguió un único KPI: buscó instalar la nueva identidad, trasladar la atención al perfil oficial, hacer crecer la comunidad y derivar interés hacia destinos comerciales (Linktree, reservas y pedidos). Cada campaña debe evaluarse en función de ese propósito, no por una métrica única.<\/p><h3>Objetivos y públicos<\/h3><ul><li>Branding: alcance y frecuencia para dar a conocer la nueva identidad, los productos y los locales.<\/li><li>Comunidad: visitas al Instagram @ramona_uruguay y generación de nuevos seguidores reales.<\/li><li>Consideración/tráfico: derivar personas hacia Linktree y, desde allí, a reservas, información de locales y PedidosYa.<\/li><li>TikTok: reforzar cobertura y recordación en audiencias jóvenes mediante contenidos nativos y producto.<\/li><\/ul><p>El Manual de Contenidos propone perfiles vinculados a personas celíacas o que eligen sin gluten, trabajadores de la zona, parejas, amigos, familias y reuniones. Son referencias para contenidos; las audiencias publicitarias activas se verifican en el Administrador de Anuncios. En el manual se indica replicar contenidos en Facebook, pero reservar la pauta de Meta a Instagram: confirmar ubicaciones reales al reconstruir campañas.<\/p>"
    }
   ]
  },
  {
   "id": "unificacion-de-instagram-y-migracion-de-",
   "title": "Unificación de Instagram y migración de seguidores",
   "blocks": [
    {
     "t": "raw",
     "h": "<h3>Qué ocurrió<\/h3><p>Por problemas con la cuenta original @caferamona, se optó por transformar la cuenta @lapanaderiaderamona: cambio de estética, nombre y descripción para consolidar la comunicación en @ramona_uruguay. En paralelo se hicieron publicaciones y cambios en la biografía de la cuenta original para orientar usuarios hacia el perfil unificado. Desde el 17 de septiembre se sumaron campañas pagas, incluida Tráfico al perfil, para apoyar ese traslado de atención.<\/p><p>ATENCIÓN: no existe evidencia de un traslado técnico automático de seguidores desde una cuenta de Instagram a otra. Los seguidores que ya tenía la cuenta reutilizada permanecen en ella; quienes seguían la cuenta original deben decidir seguir el perfil nuevo. Esta diferencia debe quedar clara al explicar la \"migración\".<\/p><h3>Evolución documentada, sin atribución indebida<\/h3><div class=\"tw\"><table class=\"\"><thead><tr><th>Indicador<\/th><th>Dato<\/th><th>Cómo interpretarlo<\/th><\/tr><\/thead><tbody><tr><td>Base previa informada<\/td><td>17.900 seguidores<\/td><td>Cifra previa al cambio visual y a la pauta, indicada en el reporte.<\/td><\/tr><tr><td>Cierre de septiembre<\/td><td>21.091 seguidores<\/td><td>Tamaño total del perfil al cierre reportado.<\/td><\/tr><tr><td>Aumento reportado<\/td><td>1.298 seguidores<\/td><td>Métrica de crecimiento informada para septiembre en el contexto de pauta y migración.<\/td><\/tr><tr><td>Anuncios destacados<\/td><td>Renovamos: 395; Take Away: 281; Pantone: 14<\/td><td>Resultados comunicados para piezas concretas de captación; no sumarlos como si explicaran todo el crecimiento.<\/td><\/tr><\/tbody><\/table><\/div><p>La diferencia aritmética entre 17.900 y 21.091 es 3.191. NO debe etiquetarse automáticamente como \"seguidores migrados\" ni como \"seguidores generados por anuncios\": la base, el cierre y los 1.298 provienen de lecturas o ventanas que deben conciliarse antes de reportar atribución.<\/p><h3>Acciones de continuidad de Instagram<\/h3><ul><li>Mantener @ramona_uruguay como destino prioritario; confirmar que biografías, enlaces, destacadas y perfiles anteriores conduzcan correctamente allí.<\/li><li>Comprobar el acceso a Instagram y su vinculación con página de Facebook, Business Portfolio y cuenta publicitaria antes de la migración a Aleph.<\/li><li>No desactivar la comunicación de redirección en @caferamona sin confirmar que ya no sea necesaria para explicar el cambio a su audiencia.<\/li><li>Medir separadamente seguidores netos del perfil, seguidores atribuibles a anuncios cuando existan datos y visitas al perfil; no mezclar \"clics\" con \"seguidores\".<\/li><\/ul>"
    }
   ]
  },
  {
   "id": "plan-de-medios-control-mensual-obligator",
   "title": "Plan de Medios: control mensual obligatorio",
   "blocks": [
    {
     "t": "raw",
     "h": "<p>Ramona NO tiene una inversión plana para repetir todos los meses. El Plan de Medios contempla subidas y bajadas de presupuesto según meses de mayor y menor actividad comercial, acciones especiales y objetivos de cada etapa. La campaña de lanzamiento septiembre/octubre fue una excepción con presupuesto y calendario compartidos entre ambos meses.<\/p><p>REGLA OPERATIVA | Antes de empezar cada mes, leer la versión aprobada del Plan de Medios, no copiar el presupuesto anterior.<\/p><h3>Secuencia de control para cada nuevo mes<\/h3><ul><li>Abrir el Plan de Medios aprobado y reconocer si el mes es de inversión alta, baja o extraordinaria. Confirmar los montos mensuales y las plataformas.<\/li><li>Comparar el presupuesto previsto con la Planilla de Activaciones: campañas, fechas, piezas, importes y posibles extras o reasignaciones.<\/li><li>Verificar cómo cambia la prioridad del período: Alcance/branding, crecimiento del perfil, tráfico comercial, lanzamientos o promociones.<\/li><li>Revisar el gasto acumulado por campaña y plataforma, en especial cuando coexisten distintas campañas y el presupuesto es compartido entre meses.<\/li><li>Antes de aumentar o bajar presupuestos, chequear aprobación, fecha de implementación y efecto sobre el pacing; registrar en la bitácora si corresponde.<\/li><li>Al cerrar el mes, contrastar lo ejecutado con el PDM y documentar cualquier desviación aprobada para no trasladarla por error al mes siguiente.<\/li><\/ul><p>Para noviembre se definió reducir el alcance extraordinariamente amplio del lanzamiento y concentrar el mensaje en un público más alineado con el objetivo de Ramona. El monto exacto de noviembre y el cuadro completo de temporada alta/baja deben verificarse en el PDM aprobado: no se incorporan cifras mensuales no confirmadas.<\/p>"
    }
   ]
  },
  {
   "id": "arquitectura-de-campanas-y-resultados-do",
   "title": "Arquitectura de campañas y resultados documentados",
   "blocks": [
    {
     "t": "raw",
     "h": "<h3>Meta Ads | septiembre 2026, primer tramo del lanzamiento<\/h3><p>Las cuatro campañas siguientes integran una estrategia de objetivos complementarios. Son resultados del 17 al 30 de septiembre, dentro de la planificación 17/09-31/10; no equivalen al presupuesto aprobado para cada mes.<\/p><div class=\"tw\"><table class=\"\"><thead><tr><th>Campaña / objetivo<\/th><th>Inversión USD<\/th><th>Resultado<\/th><th>Función<\/th><\/tr><\/thead><tbody><tr><td>Alcance Always On<\/td><td>424,87<\/td><td>479.538 de alcance<\/td><td>Visibilidad sostenida<\/td><\/tr><tr><td>Alcance promocionado<\/td><td>186,25<\/td><td>153.099 de alcance<\/td><td>Reforzar piezas puntuales<\/td><\/tr><tr><td>Tráfico a Linktree<\/td><td>313,18<\/td><td>5.081 visitas al destino<\/td><td>Interés por productos, pedidos y reservas<\/td><\/tr><tr><td>Tráfico al perfil<\/td><td>244,24<\/td><td>80.828 de alcance; crecimiento del perfil<\/td><td>Apoyar la transición a @ramona_uruguay<\/td><\/tr><tr class=\"total\"><td>TOTAL META<\/td><td>1.168,54<\/td><td>589.214 alcance combinado; frecuencia 4,06<\/td><td>Indicadores globales: no sumar alcances de campañas<\/td><\/tr><\/tbody><\/table><\/div><p>El destino Linktree registró un costo promedio cercano a USD 0,06 por visita. Es una acción de tráfico, no una venta ni una reserva confirmada. El reporte alterna etiquetas heredadas como \"visitas a Tableo\" en algunos gráficos: comprobar el destino y los filtros reales antes de interpretar esa métrica como reserva.<\/p><h3>TikTok Ads | septiembre 2026<\/h3><div class=\"tw\"><table class=\"\"><thead><tr><th>Indicador<\/th><th>Resultado<\/th><th>Observación<\/th><\/tr><\/thead><tbody><tr><td>Inversión<\/td><td>USD 432,82<\/td><td>Primer tramo del plan conjunto septiembre/octubre.<\/td><\/tr><tr><td>Impresiones<\/td><td>1.651.155<\/td><td>Difusión del lanzamiento.<\/td><\/tr><tr><td>Alcance<\/td><td>487.126<\/td><td>Cobertura única reportada.<\/td><\/tr><tr><td>Frecuencia<\/td><td>3,39<\/td><td>Meta de referencia de la propuesta: 4 impactos.<\/td><\/tr><tr><td>Clics al destino<\/td><td>3.083<\/td><td>No confundir clics con reservas ni pedidos.<\/td><\/tr><\/tbody><\/table><\/div><p>Las referencias de planificación eran cubrir el 60% del público objetivo con una frecuencia de 7 en Meta (reporte asociado a 320.000 personas), y una frecuencia de 4 en TikTok (reporte asociado a 560.000 personas). Verificar denominadores de audiencias y alcance esperado en la versión vigente del PDM antes de reutilizar estas metas.<\/p><h3>Lectura de resultados<\/h3><p>Durante el arranque se priorizó instalar una marca renovada; el alcance fue mayor que el previsto. El ajuste planeado para noviembre apunta a mejorar concentración y repetición, no a interpretar el lanzamiento como fracaso por frecuencia. Las visitas a Linktree y los seguidores obtenidos son indicadores de consideración/comunidad distintos de visitas efectivas a locales, pedidos o reservas.<\/p>"
    }
   ]
  },
  {
   "id": "creatividades-y-aprendizajes-utiles",
   "title": "Creatividades y aprendizajes útiles",
   "blocks": [
    {
     "t": "raw",
     "h": "<h3>Anuncios y temas que funcionaron<\/h3><ul><li>Meta Alcance: \"Amor a primer bocado\" alcanzó 364.473 personas en el ranking del reporte, instalando la identidad visual renovada. \"Take Away\" y el contenido \"Grid\" también aportaron cobertura.<\/li><li>Tráfico al perfil: \"Renovamos\" y \"Take Away\" aportaron seguidores medidos; combinan explicación del nuevo perfil con ocasiones de consumo.<\/li><li>Tráfico a Linktree: panadería sin gluten/bizcochos y \"Nueva carta\" impulsaron visitas. El contenido de carta se informó pausado el 26/09; no considerarlo vigente sin revisar.<\/li><li>TikTok: \"Renovamos\", \"Sándwich\" y \"Grid\" destacaron por combinar identidad, producto y personas.<\/li><\/ul><h3>Guía de contenido vinculada a Paid<\/h3><p>El manual de Ramona propone tono cercano, cálido y fresco, voseo natural, humor cotidiano y uso moderado de emojis. Contenido: institucional 20%, efemérides 5%, producto/restaurante/panadería 40%, eventos 10%, descuentos 20% e influencers 5%. Es una guía editorial, no la distribución obligatoria del presupuesto publicitario.<\/p><p>Entre los temas comerciales de octubre estuvieron la nueva carta, desayunos y cenas, renovación del local WTC, delivery y promociones de PedidosYa. La campaña creativa \"Culpables de todo. Libres de gluten\" fue un concepto explorado y postergado; no debe registrarse como pauta efectivamente ejecutada. La promoción de panadería en PedidosYa y otras acciones planteadas deben cotejarse con el cronograma y las activaciones antes de darlas por circuladas.<\/p>"
    }
   ]
  },
  {
   "id": "destinos-reservas-y-medicion",
   "title": "Destinos, reservas y medición",
   "blocks": [
    {
     "t": "raw",
     "h": "<h3>El recorrido comercial no es una única conversión<\/h3><div class=\"tw\"><table class=\"\"><thead><tr><th>Punto del recorrido<\/th><th>Qué mide la pauta<\/th><th>Qué NO permite concluir<\/th><\/tr><\/thead><tbody><tr><td>Alcance<\/td><td>Usuarios expuestos e impactos<\/td><td>No equivale a visitas al local ni reservas.<\/td><\/tr><tr><td>Tráfico al perfil<\/td><td>Visitas/clics hacia Instagram y, si está disponible, seguidores atribuibles<\/td><td>No todos los clics generan seguidores.<\/td><\/tr><tr><td>Tráfico a Linktree<\/td><td>Accesos al concentrador de enlaces<\/td><td>No permite inferir directamente pedidos o reservas.<\/td><\/tr><tr><td>Tableo<\/td><td>Interacción o reserva, según evento configurado y validado<\/td><td>Sin confirmación de Schedule, no hablar de reservas atribuidas a Meta.<\/td><\/tr><tr><td>PedidosYa<\/td><td>Interés o clics al destino comercial<\/td><td>La atribución de pedidos requiere datos adicionales.<\/td><\/tr><\/tbody><\/table><\/div><h3>Activos y estado de implementación<\/h3><div class=\"tw\"><table class=\"left\"><thead><tr><th>Activo<\/th><th>Referencia<\/th><th>Estado / control<\/th><\/tr><\/thead><tbody><tr><td>Píxel / dataset Meta<\/td><td>1826567935208840<\/td><td>Activo identificado en conversaciones de configuración. Verificar propietario y permisos de socio.<\/td><\/tr><tr><td>Google Tag Manager<\/td><td>GTM-NMKK2FQ3<\/td><td>Contenedor creado para seguimiento en Tableo de Centro y WTC. Publicación y validación final pendientes de confirmar.<\/td><\/tr><tr><td>Tableo: Centro y WTC<\/td><td>Flujo de reservas<\/td><td>El objetivo era medir PageView y evento Schedule de reserva confirmada. No consta prueba de extremo a extremo completada.<\/td><\/tr><tr><td>Linktree<\/td><td>Destino comercial Meta<\/td><td>Revisar que contenga opciones vigentes de reservas, locales y pedidos antes de pautar.<\/td><\/tr><\/tbody><\/table><\/div><p>Criterio técnico: no copiar a Ramona pruebas, URLs, rutas ni deduplicación de Tableo de Los Leños. Validar el recorrido de Ramona con reservas de prueba autorizadas, comprobar un único Schedule por reserva confirmada y que los eventos lleguen al dataset correcto. Hasta entonces, el resultado validado del lanzamiento es tráfico, no reservas atribuibles.<\/p>"
    }
   ]
  },
  {
   "id": "noviembre-2026-migracion-publicitaria-a-",
   "title": "Noviembre 2026 | migración publicitaria a Aleph",
   "blocks": [
    {
     "t": "raw",
     "h": "<p>NUEVA CUENTA META DISPONIBLE / MIGRACIÓN DE PAUTA AÚN POR VALIDAR | La cuenta Meta bajo Aleph ya fue compartida; no confundir su creación con campañas migradas y activas.<\/p><p>ACTUALIZACIÓN 28/10: la nueva cuenta publicitaria de Meta de Ramona bajo el Business Portfolio de Aleph ya está creada y se dispone de su enlace de acceso. ID de cuenta: 1874975983496318; Business Portfolio: 4439100643027772. La operación está prevista para noviembre. El alta de la cuenta no confirma permisos de todos los usuarios, facturación, conexión del dataset ni publicación de campañas. TikTok bajo Aleph sigue sin enlace confirmado. Mantener las cuentas históricas hasta verificar correctamente el corte de inversión.<\/p><h3>Procedimiento de continuidad: antes de activar la nueva cuenta<\/h3><ul><li>Revisar accesos a la cuenta Meta Aleph ya identificada (ID 1874975983496318), sus permisos y titularidad, métodos de pago, permisos sobre activos y fecha de corte. Confirmar por separado si TikTok también migrará; su nueva cuenta no se proporcionó en esta actualización.<\/li><li>Confirmar permisos de WASABI y acceso a página de Facebook, perfil @ramona_uruguay, catálogos si aplican, audiencias permitidas y destinos de conversión.<\/li><li>Conservar el píxel/dataset Meta existente cuando su propiedad y las políticas de acceso lo permitan: compartir el activo con Aleph como socio y asignarlo a la nueva cuenta. NO crear de entrada un píxel nuevo sin evaluar el impacto sobre los eventos históricos.<\/li><li>Revisar GTM-NMKK2FQ3, el flujo Tableo y los eventos PageView / Schedule antes de vincular objetivos de optimización en la nueva cuenta; no dar Schedule por publicado sin prueba.<\/li><li>Replicar estructura aprobada, anuncios, destinos, nomenclaturas, exclusiones y calendario del PDM del mes de migración. El historial y aprendizaje de campañas de la cuenta anterior no se transfieren automáticamente.<\/li><li>Establecer fecha de corte y verificar que no queden presupuestos paralelos en las cuentas vieja y nueva. No pausar la anterior hasta confirmar que la nueva entrega correctamente y con el destino adecuado.<\/li><li>Actualizar Planilla de Activaciones, accesos a Ads Manager, fuentes en Looker/Supermetrics y la documentación del nuevo responsable. Conservar registros del histórico previo a Aleph para comparar períodos sin mezclar cuentas.<\/li><\/ul><h3>Matriz de control de la migración<\/h3><div class=\"tw\"><table class=\"left\"><thead><tr><th>Tema<\/th><th>Situación actualizada al 28/10<\/th><th>Responsable / siguiente verificación<\/th><\/tr><\/thead><tbody><tr><td>Nuevas cuentas Aleph<\/td><td>Cuenta Meta Aleph creada y enlace recibido. ID 1874975983496318 / Business 4439100643027772.<\/td><td>Comprobar acceso, permisos, enlace de Instagram, activos, facturación y fecha de corte. TikTok Aleph no confirmado.<\/td><\/tr><tr><td>Accesos y facturación<\/td><td>Existe cuenta Meta nueva; aún sin validación documentada de métodos de pago ni activación de campañas.<\/td><td>Verificar permisos, portfolio y línea de crédito.<\/td><\/tr><tr><td>Dataset existente<\/td><td>ID 1826567935208840 identificado<\/td><td>Validar propiedad y acceso compartido con Aleph.<\/td><\/tr><tr><td>Eventos Tableo<\/td><td>GTM creado; Schedule no validado final<\/td><td>Probar eventos antes de optimizar por reservas.<\/td><\/tr><tr><td>Pauta en cuenta nueva<\/td><td>Sin evidencia de activación<\/td><td>Definir fecha de corte, presupuestos y verificación posactivación.<\/td><\/tr><\/tbody><\/table><\/div>"
    }
   ]
  },
  {
   "id": "operativa-especifica-arco-sin-repetir-la",
   "title": "Operativa específica: ARCO sin repetir la capacitación",
   "blocks": [
    {
     "t": "raw",
     "h": "<h3>Activaciones<\/h3><p>Planilla de Activaciones = referencia para saber qué está aprobado y circulando. Los cuatro objetivos de Meta y la campaña de TikTok pueden convivir; controlar importe, fecha de fin, destino y formato de cada pieza. El período 17/09-31/10 fue extraordinario y debe cerrarse correctamente antes de configurar noviembre en Aleph.<\/p><h3>Reportes<\/h3><p>Looker Studio contiene el cierre de medios; contrastar período del filtro con el calendario real de activación. Separar Meta Alcance, Alcance promocionado, Perfil y Linktree, más TikTok. Reportar nuevos seguidores sin atribuir todo el crecimiento a pauta. En noviembre abrir serie o comparativa por cuenta publicitaria para no romper el histórico al migrar a Aleph.<\/p><h3>Chequeos<\/h3><p>Revisar entrega y gasto contra el PDM vigente, campañas activas vs planilla, aprobación de nuevos destinos, disponibilidad de Linktree/Instagram y recepción de eventos del pixel/GTM. En meses de múltiples campañas o promociones, cuidar no superar el total aprobado.<\/p><h3>Optimizaciones<\/h3><p>Tomar decisiones según el objetivo: volumen y frecuencia en Alcance; crecimiento real del perfil en Tráfico al perfil; visitas efectivas al destino en Linktree; clics/engagement de audiencia en TikTok. No inferir reservas desde tráfico. Dejar fecha y motivo de cada cambio, especialmente ajustes por mes alto/bajo y cambios de cuenta Aleph.<\/p>"
    }
   ]
  },
  {
   "id": "historial-de-decisiones-y-situacion-real",
   "title": "Historial de decisiones y situación real",
   "blocks": [
    {
     "t": "raw",
     "h": "<div class=\"tw\"><table class=\"left\"><thead><tr><th>Fecha / período<\/th><th>Hecho o criterio<\/th><th>Estado<\/th><\/tr><\/thead><tbody><tr><td>Septiembre 2026<\/td><td>Se transformó @lapanaderiaderamona y se unificó la marca en @ramona_uruguay; la cuenta antigua @caferamona comunicó el cambio.<\/td><td><span class=\"tag ok\">Implementado<\/span><\/td><\/tr><tr><td>17/09 a 31/10<\/td><td>Plan de pauta conjunto de dos meses y múltiples campañas Meta + TikTok.<\/td><td>Implementado, cierre de octubre por consolidar<\/td><\/tr><tr><td>Septiembre<\/td><td>Alcance de lanzamiento excedió la concentración prevista; noviembre buscará ajustar cobertura y frecuencia.<\/td><td>Decisión estratégica para implementar<\/td><\/tr><tr><td>Octubre<\/td><td>Plan de comunicación de nueva carta, locales, delivery, WTC y productos.<\/td><td>Contenidos, no todos necesariamente activados en pauta<\/td><\/tr><tr><td>Octubre<\/td><td>GTM-NMKK2FQ3 asociado a trabajo de Tableo y dataset Meta identificado.<\/td><td>Configuración iniciada; validar publicación/eventos<\/td><\/tr><tr><td>Noviembre<\/td><td>Migración de publicidad a nuevas cuentas bajo Aleph.<\/td><td>Cuenta Meta Aleph creada (28/10); migración de campañas e inicio de inversión no confirmados.<\/td><\/tr><tr><td>Sin fecha de pauta confirmada<\/td><td>Concepto creativo \"Culpables de todo. Libres de gluten\".<\/td><td>Idea creativa postergada<\/td><\/tr><\/tbody><\/table><\/div>"

  {
   "id": "recursos-y-accesos-de-la-cuenta",
   "title": "Recursos y accesos de la cuenta",
   "blocks": [
    {
     "t": "raw",
     "h": "<p>Los enlaces históricos proceden de los marcadores WASABI; el enlace a la NUEVA cuenta Meta Aleph fue compartido el 28/10/2026. Comprobar permisos y activación real antes de operar. Se conservan ambas cuentas para acceder al histórico.<\/p><div class=\"links\"><a class=\"lk\" href=\"https://www.instagram.com/ramona_uruguay/\" target=\"_blank\" rel=\"noopener\"><b>Instagram oficial<i>↗<\/i><\/b><span>Perfil unificado de marca<\/span><em>instagram.com<\/em><\/a><a class=\"lk\" href=\"https://adsmanager.facebook.com/adsmanager/manage/campaigns?global_scope_id=4439100643027772&business_id=4439100643027772&act=1651303396591079&nav_entry_point=am_global_scope_selector&redirect_session_id=a6e06880-1f22-4770-877f-4ff9699b79cd\" target=\"_blank\" rel=\"noopener\"><b>Meta Ads<i>↗<\/i><\/b><span>Cuenta publicitaria histórica. Identificador 1651303396591079; cambiará al migrar a Aleph<\/span><em>adsmanager.facebook.com<\/em><\/a><a class=\"lk\" href=\"https://adsmanager.facebook.com/adsmanager/manage/campaigns?business_id=4439100643027772&global_scope_id=4439100643027772&act=1874975983496318\" target=\"_blank\" rel=\"noopener\"><b>Abrir cuenta nueva Aleph<i>↗<\/i><\/b><em>adsmanager.facebook.com<\/em><\/a><a class=\"lk\" href=\"https://docs.google.com/spreadsheets/d/1dRpW_vjrvZwUyZhcSHTxLK37VmtLhjWnjqsbzwZZ3e4/edit?gid=1632612359#gid=1632612359\" target=\"_blank\" rel=\"noopener\"><b>Planilla de Activaciones<i>↗<\/i><\/b><span>Referencia de campañas, anuncios, fechas y presupuestos<\/span><em>docs.google.com<\/em><\/a><a class=\"lk\" href=\"https://ads.tiktok.com/i18n/manage/campaign?aadvid=7686491327263047687&navigate_from=dashboard&st=2026-09-10&et=2026-09-17\" target=\"_blank\" rel=\"noopener\"><b>TikTok Ads<i>↗<\/i><\/b><span>Cuenta histórica de TikTok: comprobar fecha del filtro al abrir<\/span><em>ads.tiktok.com<\/em><\/a><a class=\"lk\" href=\"https://datastudio.google.com/u/0/reporting/e966dd67-af87-49c2-98ed-3eb686cd2f21/page/p_qhl9y9j2pd\" target=\"_blank\" rel=\"noopener\"><b>Looker Studio<i>↗<\/i><\/b><span>Reporte de resultados de la marca<\/span><em>datastudio.google.com<\/em><\/a><a class=\"lk\" href=\"https://wasabimd-my.sharepoint.com/shared?id=%2Fpersonal%2Fwasabinos%5Fwasabi%5Fcom%5Fuy%2FDocuments%2FWasabi%20Digital%2FEQUIPO%20PUTAPARI%C3%93%2FRAMONA&listurl=%2Fpersonal%2Fwasabinos%5Fwasabi%5Fcom%5Fuy%2FDocuments&viewid=b855fcfb%2D0a16%2D45e2%2Db04a%2D364614209379\" target=\"_blank\" rel=\"noopener\"><b>Carpeta Ramona<i>↗<\/i><\/b><span>Archivos y recursos internos de Ramona<\/span><em>wasabimd-my.sharepoint.com<\/em><\/a><\/div><p>Material complementario en carpeta de marca: Ramona-Reporte-de-resultados-09-2026.pdf; Cronograma-Ramona-09-2026.pdf; Manual-de-Contenidos-Ramona-09-2026.pptx; manual de identidad. Confirmar que el PDM aprobado más reciente esté en la carpeta para revisar la distribución exacta de meses altos y bajos.<\/p>"
    }

  {
   "id": "hitos-y-verificaciones-de-continuidad",
   "title": "Hitos y verificaciones de continuidad",
   "blocks": [
    {
     "t": "raw",
     "h": "<h3>Cierre octubre 2026<\/h3><ul><li>Cerrar la inversión conjunta septiembre/octubre con presupuesto total real y cualquier redistribución aprobada; reportar ambos meses sin duplicar totales.<\/li><li>Verificar en la Planilla de Activaciones que las campañas de lanzamiento hayan finalizado o quedado correctamente pausadas/reconfiguradas al 31/10.<\/li><li>Confirmar que los perfiles viejos sigan orientando a @ramona_uruguay mientras sean útiles y que los enlaces comerciales estén vigentes.<\/li><\/ul><h3>Noviembre 2026<\/h3><ul><li>Releer PDM: es un mes distinto del lanzamiento; revisar presupuesto aprobado y menor amplitud de cobertura antes de configurar audiencias.<\/li><li>Activar o migrar efectivamente las campañas en Aleph solo tras validar activos, fechas de corte, método de pago, eventos y presupuestos. La nueva cuenta Meta ya existe, pero no se confirmó todavía ejecución de anuncios allí.<\/li><li>Revisar reportes y fuentes de datos para separar períodos antes/después de Aleph.<\/li><\/ul><h3>Control a resolver antes de declarar terminado el traspaso<\/h3><div class=\"tw\"><table class=\"left\"><thead><tr><th>Verificación<\/th><th>Referencia para resolver<\/th><\/tr><\/thead><tbody><tr><td>Importes por mes alto/bajo y presupuesto aprobado de noviembre<\/td><td>PDM Ramona aprobado + planilla de activaciones vigente.<\/td><\/tr><tr><td>Fecha de corte y estado operativo de la cuenta Meta Aleph ID 1874975983496318; TikTok por confirmar<\/td><td>Acceso a la nueva cuenta ya disponible. Validar permisos, activos, dataset, medios de pago, duplicaciones y comienzo real de pauta.<\/td><\/tr><tr><td>Permisos de Instagram, Facebook, Meta dataset y potenciales cuentas TikTok<\/td><td>Configuración de activos y socios de la empresa.<\/td><\/tr><tr><td>Validación del evento Schedule en Tableo de Centro y WTC<\/td><td>GTM Preview, eventos de Meta, reserva de prueba autorizada.<\/td><\/tr><tr><td>Reconciliación de seguidores del perfil y métricas de campaña<\/td><td>Instagram Insights, Meta Ads y cierre septiembre/octubre.<\/td><\/tr><tr><td>Responsable definitivo de Paid Media<\/td><td>Asignación interna WASABI; puede variar entre personas del equipo.<\/td><\/tr><\/tbody><\/table><\/div>"

 "sections": [
  {
   "id": "lectura-inicial",
   "title": "Lectura inicial",
   "blocks": [
    {
     "t": "raw",
     "h": "<div class=\"call\"><b class=\"t\">Lectura prioritaria<\/b><p>SYLAB es una cuenta exclusivamente de branding en Meta Ads y TikTok Ads. Actualmente no tiene e-commerce ni campañas de ventas online: Alcance, Alcance Promocionado, Tráfico al perfil e Interacción se trabajan para visibilidad, recordación y crecimiento de comunidad. La inversión NO es fija: el PDM varía por mes, por ajustes contractuales, campañas puntuales y decisiones de distribución. No reutilizar presupuestos de un mes sin revisar el plan aprobado y la Planilla de Activaciones.<\/p><\/div>"
    }
   ]
  },
  {
   "id": "la-cuenta-en-un-minuto",
   "title": "La cuenta en un minuto",
   "blocks": [
    {
     "t": "raw",
     "h": "<div class=\"tw\"><table class=\"left\"><thead><tr><th>Dimensión<\/th><th>Situación de la marca y la operación<\/th><\/tr><\/thead><tbody><tr><td>Marca<\/td><td>SYLAB: suplementos y nutrición deportiva. Concepto de marca 2026: «Con SYLAB podés».<\/td><\/tr><tr><td>Objetivo principal<\/td><td>Construir reconocimiento y recordación; alcanzar una cobertura amplia con frecuencia suficiente y acompañar el crecimiento de la comunidad. SYLAB actualmente no cuenta con e-commerce: la pauta es exclusivamente de branding, no de ventas ni ROAS.<\/td><\/tr><tr><td>Meta Ads<\/td><td>Always On de Alcance y, desde septiembre, Alcance Promocionado; Tráfico al perfil de Instagram; Interacción en activaciones puntuales.<\/td><\/tr><tr><td>TikTok Ads<\/td><td>Campaña de Alcance con piezas de motivación, producto, recetas y contenido cercano a los códigos de la plataforma.<\/td><\/tr><tr><td>Objetivos de referencia<\/td><td>Meta: 60% del público (500.000 personas) y 7 impactos mensuales. TikTok: 60% (500.000 personas) y 4 impactos mensuales.<\/td><\/tr><tr><td>Diferencial<\/td><td>Buen rendimiento de recetas y creadores para alcance y captación de seguidores; el enfoque de marca conecta suplementación con rutina, constancia y superación.<\/td><\/tr><tr><td>Regla de traspaso<\/td><td>Control mensual obligatorio de PDM variable, fechas, campañas, saldos y campañas extraordinarias; septiembre es el último cierre consolidado localizado.<\/td><\/tr><\/tbody><\/table><\/div>"
    }
   ]
  },
  {
   "id": "contexto-de-marca-y-estrategia-paid-medi",
   "title": "Contexto de marca y estrategia Paid Media",
   "blocks": [
    {
     "t": "raw",
     "h": "<p>SYLAB busca estar presente en la vida cotidiana de quienes entrenan o quieren incorporar hábitos de bienestar. La comunicación de 2026 articula beneficios del producto con escenas reales de entrenamiento, nutrición, motivación y constancia. El claim transversal es «Con SYLAB podés».<\/p><ul><li>Branding de base: utilizar Meta y TikTok para sostener una presencia repetida, no para perseguir clics como única señal de éxito.<\/li><li>Crecimiento de comunidad: Tráfico al perfil se incorporó para transformar interés y contenido relevante en nuevos seguidores; analizar sus resultados en forma separada del objetivo de alcance.<\/li><li>Campañas contextuales: Mundial, lanzamientos de producto, creadores y colaboraciones se suman a la continuidad Always On; distinguir siempre un presupuesto especial de la base habitual.<\/li><li>Productos y territorios creativos documentados: Whey Protein, Creatina Perform+, Mass 3000, Advance, Colágeno Hidrolizado, recetas proteicas, running y entrenamiento.<\/li><\/ul><div class=\"call\"><b class=\"t\">Criterio comercial<\/b><p>No presentar mensajes sobre resultados físicos, composición o propiedades de un suplemento como afirmaciones técnicas nuevas si no están aprobados por la marca. Ante nuevos productos, validar fichas y textos con el cliente.<\/p><\/div>"
    }
   ]
  },
  {
   "id": "arquitectura-de-campanas-y-kpi-correctos",
   "title": "Arquitectura de campañas y KPI correctos",
   "blocks": [
    {
     "t": "raw",
     "h": "<div class=\"tw\"><table class=\"left\"><thead><tr><th>Canal / campaña<\/th><th>Función<\/th><th>Cómo medir / control<\/th><\/tr><\/thead><tbody><tr><td>Meta | Alcance AO<\/td><td>Cobertura masiva, reconocimiento y continuidad de la marca.<\/td><td>Alcance único, impresiones, frecuencia de la campaña, CPM, presupuesto y entrega.<\/td><\/tr><tr><td>Meta | Alcance Promocionado AO<\/td><td>Aumentar repetición de anuncios sobre audiencias acotadas. En septiembre fue parte de la optimización.<\/td><td>Frecuencia del bloque de alcance, saturación, alcance incremental y solapamiento; no sumarlo linealmente como personas únicas.<\/td><\/tr><tr><td>Meta | Tráfico al perfil<\/td><td>Dirigir usuarios a Instagram y convertir interés en crecimiento de comunidad.<\/td><td>Visitas/clics de destino, costo por acción y seguidores efectivamente atribuidos cuando exista esa fuente.<\/td><\/tr><tr><td>Meta | Interacción extra<\/td><td>Promociones, sorteos o acciones coyunturales; en junio se registró pauta extra mundialista.<\/td><td>Inversión separada, fechas y alcance/participación; no mezclar con AO ni asumir ventas.<\/td><\/tr><tr><td>TikTok | Alcance AO<\/td><td>Presencia y recordación mediante contenidos adaptados al comportamiento en TikTok.<\/td><td>Cobertura, frecuencia, impresiones, costo por 1.000 personas alcanzadas, clics secundarios y creatividades.<\/td><\/tr><\/tbody><\/table><\/div><div class=\"call\"><b class=\"t\">Unidad de análisis<\/b><p>En Meta, «Alcance total» y «Frecuencia de Alcance» pueden mostrar universos diferentes por incluir Tráfico u otras campañas. En TikTok, «Costo x alcance» se expresa por 1.000 personas alcanzadas, no como costo por individuo.<\/p><\/div>"
    }
   ]
  },
  {
   "id": "plan-de-medios-variable-control-mensual-",
   "title": "Plan de Medios VARIABLE: control mensual obligatorio",
   "blocks": [
    {
     "t": "raw",
     "h": "<div class=\"call\"><b class=\"t\">Regla crítica de operación<\/b><p>Igual que en Ramona y Los Leños, NO existe una distribución mensual que pueda copiarse automáticamente. Antes de activar, pausar, ampliar o redistribuir: consultar el PDM aprobado del período, la Planilla de Activaciones y los gastos actuales en las cuentas. Ninguna cifra histórica equivale por sí misma al presupuesto del próximo mes.<\/p><\/div><p>El historial demuestra variaciones importantes: junio y julio operaron con reducción contractual del presupuesto Always On; agosto recuperó presupuesto y septiembre aplicó una redistribución orientada a equilibrar cobertura y frecuencia. También hubo inversión específica en Interacción para el sorteo mundialista.<\/p><h3>Inversión ejecutada documentada (USD)<\/h3><div class=\"tw\"><table class=\"\"><thead><tr><th>Mes<\/th><th>Meta<\/th><th>TikTok<\/th><th>Lectura de continuidad<\/th><\/tr><\/thead><tbody><tr><td>Junio 2026<\/td><td>923<\/td><td>450<\/td><td>Meta: Alcance 500, Tráfico 200 e Interacción 223; el extra de Interacción correspondió a la activación mundialista.<\/td><\/tr><tr><td>Julio 2026<\/td><td>874<\/td><td>500<\/td><td>Meta: Alcance 600, Tráfico 200 e Interacción residual 74. Segundo y último mes de reducción contractual informada.<\/td><\/tr><tr><td>Agosto 2026<\/td><td>1.425<\/td><td>600<\/td><td>Meta: Alcance 1.000, Tráfico 200, Interacción 200 y remanente de Interacción anterior 26. Mayor escala de marca.<\/td><\/tr><tr><td>Septiembre 2026<\/td><td>1.399<\/td><td>599,97<\/td><td>Meta: Alcance 700, Alcance Promocionado 399 y Tráfico 300. TikTok mantuvo cerca de 600 con cambio de distribución de exposición.<\/td><\/tr><\/tbody><\/table><\/div><p>Son gastos de reportes mensuales, no montos confirmados de PDM para octubre o noviembre. Las filas publicitarias pueden contener redondeos y movimientos de campañas que atravesaron meses; para consumos y saldos, tomar el gasto de la cuenta publicitaria con el período correcto.<\/p><h3>Secuencia de control antes de comenzar cada mes<\/h3><ol class=\"steps\"><li>Abrir el PDM vigente/aprobado y registrar inversión total de Meta y TikTok, distribución por objetivo y presupuestos extra si los hay.<\/li><li>Cruzar con la Planilla de Activaciones: anuncios, campañas, fechas, estados, URLs, presupuestos y pausas previstas.<\/li><li>Revisar Meta Ads y TikTok Ads: gasto acumulado, presupuestos activos, fechas de finalización, posibles saldos y entrega real.<\/li><li>Definir si el mes requiere priorizar mayor cobertura, mayor frecuencia, crecimiento del perfil, contenido de lanzamientos o un evento puntual, sin cambiar los KPI acordados sin validación.<\/li><li>Si hay cambio de presupuesto o traspaso entre objetivos, registrar la decisión en la bitácora/Mainsheet y confirmar aprobación del responsable.<\/li><li>Al cerrar, reportar inversión real por campaña y explicar las diferencias entre AO, cambios contractuales y extraordinarios.<\/li><\/ol>"
    }
   ]
  },
  {
   "id": "objetivos-definiciones-y-lectura-de-resu",
   "title": "Objetivos, definiciones y lectura de resultados",
   "blocks": [
    {
     "t": "raw",
     "h": "<div class=\"tw\"><table class=\"left\"><thead><tr><th>Canal<\/th><th>Meta de referencia<\/th><th>Septiembre 2026<\/th><th>Lectura<\/th><\/tr><\/thead><tbody><tr><td>Meta Ads<\/td><td>500.000 personas alcanzadas y 7 impactos mensuales en Alcance.<\/td><td>621.653 de alcance total; 6,89 de frecuencia del bloque de Alcance.<\/td><td>La frecuencia total de todas las campañas figura como 6,69 en el detalle. No usar ambas como si fueran el mismo KPI.<\/td><\/tr><tr><td>TikTok Ads<\/td><td>500.000 personas alcanzadas y 4 impactos mensuales.<\/td><td>633.051 de alcance; frecuencia 4,22.<\/td><td>Cumplió ambos objetivos con USD 599,97 de inversión.<\/td><\/tr><tr><td>Perfil IG<\/td><td>Crecimiento sostenible de comunidad como complemento.<\/td><td>191 seguidores atribuibles a Tráfico al perfil.<\/td><td>No confundir con los +262 seguidores netos mostrados por la evolución orgánica.<\/td><\/tr><\/tbody><\/table><\/div><p>El alcance es una estimación de personas únicas por campaña/plataforma. Las impresiones son exposiciones totales y la frecuencia es la relación media entre impresiones y personas alcanzadas. No sumar alcance de Meta y TikTok para afirmar usuarios deduplicados, ni sumar alcance por campañas como personas adicionales.<\/p>"
    }
   ]
  },
  {
   "id": "evolucion-de-resultados-junio-septiembre",
   "title": "Evolución de resultados junio - septiembre 2026",
   "blocks": [
    {
     "t": "raw",
     "h": "<h3>Meta | datos de resumen mensual<\/h3><div class=\"tw\"><table class=\"\"><thead><tr><th>Mes<\/th><th>Alcance total<\/th><th>Frecuencia destacada de Alcance<\/th><th>Inversión USD<\/th><\/tr><\/thead><tbody><tr><td>Junio<\/td><td>494.732<\/td><td>4,80<\/td><td>923<\/td><\/tr><tr><td>Julio<\/td><td>574.605<\/td><td>4,78<\/td><td>874<\/td><\/tr><tr><td>Agosto<\/td><td>837.212<\/td><td>5,14<\/td><td>1.425<\/td><\/tr><tr><td>Septiembre<\/td><td>621.653<\/td><td>6,89 (Alcance combinado)<\/td><td>1.399<\/td><\/tr><\/tbody><\/table><\/div><p>En septiembre el alcance total bajó con respecto a agosto, de forma planificada: una mayor proporción de la inversión se destinó a Alcance Promocionado para aumentar la frecuencia. El balance de septiembre se consideró favorable porque superó los 500.000 alcanzados y llegó a 6,89 impactos en el bloque de alcance. Evitar medirlo como deterioro por el menor alcance absoluto.<\/p><h3>TikTok | datos de resumen mensual<\/h3><div class=\"tw\"><table class=\"\"><thead><tr><th>Mes<\/th><th>Alcance<\/th><th>Frecuencia<\/th><th>Inversión USD<\/th><\/tr><\/thead><tbody><tr><td>Junio<\/td><td>350.688<\/td><td>5,94<\/td><td>450<\/td><\/tr><tr><td>Julio<\/td><td>391.833<\/td><td>6,13<\/td><td>500<\/td><\/tr><tr><td>Agosto<\/td><td>387.291<\/td><td>7,14<\/td><td>600<\/td><\/tr><tr><td>Septiembre<\/td><td>633.051<\/td><td>4,22<\/td><td>599,97<\/td><\/tr><\/tbody><\/table><\/div><p>En TikTok, agosto registró una frecuencia muy alta sobre un universo inferior al objetivo de cobertura. Septiembre mejoró el balance: con inversión similar, el alcance creció 63,5%, mientras que la frecuencia bajó a 4,22, aún por encima del mínimo de cuatro. El costo por 1.000 personas alcanzadas pasó de USD 1,55 a USD 0,95.<\/p>"
    }
   ]
  },
  {
   "id": "septiembre-decisiones-de-optimizacion-y-",
   "title": "Septiembre: decisiones de optimización y resultados",
   "blocks": [
    {
     "t": "raw",
     "h": "<h3>Meta Ads<\/h3><div class=\"tw\"><table class=\"\"><thead><tr><th>Objetivo<\/th><th>Inversión<\/th><th>Dato de septiembre<\/th><\/tr><\/thead><tbody><tr><td>Alcance AO<\/td><td>USD 700<\/td><td>2.685.708 impresiones; 522.455 alcanzados; frecuencia 5,14.<\/td><\/tr><tr><td>Alcance Promocionado AO<\/td><td>USD 399<\/td><td>1.085.487 impresiones; 130.547 alcanzados; frecuencia 8,31.<\/td><\/tr><tr><td>Tráfico AO<\/td><td>USD 300<\/td><td>389.017 impresiones; 134.446 alcanzados; 7.754 clics de destino según el detalle de anuncios.<\/td><\/tr><tr class=\"total\"><td>Total Meta<\/td><td>USD 1.399<\/td><td>4.160.213 impresiones; 621.653 alcanzados; frecuencia total 6,69.<\/td><\/tr><\/tbody><\/table><\/div><p>El reporte comunica 6,89 como frecuencia del bloque de Alcance (Alcance AO + Alcance Promocionado), con 547.637 personas alcanzadas en el agregado específico de anuncios. El total transversal de las tres campañas registra 6,69. Se debe conservar esta distinción en Looker y One Page.<\/p><h3>TikTok Ads<\/h3><p>El Always On registró 2.671.874 impresiones, 633.051 personas alcanzadas, 4,22 impactos de frecuencia y USD 599,97 ejecutados. Las piezas destacadas fueron «Colágeno», «Versus» y «Podés». La pauta priorizó mantener exposición suficiente mientras ampliaba cobertura.<\/p><h3>Resultado de Instagram<\/h3><p>La campaña de Tráfico al perfil generó 191 nuevos seguidores atribuidos en septiembre. La serie histórica de comunidad del reporte muestra 2.663 seguidores al cierre de agosto y 2.925 al cierre de septiembre (+262 seguidores netos). Las dos cifras miden cosas distintas: atribución de una campaña vs. variación total de la comunidad.<\/p><div class=\"call warn\"><b class=\"t\">Control del reporte<\/b><p>La portada orgánica de septiembre muestra un indicador de 3.122 seguidores, pero la serie y el comentario de cierre muestran 2.925. Verificar filtros, período y fuente de la tarjeta antes de llevar una cifra única al reporte. También hay diferencias menores en la desagregación de interacciones. No corregirlas por cálculo sin comprobar la fuente.<\/p><\/div>"
    }
   ]
  },
  {
   "id": "trafico-al-perfil-contenidos-y-crecimien",
   "title": "Tráfico al perfil: contenidos y crecimiento de la comunidad",
   "blocks": [
    {
     "t": "raw",
     "h": "<p>La campaña de Tráfico complementa branding y sirve para identificar piezas que atraen visitas con posibilidad de convertirse en seguidores. El costo por clic no alcanza para juzgarla: debe observarse también cuántas personas pasan a seguir la cuenta y si ese crecimiento se sostiene.<\/p><div class=\"tw\"><table class=\"left\"><thead><tr><th>Mes<\/th><th>Evolución / señal<\/th><th>Contenido destacado<\/th><\/tr><\/thead><tbody><tr><td>Junio<\/td><td>El reporte atribuyó 221 seguidores nuevos a colaboraciones con creadores dentro de la etapa inicial de Tráfico.<\/td><td>Campaña asociada a contenidos con creadores y acciones del Mundial; diferenciar del sorteo.<\/td><\/tr><tr><td>Julio<\/td><td>Instagram pasó de 2.244 a 2.492 seguidores: +248 netos.<\/td><td>Mile Elizalde, recetas con Whey y Creatina Perform+; también se documentó una colaboración con Mati Xivillier.<\/td><\/tr><tr><td>Agosto<\/td><td>Instagram pasó de 2.492 a 2.663: +171 netos.<\/td><td>Mile Elizalde (+85 atribuidos en piezas destacadas), receta (+63) y contenido contextual de Spider-Man (+39).<\/td><\/tr><tr><td>Septiembre<\/td><td>Instagram pasó de 2.663 a 2.925: +262 netos; Tráfico al perfil aportó 191 atribuidos.<\/td><td>Desayunos proteicos (+67), barritas (+48) y Mati Xivillier (+43); son tres piezas destacadas, no la totalidad.<\/td><\/tr><\/tbody><\/table><\/div><div class=\"call\"><b class=\"t\">No sumar conceptos distintos<\/b><p>Seguidores atribuidos a anuncios, seguidores netos del mes y seguidores procedentes de piezas destacadas no se agregan entre sí. Para compararlos es imprescindible usar el mismo período, definición, fuente y ventana de atribución.<\/p><\/div>"
    }
   ]
  },
  {
   "id": "creatividad-y-aprendizajes-transferibles",
   "title": "Creatividad y aprendizajes transferibles",
   "blocks": [
    {
     "t": "raw",
     "h": "<div class=\"tw\"><table class=\"left\"><thead><tr><th>Territorio<\/th><th>Evidencia y uso recomendado<\/th><\/tr><\/thead><tbody><tr><td>Recetas / utilidad<\/td><td>Barritas proteicas sin horno y «4 formas fáciles de sumar proteína a tu día» rindieron muy bien en septiembre. La primera superó 272.000 personas alcanzadas entre las piezas destacadas; este tipo de contenido funciona tanto en alcance como en tráfico.<\/td><\/tr><tr><td>Creadores<\/td><td>Colaboraciones con Mile Elizalde y Mati Xivillier sumaron seguidores en los meses analizados. Evaluar por pieza y no generalizar resultados a todos los influencers.<\/td><\/tr><tr><td>Motivación / hábitos<\/td><td>«Podés», «Es hoy», «Planes» y «Versus» hacen tangible «Con SYLAB podés» en situaciones de entrenamiento: vencer excusas, empezar, sostener la constancia.<\/td><\/tr><tr><td>Producto en contexto<\/td><td>Whey Protein, Creatina Perform+, Colágeno y Advance se comunicaron mediante preparación, beneficio aprobado o situación de consumo, no solo con fotografías de pack.<\/td><\/tr><tr><td>Mundial / ideas especiales<\/td><td>Se trabajaron conceptos con Mundial y situaciones de deporte, Mass 3000, la activación de Tim Payne («No Payne, no gain») y contenidos de calle con shakers. Revisar cronogramas antes de asumir que una idea fue publicada o pautada.<\/td><\/tr><\/tbody><\/table><\/div><p>La recomendación creativa consolidada es combinar piezas cercanas y útiles (recetas, rutinas), creators y contenido de producto/motivación, adaptando formato y duración a cada plataforma. Las piezas vinculadas a deportes, carreras o eventos deben tener su propia ventana de publicación y pauta.<\/p>"
    }
   ]
  },
  {
   "id": "minuta-comercial-del-15-10-2026-contexto",
   "title": "Minuta comercial del 15/10/2026: contexto y oportunidades",
   "blocks": [
    {
     "t": "raw",
     "h": "<p>Los siguientes puntos surgieron en conversaciones con el cliente y complementan la estrategia de Paid. No equivalen por sí mismos a campañas aprobadas, presupuesto asignado ni compromisos cerrados.<\/p><div class=\"tw\"><table class=\"left\"><thead><tr><th>Tema<\/th><th>Situación referida<\/th><th>Implicancia para Paid<\/th><\/tr><\/thead><tbody><tr><td>Web nueva<\/td><td>Pendiente mejora de estética y de información sobre modos de preparación; importante, no urgente.<\/td><td>No asumir campañas de conversiones o venta online: actualmente la estrategia es de branding y no hay e-commerce. Si la web cambia, verificar destinos y materiales antes de utilizarla en nuevas piezas.<\/td><\/tr><tr><td>Código MSP<\/td><td>Se mencionó como pendiente.<\/td><td>Validar con el cliente los materiales y mensajes autorizados antes de promocionar productos específicos.<\/td><\/tr><tr><td>Proteína Isolada<\/td><td>Se comentó que la ofrecen Cibeles y SYLAB, con precio mencionado por encima de $4.500 (moneda no especificada en la minuta).<\/td><td>Contexto de producto/competencia; no usar ese precio como oferta vigente sin corroborarlo.<\/td><\/tr><tr><td>Racing<\/td><td>Se comentó una venta a Racing canalizada por farmacia.<\/td><td>Antecedente comercial; no afirmar un patrocinio ni activación publicitaria aprobada.<\/td><\/tr><tr><td>Posibles alianzas<\/td><td>Explorar Liga Universitaria, Racing, Los Teros y presencia en carreras / maratones.<\/td><td>Ideas a evaluar según convenios y calendario; no activar pauta ni asignar dinero sin aprobación.<\/td><\/tr><tr><td>Creadores y contenido<\/td><td>Se conversó sobre sorteos con creadores y mostrar consumo de productos en distintos horarios y rutinas.<\/td><td>Potencial de acciones específicas; coordinar aprobaciones creativas y PDM antes de ejecución.<\/td><\/tr><\/tbody><\/table><\/div>"
    }
   ]
  },
  {
   "id": "competencia-estacionalidad-y-publicos",
   "title": "Competencia, estacionalidad y públicos",
   "blocks": [
    {
     "t": "raw",
     "h": "<p>Los reportes siguen a Cibeles Nutrition, Wikimúsculos, FitnessLab y Mega Nutrition, entre otras referencias de la categoría. En septiembre se observó una mayor presencia de contenidos de running, colaboraciones con atletas, información de producto y recursos generados con IA. Esta información sirve para orientar contenido, no para deducir presupuestos o resultados de ventas ajenos.<\/p><ul><li>Meta: los grupos de 25 a 44 años y Montevideo/Canelones/Maldonado lideraron alcance; en septiembre las mujeres concentraron una mayor proporción de clics.<\/li><li>TikTok: las franjas de 18 a 34 años concentran buena parte de exposición y respuesta; en septiembre la distribución de clics por género fue prácticamente equilibrada.<\/li><li>La estacionalidad vinculada a running y carreras puede generar oportunidades, pero debe surgir del PDM y el calendario de acciones aprobado.<\/li><\/ul>"
    }
   ]
  },
  {
   "id": "reporting-fuentes-y-controles-de-calidad",
   "title": "Reporting: fuentes y controles de calidad",
   "blocks": [
    {
     "t": "raw",
     "h": "<ol class=\"steps\"><li>Revisar el período exacto y los filtros del reporte original de Looker Studio (el tablero de referencia vigente). Conservar ese enlace para elaborar los reportes mensuales.<\/li><li>Tomar inversión, alcance, frecuencia e impresiones directamente de Meta Ads y TikTok Ads para los mismos períodos; desglosar campañas, no sumar públicos duplicados.<\/li><li>En el comentario de Meta, diferenciar frecuencia de Alcance / Alcance Promocionado (6,89 en septiembre) de frecuencia global Meta (6,69).<\/li><li>Para Tráfico al perfil, anotar visitas, clics de destino, fuente de seguidores atribuidos y seguidores netos orgánicos con sus definiciones.<\/li><li>Si hay campañas extraordinarias, marcar el monto adicional y su efecto sobre comparabilidad de meses; junio es un ejemplo por el sorteo del Mundial.<\/li><li>Guardar un PDF/exportación del reporte presentado, más fecha de extracción; no reescribir los indicadores históricos sin documentar el cambio de fuente o filtro.<\/li><\/ol><div class=\"call warn\"><b class=\"t\">Puntos a corregir/validar<\/b><p>En septiembre el indicador «Seguidores» de la portada orgánica (3.122) no coincide con la serie y texto (2.925). En algunos cuadros, «Clics» se refiere a todos los clics y en otros a clics de destino. Comprobar el campo de origen antes de preparar el resumen definitivo.<\/p><\/div>"
    }
   ]
  },
  {
   "id": "riesgos-operativos-y-medicion",
   "title": "Riesgos operativos y medición",
   "blocks": [
    {
     "t": "raw",
     "h": "<ul><li>SYLAB actualmente no dispone de e-commerce. La pauta tiene como objetivo exclusivo el branding: alcance, frecuencia, recordación e interacción, con Tráfico al perfil para crecimiento de comunidad. No evaluar ni reportar la cuenta como si tuviera campañas de ventas online o ROAS.<\/li><li>Los rechazos o limitaciones de plataforma deben comprobarse en las cuentas vigentes antes de mencionarlos como incidente abierto. No se identificó en los reportes un bloqueo técnico específico todavía vigente de SYLAB.<\/li><li>Las cifras de seguimiento del perfil y las métricas publicitarias no son intercambiables. La misma pieza puede aportar alcance, clics y seguidores con fuentes distintas.<\/li><li>La fecha de publicación de un producto, los claims y el destino final deben revisarse si cambia el catálogo, la regulación o la nueva web.<\/li><\/ul>"
    }
   ]
  },
  {
   "id": "operativa-arco-particularidades-para-syl",
   "title": "Operativa ARCO: particularidades para SYLAB",
   "blocks": [
    {
     "t": "raw",
     "h": "<h3>Activaciones<\/h3><p>Controlar cronograma creativo, piezas finales y anuncios de Alcance/Tráfico/Interacción; validar la distribución exacta de cada mes en el PDM y Planilla de Activaciones. Para una colaboración, dejar documentados el creador, el contenido habilitado para pauta, el presupuesto y las fechas.<\/p><h3>Reportes<\/h3><p>El cierre mensual debe responder al objetivo de branding: cobertura de 500.000 personas, frecuencia 7 en Meta / 4 en TikTok y explicación de la evolución. Añadir crecimiento de comunidad cuando Tráfico al perfil esté activo. No evaluar la cuenta exclusivamente por CPC o clics.<\/p><h3>Chequeos<\/h3><p>Revisar diariamente campañas activas, rechazos, entrega y gastos frente a Planilla. En meses de inversión variable, poner especial atención al presupuesto diario y a campañas que quedaron activas del mes previo.<\/p><h3>Optimizaciones<\/h3><p>Registrar cambios en audiencia, presupuestos y objetivos junto con la hipótesis: más cobertura o más frecuencia. La redistribución entre Alcance, Alcance Promocionado y Tráfico debe conservar el objetivo del mes y tener aprobación cuando afecta al PDM.<\/p>"
    }
   ]
  },
  {
   "id": "accesos-y-recursos-operativos",
   "title": "Accesos y recursos operativos",
   "blocks": [
    {
     "t": "raw",
     "h": "<p>Enlaces recuperados de la carpeta «Syl» de marcadores de Chrome. Requieren acceso de la persona asignada y pueden necesitar actualización si cambia la propiedad de cuentas o se migra un recurso.<\/p><div class=\"links\"><a class=\"lk\" href=\"https://adsmanager.facebook.com/adsmanager/manage/campaigns?global_scope_id=741152185920682&business_id=741152185920682&act=1099900681863670&redirect_session_id=7b0e814a-41ab-4c31-afaf-244f77cd649f#\" target=\"_blank\" rel=\"noopener\"><b>Meta Ads SYLAB<i>↗<\/i><\/b><span>Campañas de Alcance, Alcance Promocionado, Tráfico e Interacción.<\/span><em>adsmanager.facebook.com<\/em><\/a><a class=\"lk\" href=\"https://ads.tiktok.com/i18n/manage/campaign?aadvid=7623485516931170311\" target=\"_blank\" rel=\"noopener\"><b>TikTok Ads SYLAB<i>↗<\/i><\/b><span>Campaña Always On, públicos, presupuesto y frecuencia.<\/span><em>ads.tiktok.com<\/em><\/a><a class=\"lk\" href=\"https://docs.google.com/spreadsheets/d/1xcstTSLsC9Z4MBDeeK9Jc42YhSVDkGTP/edit?gid=162494037#gid=162494037\" target=\"_blank\" rel=\"noopener\"><b>Planilla de Activaciones<i>↗<\/i><\/b><span>Referencia para presupuesto y anuncios del mes vigente.<\/span><em>docs.google.com<\/em><\/a><a class=\"lk\" href=\"https://docs.google.com/spreadsheets/d/11z2e-QdqB9KruF7IPTBpHwJT62gsfQ7US6s28H-cB3E/edit?gid=513007987#gid=513007987\" target=\"_blank\" rel=\"noopener\"><b>Mainsheet SYLAB<i>↗<\/i><\/b><span>Seguimiento y registros auxiliares de la cuenta.<\/span><em>docs.google.com<\/em><\/a><a class=\"lk\" href=\"https://datastudio.google.com/u/0/reporting/15be9c38-b455-45ee-8a64-4048176c3b69/page/p_qhl9y9j2pd\" target=\"_blank\" rel=\"noopener\"><b>Looker Studio - reporte<i>↗<\/i><\/b><span>Reporte oficial de Looker Studio utilizado para los cierres mensuales de SYLAB.<\/span><em>datastudio.google.com<\/em><\/a><a class=\"lk\" href=\"https://wasabimd-my.sharepoint.com/shared?id=%2Fpersonal%2Fwasabinos_wasabi_com_uy%2FDocuments%2FWasabi%20Digital%2FEQUIPO%20PEPPERS%2FSYLAB&viewid=b855fcfb-0a16-45e2-b04a-364614209379\" target=\"_blank\" rel=\"noopener\"><b>Carpeta SYLAB (SharePoint)<i>↗<\/i><\/b><span>Cronogramas, creatividades, reportes y documentación de marca.<\/span><em>wasabimd-my.sharepoint.com<\/em><\/a><\/div>"
    }

  {
   "id": "matriz-de-decisiones-implementacion-y-es",
   "title": "Matriz de decisiones, implementación y estado",
   "blocks": [
    {
     "t": "raw",
     "h": "<div class=\"tw\"><table class=\"left\"><thead><tr><th>Estado<\/th><th>Hecho / decisión<\/th><th>Lectura al tomar la cuenta<\/th><\/tr><\/thead><tbody><tr><td><span class=\"tag ok\">IMPLEMENTADO<\/span><\/td><td>Junio: reducción contractual del Alcance; apertura/continuidad de Tráfico al perfil y pauta extra de sorteo mundialista.<\/td><td>No extrapolar ese presupuesto reducido al resto del año.<\/td><\/tr><tr><td><span class=\"tag ok\">IMPLEMENTADO<\/span><\/td><td>Julio: segundo mes de reducción contractual; agosto vuelve a subir inversión.<\/td><td>La comparación junio/agosto requiere distinguir escala de inversión.<\/td><\/tr><tr><td><span class=\"tag ok\">IMPLEMENTADO<\/span><\/td><td>Septiembre: combinación Alcance + Alcance Promocionado en Meta; TikTok amplió cobertura con frecuencia de 4,22.<\/td><td>Estrategia de balance que cumplió objetivos de branding.<\/td><\/tr><tr><td>RESULTADO CONFIRMADO<\/td><td>Septiembre: Tráfico al perfil aporta 191 seguidores atribuidos.<\/td><td>No confundir con +262 seguidores netos del perfil.<\/td><\/tr><tr><td><span class=\"tag media\">CONVERSADO<\/span><\/td><td>15/10: nueva web, código MSP, Isolada, distribución y oportunidades deportivas/creadores.<\/td><td>No publicar claims nuevos ni asignar presupuesto sin coordinación.<\/td><\/tr><tr><td><span class=\"tag pend\">A VALIDAR<\/span><\/td><td>PDM y campaña efectivamente activos en octubre/noviembre.<\/td><td>Planilla + Ads Manager + TikTok; responsable final de cuenta.<\/td><\/tr><tr><td><span class=\"tag pend\">A VALIDAR<\/span><\/td><td>Indicador de seguidores 3.122 vs 2.925 y diferencias entre clics totales y de destino.<\/td><td>Auditar filtros y campos del reporte antes de consolidar.<\/td><\/tr><\/tbody><\/table><\/div>"
    }
   ]
  },
  {
   "id": "continuidad-checklist-para-quien-tome-la",
   "title": "Continuidad: checklist para quien tome la cuenta",
   "blocks": [
    {
     "t": "raw",
     "h": "<ol class=\"steps\"><li>Identificar al Paid responsable: la distribución definitiva entre integrantes del equipo no quedó documentada en las fuentes utilizadas.<\/li><li>Abrir PDM de octubre/noviembre y cruzar con Planilla de Activaciones. Confirmar total, pesos de Meta/TikTok, Alcance/Alcance Promocionado/Tráfico y acciones extra.<\/li><li>Verificar que los activos publicitarios, medios de pago, fechas, públicos, estados y destinos reales coincidan con la planilla.<\/li><li>Revisar el estado actual de las piezas en circulación y las colaboraciones autorizadas para pauta; no reactivar anuncios de acciones ya finalizadas.<\/li><li>Confirmar qué versión de Looker se usará para cierre, preparar la comparación de alcance/frecuencia y conciliar métricas de crecimiento en Instagram.<\/li><li>Tomar nota de la minuta del 15/10 y consultar el avance de web, MSP, Racing, colaboraciones y contenido; únicamente activar si hay confirmación y presupuesto.<\/li><li>Registrar cualquier optimización en bitácora, preservando el PDM variable y la distinción entre criterios aprobados y escenarios propuestos.<\/li><\/ol>"
    }
   ]
  },
  {
   "id": "fuentes-y-vigencia",
   "title": "Fuentes y vigencia",
   "blocks": [
    {
     "t": "raw",
     "h": "<p>Fuentes documentales: reportes SYLAB de junio, julio, agosto y septiembre 2026; versión preliminar de septiembre; antecedentes de estrategia y creatividad 2026; minuta de reunión del 15/10/2026; carpeta de marcadores «Syl»; proceso ARCO de WASABI. Último cierre cuantitativo utilizado: septiembre de 2026.<\/p><p>Las cifras de medios del documento son de períodos históricos ya cerrados; no sustituyen un PDM vigente. Cuando el mes nuevo esté aprobado, actualizar la sección de control de inversión y dejar el mes anterior como histórico, sin sobrescribirlo.<\/p>"
    }
   ]

 "sections": [

   "id": "lectura-inicial",
   "title": "Lectura inicial",
   "blocks": [
    {
     "t": "raw",
     "h": "<div class=\"call\"><b class=\"t\">Criterio de lectura<\/b><p>Este es un traspaso centrado en branding. Alcance y frecuencia son los KPI de pauta principales; concursos, visitas al perfil y nuevos seguidores son acciones de apoyo. Cada presupuesto extra y cada sorteo deben analizarse por separado del Always On.<\/p><\/div>"
    }
